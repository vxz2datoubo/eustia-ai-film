name: REG Asset Binary Locator Remediation 001

on:
  push:
    branches:
      - gpt/reg-asset-binary-locator-remediation-001
    paths:
      - '11_验收/binary_locator_remediation/**'
      - '.github/workflows/reg-asset-binary-locator-remediation-001.yml'
  pull_request:
    branches:
      - gpt/asset-retrieval-cross-session-v1
    paths:
      - '11_验收/binary_locator_remediation/**'
      - '.github/workflows/reg-asset-binary-locator-remediation-001.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reg-asset-binary-locator-remediation-001-${{ github.ref }}
  cancel-in-progress: true

jobs:
  github-blob-synthetic-poc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - run: python '11_验收/binary_locator_remediation/github_blob_poc.py'

  r2-phase2a-contract-and-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EUSTIA_R2_POC_ENABLED: ${{ secrets.EUSTIA_R2_POC_ENABLED }}
      R2_ENDPOINT_URL: ${{ secrets.EUSTIA_R2_ENDPOINT_URL }}
      R2_ACCESS_KEY_ID: ${{ secrets.EUSTIA_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.EUSTIA_R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ secrets.EUSTIA_R2_BUCKET }}
      R2_TEST_PREFIX: eustia-binary-locator-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow boto3
      - name: Structural fail-closed contract tests
        run: python '11_验收/binary_locator_remediation/r2_phase2a_poc.py' --structural
      - name: Report external capability gate without leaking values
        shell: bash
        run: |
          set +e
          python '11_验收/binary_locator_remediation/r2_phase2a_poc.py' --capability-report
          code=$?
          if [ "$code" -eq 78 ]; then
            echo 'PHASE_2A_R2_LIVE_STATUS=STOP_FOR_EXTERNAL_CAPABILITY' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
      - name: Real authenticated R2 provider runtime PoC
        if: env.EUSTIA_R2_POC_ENABLED == 'true'
        run: python '11_验收/binary_locator_remediation/r2_phase2a_poc.py' --live

  kv-phase2a-contract-and-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EUSTIA_KV_POC_ENABLED: ${{ secrets.EUSTIA_KV_POC_ENABLED }}
      EUSTIA_KV_API_TOKEN: ${{ secrets.EUSTIA_KV_API_TOKEN }}
      EUSTIA_KV_ACCOUNT_ID: ${{ secrets.EUSTIA_KV_ACCOUNT_ID }}
      EUSTIA_KV_NAMESPACE_ID: ${{ secrets.EUSTIA_KV_NAMESPACE_ID }}
      EUSTIA_KV_NAMESPACE: ${{ secrets.EUSTIA_KV_NAMESPACE }}
      KV_TEST_PREFIX: eustia-binary-locator-poc
      EUSTIA_KV_OUTPUT_DIR: /tmp/eustia-kv-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Workers KV structural fail-closed contract tests
        run: python '11_验收/binary_locator_remediation/kv_phase2a_poc.py' --structural
      - name: Report Workers KV capability gate without leaking values
        shell: bash
        run: |
          set +e
          python '11_验收/binary_locator_remediation/kv_phase2a_poc.py' --capability-report
          code=$?
          if [ "$code" -eq 78 ]; then
            echo 'PHASE_2A_KV_LIVE_STATUS=STOP_FOR_EXTERNAL_CAPABILITY' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          exit "$code"
      - name: Real authenticated Workers KV provider runtime PoC
        if: env.EUSTIA_KV_POC_ENABLED == 'true'
        run: python '11_验收/binary_locator_remediation/kv_phase2a_poc.py' --live
      - name: Upload private synthetic binary bridge artifact
        if: env.EUSTIA_KV_POC_ENABLED == 'true' && success()
        uses: actions/upload-artifact@v4
        with:
          name: kv-runtime-binary-probe-${{ github.run_id }}
          path: /tmp/eustia-kv-poc
          if-no-files-found: error
          retention-days: 1
