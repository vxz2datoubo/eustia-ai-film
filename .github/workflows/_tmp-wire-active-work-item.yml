name: tmp-wire-active-work-item

on:
  push:
    branches:
      - gpt/p0-active-work-item-resolution-gate
    paths:
      - 'tools/_tmp_wire_active_work_item.py'
      - '.github/workflows/_tmp-wire-active-work-item.yml'
      - '10_运行时/active_work_item_resolution_gate.yaml'
      - '09_资料证据/活动工作项解析与修订状态证据索引.md'
      - '11_验收/active_work_item_resolution_regression_cases.yaml'
      - 'tools/learning_retriever/learning_retriever/active_work_item.py'
      - 'tools/learning_retriever/tests/test_active_work_item.py'

permissions:
  contents: write

jobs:
  wire-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/p0-active-work-item-resolution-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest PyYAML
      - name: Apply deterministic wiring
        run: python tools/_tmp_wire_active_work_item.py
      - name: Run active work item targeted regressions
        run: PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests/test_active_work_item.py
      - name: Run full learning retriever regressions
        run: PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests
      - name: Verify canonical retrieval index
        run: PYTHONPATH=tools/learning_retriever python -m learning_retriever.cli --project-root . --validate-index
      - name: Verify feature compiler semantic dependencies
        run: PYTHONPATH=tools/learning_retriever python -m learning_retriever.cli --project-root . --validate-feature-compiler
      - name: Commit wiring if changed
        run: |
          if git diff --quiet; then
            echo 'No wiring changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PROJECT_INDEX.yaml \
            07_连续性与生产状态/连续性与当前生产状态.md \
            10_运行时/director_feature_compiler.yaml \
            10_运行时/read_sets.yaml \
            10_运行时/source_authority.yaml \
            10_运行时/learning_application_gate.yaml \
            10_运行时/write_routes.yaml \
            tools/learning_retriever/README.md \
            tools/learning_retriever/learning_retriever/__init__.py \
            tools/learning_retriever/learning_retriever/cli.py \
            tools/learning_retriever/learning_retriever/runtime.py \
            tools/learning_retriever/tests/test_feature_compiler.py
          git commit -m 'Wire active work item resolution before directing'
          git push origin HEAD:gpt/p0-active-work-item-resolution-gate
