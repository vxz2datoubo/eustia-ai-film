name: tmp-wire-targeted-repair-current

on:
  push:
    branches:
      - gpt/targeted-repair-planner-runtime
    paths:
      - '.github/workflows/_tmp-wire-targeted-repair-current.yml'

permissions:
  contents: write

jobs:
  wire-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/targeted-repair-planner-runtime
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Wire non-workflow bindings
        run: |
          python tools/learning_retriever/_tmp_wire_targeted_repair_current.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Wire Targeted Repair planner into current runtime"
      - name: Validate current stack
        run: |
          python -m pip install pytest PyYAML
          PYTHONPATH=tools/learning_retriever python -m learning_retriever.cli --project-root . --validate-index
          PYTHONPATH=tools/learning_retriever python -m learning_retriever.cli --project-root . --validate-feature-compiler
          PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests/test_cinematic_intent_contract.py -q
          PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests/test_expected_observed_eval.py -q
          PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests/test_targeted_repair.py -q
          PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests -q
      - name: Push non-workflow wiring
        run: |
          git push origin HEAD:gpt/targeted-repair-planner-runtime
