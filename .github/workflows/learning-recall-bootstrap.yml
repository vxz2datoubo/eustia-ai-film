name: Learning Recall Bootstrap Apply

on:
  push:
    branches:
      - gpt/learning-smart-recall-v1
    paths:
      - 'tools/learning_retriever/_bootstrap_patch.py'
      - '.github/workflows/learning-recall-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/learning-smart-recall-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply targeted canonical integration patch
        run: python tools/learning_retriever/_bootstrap_patch.py
      - name: Install retriever dependencies
        run: python -m pip install -r tools/learning_retriever/requirements.txt
      - name: Parse all project YAML after patch
        run: python -c "from pathlib import Path; import yaml; [yaml.safe_load(p.read_text(encoding='utf-8')) for p in Path('.').rglob('*.yaml')]; print('YAML_PARSE=PASS')"
      - name: Validate recall index against canonical refs
        run: python -m learning_retriever.cli --project-root ../.. --validate-index
        working-directory: tools/learning_retriever
      - name: Run Learning Smart Recall regression
        run: python -m unittest discover -s tests -v
        working-directory: tools/learning_retriever
      - name: Commit integrated runtime
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Learning Smart Recall runtime gates"
          git push origin HEAD:gpt/learning-smart-recall-v1

# second push after workflow registration; temporary bootstrap removes itself
