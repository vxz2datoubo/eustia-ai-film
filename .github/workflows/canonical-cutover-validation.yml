name: canonical-cutover-validation

on:
  pull_request:
    paths:
      - 'PROJECT_INDEX.yaml'
      - 'CHATGPT_PROJECT_INSTRUCTION.md'
      - 'MIGRATION_STATUS.md'
      - 'AI_HANDOFF.yaml'
      - '01_AI电影系统/**'
      - '02_AI电影项目记忆/**'
      - '03_剧本与改编/**'
      - '04_角色与表演/**'
      - '05_场景与空间/**'
      - '06_视觉资产/**'
      - '07_连续性与生产状态/**'
      - '08_系统学习/**'
      - '09_资料证据/**'
      - '10_运行时/source_authority.yaml'
      - '10_运行时/read_sets.yaml'
      - '10_运行时/write_routes.yaml'
      - '10_运行时/director_route_index.yaml'
      - '11_验收/legacy_authority_regression_cases.yaml'
      - '11_验收/validate_canonical_cutover.ps1'
      - '.github/workflows/canonical-cutover-validation.yml'
  workflow_dispatch:

jobs:
  canonical-cutover-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate head
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          Write-Host "EXACT_HEAD=$actual"
          if ($actual -ne $env:EXPECTED_PR_HEAD) {
            throw "exact-head mismatch: actual=$actual expected=$env:EXPECTED_PR_HEAD"
          }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependency
        run: python -m pip install PyYAML

      - name: Run full canonical cutover and legacy-authority validation
        shell: pwsh
        run: ./11_验收/validate_canonical_cutover.ps1 -RepositoryRoot $PWD
