name: tmp-p1-lock-authority-remediation

on:
  push:
    branches:
      - gpt/cinematic-intent-contract-compiler
    paths:
      - 'tools/learning_retriever/_tmp_p1_lock_authority_remediation.py'
      - '.github/workflows/_tmp-p1-lock-authority-remediation.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/cinematic-intent-contract-compiler
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply P1 remediation
        run: python tools/learning_retriever/_tmp_p1_lock_authority_remediation.py
      - name: Validate targeted and full runtime suites
        run: |
          python -m pip install pytest PyYAML
          PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests/test_cinematic_intent_contract.py -q
          PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests/test_cinematic_intent_contract_hardening.py -q
          PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests -q
      - name: Commit bounded remediation only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/learning_retriever/learning_retriever/cinematic_intent.py tools/learning_retriever/tests/test_cinematic_intent_contract.py tools/learning_retriever/tests/test_cinematic_intent_contract_hardening.py tools/learning_retriever/README.md
          git commit -m "Harden CinematicIntent lock authority capability"
          git push origin HEAD:gpt/cinematic-intent-contract-compiler
