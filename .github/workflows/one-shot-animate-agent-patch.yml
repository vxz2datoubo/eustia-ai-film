name: one-shot-animate-agent-patch

on:
  push:
    branches:
      - gpt/learning-smart-recall-v1-1-current-main-v3

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/learning-smart-recall-v1-1-current-main-v3
          fetch-depth: 0

      - name: Apply exact bounded animate-agent wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/learning_retriever/learning_retriever/feature_compiler.py')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'from .route_resolver import RouteResolutionError, resolve_hard_routes\n',
                  'from .entity_semantics import bounded_animate_agent_leader\nfrom .route_resolver import RouteResolutionError, resolve_hard_routes\n',
              ),
              (
                  '''        """Parse facing predicates with open-vocabulary bounded subject syntax.\n\n        Positive actor recognition is structural, not a fixed role/name whitelist:\n        a bounded CJK clause leader may function as the subject unless stronger\n        camera/body/non-actor evidence applies. Known camera and architecture\n        surfaces are negative guards, not positive actor authority. Ambiguous\n        lexical `王朝/前朝/本朝 + 向` cross-token forms fail closed rather than\n        being promoted into a body-orientation predicate.\n        """''',
                  '''        """Parse facing predicates only after bounded animate-agent proof.\n\n        A syntactic clause leader is not automatically a character. Positive\n        evidence comes from known actor/pronoun semantics, productive human-role\n        morphology, or an explicit embodied turn transition for an otherwise\n        unseen bounded subject. Strong structure/object morphology remains\n        fail-closed. Camera/body and dynasty cross-token boundaries are preserved.\n        """''',
              ),
              (
                  '''        non_actor_heads = (\n            "城堡", "建筑", "街道", "道路", "房间", "大厅", "墙", "大门", "门", "窗口", "窗户",\n            "舞台", "出口", "画面", "背景", "场景", "天空", "地面",\n        )\n        non_actor_facets = (\n            "正面", "背面", "侧面", "入口", "出口", "外墙", "内墙", "顶部", "底部",\n        )\n''',
                  '',
              ),
              (
                  '''        def generic_actor_leader(value: str) -> bool:\n            normalized = value.strip()\n            if not normalized or len(normalized) > max_prefix_chars:\n                return False\n            if not all(("\\u4e00" <= char <= "\\u9fff") or char.isspace() for char in normalized):\n                return False\n            if normalized in non_actor_heads:\n                return False\n            if any(\n                normalized == head + facet\n                for head in non_actor_heads\n                for facet in non_actor_facets\n            ):\n                return False\n            return True\n''',
                  '''        def proven_actor_leader(value: str, action: str) -> bool:\n            return bounded_animate_agent_leader(\n                value,\n                action=action,\n                known_actor_terms=actor_terms,\n                modifier_tail_validator=bounded_modifier_tail,\n                max_chars=max_prefix_chars,\n            )\n''',
              ),
              (
                  '            if generic_actor_leader(normalized):\n                return "ACTOR"\n',
                  '            if proven_actor_leader(normalized, action):\n                return "ACTOR"\n',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'feature_compiler exact replacement count={count} for: {old[:80]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('tools/learning_retriever/tests/test_feature_compiler_animate_agent_boundary.py')
          test_text = test_path.read_text(encoding='utf-8')
          old_import = '''import unittest\n\nfrom learning_retriever.feature_compiler import FeatureCompilationError, compile_director_features, compile_retrieval_task\n'''
          new_import = '''from pathlib import Path\nimport unittest\n\nimport yaml\n\nfrom learning_retriever.feature_compiler import FeatureCompilationError, compile_director_features, compile_retrieval_task\n\n\nREPO_ROOT = Path(__file__).resolve().parents[3]\nROUTE_DATA = yaml.safe_load((REPO_ROOT / "10_运行时/director_route_index.yaml").read_text(encoding="utf-8"))\n'''
          if test_text.count(old_import) != 1:
              raise SystemExit('test import replacement did not match exactly once')
          test_text = test_text.replace(old_import, new_import, 1)
          old_call = '        task = compile_retrieval_task("钟楼面向圣女。", strict=False)\n'
          new_call = '        task = compile_retrieval_task("钟楼面向圣女。", route_data=ROUTE_DATA, strict=False)\n'
          if test_text.count(old_call) != 1:
              raise SystemExit('route-data test replacement did not match exactly once')
          test_text = test_text.replace(old_call, new_call, 1)
          test_path.write_text(test_text, encoding='utf-8')
          PY

      - name: Self-delete one-shot workflow and commit patch
        shell: bash
        run: |
          git rm .github/workflows/one-shot-animate-agent-patch.yml
          git add tools/learning_retriever/learning_retriever/feature_compiler.py \
                  tools/learning_retriever/tests/test_feature_compiler_animate_agent_boundary.py
          git diff --cached --check
          git diff --cached --stat
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Wire bounded animate-agent proof into facing parser"
          git push origin HEAD:gpt/learning-smart-recall-v1-1-current-main-v3
