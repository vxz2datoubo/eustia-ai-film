name: Learning Smart Recall

on:
  pull_request:
    paths:
      - 'PROJECT_INDEX.yaml'
      - '07_连续性与生产状态/连续性与当前生产状态.md'
      - '09_资料证据/活动工作项解析与修订状态证据索引.md'
      - '10_运行时/active_work_item_resolution_gate.yaml'
      - '10_运行时/director_feature_compiler.yaml'
      - '10_运行时/learning_recall_index.yaml'
      - '10_运行时/learning_application_gate.yaml'
      - '10_运行时/director_route_index.yaml'
      - '10_运行时/read_sets.yaml'
      - '10_运行时/write_routes.yaml'
      - '08_系统学习/**'
      - '11_验收/active_work_item_resolution_regression_cases.yaml'
      - '11_验收/director_feature_compiler_regression_cases.yaml'
      - '11_验收/learning_application_gate_regression_cases.yaml'
      - '11_验收/golden_prompt_cases.yaml'
      - 'tools/learning_retriever/**'
      - '.github/workflows/learning-recall.yml'
  push:
    branches:
      - main
      - 'gpt/learning-smart-recall-v1'
    paths:
      - 'PROJECT_INDEX.yaml'
      - '07_连续性与生产状态/连续性与当前生产状态.md'
      - '09_资料证据/活动工作项解析与修订状态证据索引.md'
      - '10_运行时/active_work_item_resolution_gate.yaml'
      - '10_运行时/director_feature_compiler.yaml'
      - '10_运行时/learning_recall_index.yaml'
      - '10_运行时/learning_application_gate.yaml'
      - '10_运行时/director_route_index.yaml'
      - '10_运行时/read_sets.yaml'
      - '10_运行时/write_routes.yaml'
      - '08_系统学习/**'
      - '11_验收/active_work_item_resolution_regression_cases.yaml'
      - '11_验收/director_feature_compiler_regression_cases.yaml'
      - '11_验收/learning_application_gate_regression_cases.yaml'
      - '11_验收/golden_prompt_cases.yaml'
      - 'tools/learning_retriever/**'
      - '.github/workflows/learning-recall.yml'

jobs:
  learning-recall:
    name: ${{ matrix.os }}-py313-smart-recall-regression
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: tools/learning_retriever
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout provenance
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python -c "import os,subprocess; expected=os.getenv('EXPECTED_PR_HEAD',''); actual=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(); print(f'CHECKED_HEAD={actual}'); assert (not expected) or actual == expected, (actual, expected)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Parse project YAML
        run: python -c "from pathlib import Path; import yaml; [yaml.safe_load(p.read_text(encoding='utf-8')) for p in Path('../..').rglob('*.yaml')]; print('YAML_PARSE=PASS')"
      - name: Validate compact recall index
        run: python -m learning_retriever.cli --project-root ../.. --validate-index
      - name: Run active work item resolution regression
        run: python -m unittest tests.test_active_work_item -v
      - name: Run retrieval regression
        run: python -m unittest discover -s tests -v
