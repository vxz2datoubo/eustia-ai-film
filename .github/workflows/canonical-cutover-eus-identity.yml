name: canonical-cutover-eus-identity

on:
  pull_request:
    paths:
      - '11_验收/validate_canonical_cutover.ps1'
      - '05_场景与空间/00_项目地图文件.md'
      - '06_视觉资产/视觉资产登记库.md'
      - '10_运行时/scene_asset_identity_schema.yaml'
      - '.github/workflows/canonical-cutover-eus-identity.yml'
  workflow_dispatch:

jobs:
  full-cutover-semantic-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python -c "import os,subprocess; expected=os.environ['EXPECTED_PR_HEAD']; actual=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(); print(f'EXACT_HEAD={actual}'); assert actual == expected, (actual, expected)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependency
        run: python -m pip install PyYAML

      - name: Full canonical cutover must pass
        shell: pwsh
        run: ./11_验收/validate_canonical_cutover.ps1 -RepositoryRoot .

      - name: Fault injection - corrupt same-anchor 180 relation must fail
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import os

          src = Path('.').resolve()
          dst = Path(os.environ['RUNNER_TEMP']) / 'fault-rel-000004'
          if dst.exists():
              shutil.rmtree(dst)
          shutil.copytree(src, dst, ignore=shutil.ignore_patterns('.git'))
          p = dst / '06_视觉资产/视觉资产登记库.md'
          text = p.read_text(encoding='utf-8')
          marker = '''  EUS-REL-000004:\n    relation_type: same_anchor_180\n    member_view_ids: [EUS-VIEW-000010, EUS-VIEW-000011]\n    status: active\n'''
          replacement = '''  EUS-REL-000004:\n    relation_type: same_anchor_90\n    member_view_ids: [EUS-VIEW-000010, EUS-VIEW-000011]\n    status: active\n'''
          if text.count(marker) != 1:
              raise SystemExit('expected exactly one EUS-REL-000004 invariant block')
          p.write_text(text.replace(marker, replacement, 1), encoding='utf-8')
          print(dst)
          PY
          set +e
          pwsh -NoProfile -File "$RUNNER_TEMP/fault-rel-000004/11_验收/validate_canonical_cutover.ps1" -RepositoryRoot "$RUNNER_TEMP/fault-rel-000004" >"$RUNNER_TEMP/rel-fault.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/rel-fault.log"
          if [ "$status" -eq 0 ]; then
            echo 'validator incorrectly accepted corrupted EUS-REL-000004' >&2
            exit 1
          fi
          grep -q 'EUS-REL-000004' "$RUNNER_TEMP/rel-fault.log"

      - name: Fault injection - corrupt north-view binding must fail
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import os

          src = Path('.').resolve()
          dst = Path(os.environ['RUNNER_TEMP']) / 'fault-view-000010'
          if dst.exists():
              shutil.rmtree(dst)
          shutil.copytree(src, dst, ignore=shutil.ignore_patterns('.git'))
          p = dst / '06_视觉资产/视觉资产登记库.md'
          text = p.read_text(encoding='utf-8')
          start = text.index('  EUS-VIEW-000010:')
          end = text.index('  EUS-VIEW-000011:', start)
          block = text[start:end]
          old = '    camera_anchor_id: EUS-CAM-000009\n'
          new = '    camera_anchor_id: EUS-CAM-999999\n'
          if block.count(old) != 1:
              raise SystemExit('expected exactly one north-view camera binding')
          block = block.replace(old, new, 1)
          p.write_text(text[:start] + block + text[end:], encoding='utf-8')
          print(dst)
          PY
          set +e
          pwsh -NoProfile -File "$RUNNER_TEMP/fault-view-000010/11_验收/validate_canonical_cutover.ps1" -RepositoryRoot "$RUNNER_TEMP/fault-view-000010" >"$RUNNER_TEMP/view-fault.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/view-fault.log"
          if [ "$status" -eq 0 ]; then
            echo 'validator incorrectly accepted corrupted EUS-VIEW-000010 binding' >&2
            exit 1
          fi
          grep -q 'EUS-VIEW-000010' "$RUNNER_TEMP/view-fault.log"
