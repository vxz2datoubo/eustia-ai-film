name: one-shot-eus-cutover-validator-patch

on:
  push:
    branches:
      - gpt/canonical-cutover-eus-scene-identity

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/canonical-cutover-eus-scene-identity
          fetch-depth: 0

      - name: Replace retired scene-view literals with current semantic invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('11_验收/validate_canonical_cutover.ps1')
          text = path.read_text(encoding='utf-8')
          old = '''Require-Content -Label 'map' -Content $map -Pattern 'SCN-CHURCH-BELLTOWER-SOUTH-001'\nRequire-Content -Label 'map' -Content $map -Pattern 'SCN-CHECKPOINT-MIDDLE-GATE-001'\nRequire-Content -Label 'map' -Content $map -Pattern 'SCN-BRIDGE-SOUTH-FACE-001'\nRequire-Content -Label 'assets' -Content $assets -Pattern 'SCN-CHURCH-BELLTOWER-LEFT-001'\nRequire-Content -Label 'assets' -Content $assets -Pattern 'SCN-CHURCH-BELLTOWER-RIGHT-001'\n'''
          new = '''# EUS scene identity migration: assert current semantic structure rather than\n# retired scene-view literals.  Still-unmigrated legacy identities are kept\n# explicitly below and remain fail-closed requirements.\nRequire-Content -Label 'map' -Content $map -Pattern 'EUS-SCN-000005'\nRequire-Content -Label 'map' -Content $map -Pattern 'EUS-CAM-000009'\nRequire-Content -Label 'map' -Content $map -Pattern 'EUS-VIEW-000010'\nRequire-Content -Label 'map' -Content $map -Pattern 'EUS-VIEW-000011'\nRequire-Content -Label 'map' -Content $map -Pattern 'EUS-VIEW-000012'\nRequire-Content -Label 'map' -Content $map -Pattern 'EUS-REL-000004 same_anchor_180'\nRequire-Content -Label 'map' -Content $map -Pattern 'EUS-REL-000005 / EUS-REL-000006 same_anchor_90'\nRequire-Content -Label 'map' -Content $map -Pattern 'SCN-CHECKPOINT-MIDDLE-GATE-001'\nRequire-Content -Label 'assets' -Content $assets -Pattern '(?s)EUS-VIEW-000010:\\s+scene_id: EUS-SCN-000005\\s+camera_anchor_id: EUS-CAM-000009.*?facing_cardinal: N.*?status: active\\s+default_media_asset_id: EUS-AST-000010'\nRequire-Content -Label 'assets' -Content $assets -Pattern '(?s)EUS-VIEW-000011:\\s+scene_id: EUS-SCN-000005\\s+camera_anchor_id: EUS-CAM-000009.*?facing_cardinal: S.*?status: active\\s+default_media_asset_id: EUS-AST-000011'\nRequire-Content -Label 'assets' -Content $assets -Pattern '(?s)EUS-VIEW-000012:\\s+scene_id: EUS-SCN-000005\\s+camera_anchor_id: EUS-CAM-000009.*?facing_cardinal: E.*?status: active\\s+default_media_asset_id: EUS-AST-000012'\nRequire-Content -Label 'assets' -Content $assets -Pattern '(?s)EUS-REL-000004:\\s+relation_type: same_anchor_180\\s+member_view_ids: \\[EUS-VIEW-000010, EUS-VIEW-000011\\]\\s+status: active'\nRequire-Content -Label 'assets' -Content $assets -Pattern '(?s)EUS-REL-000005:\\s+relation_type: same_anchor_90\\s+member_view_ids: \\[EUS-VIEW-000010, EUS-VIEW-000012\\]\\s+status: active'\nRequire-Content -Label 'assets' -Content $assets -Pattern '(?s)EUS-REL-000006:\\s+relation_type: same_anchor_90\\s+member_view_ids: \\[EUS-VIEW-000011, EUS-VIEW-000012\\]\\s+status: active'\nRequire-Content -Label 'assets' -Content $assets -Pattern 'SCN-CHURCH-BELLTOWER-LEFT-001'\n'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected one stale assertion block, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Self-delete and commit validator repair
        shell: bash
        run: |
          git rm .github/workflows/one-shot-eus-cutover-validator-patch.yml
          git add 11_验收/validate_canonical_cutover.ps1
          git diff --cached --check
          git diff --cached --stat
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Migrate cutover validator to current EUS scene identity"
          git push origin HEAD:gpt/canonical-cutover-eus-scene-identity
