name: canonical-cutover-validator

on:
  pull_request:
    paths:
      - '11_验收/validate_canonical_cutover.ps1'
      - '11_验收/legacy_authority_regression_cases.yaml'
      - '.github/workflows/canonical-cutover-validator.yml'
  workflow_dispatch:

jobs:
  canonical-cutover-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python -c "import os,subprocess; expected=os.environ['EXPECTED_PR_HEAD']; actual=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(); print(f'EXACT_HEAD={actual}'); assert actual == expected, (actual, expected)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependency
        run: python -m pip install PyYAML

      - name: Run full canonical cutover validator
        shell: pwsh
        run: ./11_验收/validate_canonical_cutover.ps1 -RepositoryRoot .
