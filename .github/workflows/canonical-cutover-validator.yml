name: canonical-cutover-validator

on:
  pull_request:
    paths:
      - '11_验收/validate_canonical_cutover.ps1'
      - '11_验收/legacy_authority_regression_cases.yaml'
      - '.github/workflows/canonical-cutover-validator.yml'
  workflow_dispatch:

jobs:
  legacy-authority-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate head
        if: github.event_name == 'pull_request'
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python -c "import os,subprocess; expected=os.environ['EXPECTED_PR_HEAD']; actual=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(); print(f'EXACT_HEAD={actual}'); assert actual == expected, (actual, expected)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validator dependency
        run: python -m pip install PyYAML

      - name: Run Issue 6 legacy-authority slice through canonical validator functions
        shell: pwsh
        run: |
          $RepositoryRoot = (Resolve-Path '.').Path
          $validator = Get-Content -Raw -Encoding utf8 -LiteralPath './11_验收/validate_canonical_cutover.ps1'
          $start = $validator.IndexOf('$ErrorActionPreference')
          $end = $validator.IndexOf('$indexPath = Join-Path $RepositoryRoot')
          if ($start -lt 0 -or $end -le $start) {
            throw 'could not isolate canonical validator function definitions'
          }
          Invoke-Expression $validator.Substring($start, $end - $start)
          $legacyPolicy = Get-LegacyPolicyDefinition -Root $RepositoryRoot
          Test-LegacyAuthorityReferences -Root $RepositoryRoot -LegacyPattern $legacyPolicy.Pattern
          Test-LegacyAuthorityGoldenCases -Root $RepositoryRoot -LegacyPattern $legacyPolicy.Pattern
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Output 'PASS Issue #6 legacy-authority classification and repository scan'

      - name: Declare full-validator baseline debt location
        run: |
          echo 'Full canonical-cutover baseline debt is tracked separately in Issue #62; this PR does not alter map/topology assertions.'
