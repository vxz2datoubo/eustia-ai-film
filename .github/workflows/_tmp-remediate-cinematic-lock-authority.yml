name: tmp-remediate-cinematic-lock-authority

on:
  push:
    branches:
      - gpt/cinematic-intent-contract-compiler
    paths:
      - 'tools/learning_retriever/_tmp_remediate_cinematic_lock_authority.py'
      - '.github/workflows/_tmp-remediate-cinematic-lock-authority.yml'

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/cinematic-intent-contract-compiler
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply bounded P1 remediation
        run: python tools/learning_retriever/_tmp_remediate_cinematic_lock_authority.py
      - name: Run targeted contract regressions before publication
        run: |
          python -m pip install pytest PyYAML
          PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests/test_cinematic_intent_contract.py -q
      - name: Commit remediation only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/learning_retriever/learning_retriever/cinematic_intent.py tools/learning_retriever/tests/test_cinematic_intent_contract.py 11_验收/cinematic_intent_contract_regression_cases.yaml tools/learning_retriever/README.md
          if git diff --cached --quiet; then
            echo "No remediation changes required"
            exit 0
          fi
          git commit -m "Bind CinematicIntent locks to trusted upstream evidence"
          git push origin HEAD:gpt/cinematic-intent-contract-compiler
