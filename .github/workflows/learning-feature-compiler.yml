name: learning-feature-compiler

on:
  pull_request:
    paths:
      - 'PROJECT_INDEX.yaml'
      - '01_AI电影系统/AI电影系统.md'
      - '09_资料证据/Cinematic Visual Grammar外部研究与融合证据索引.md'
      - 'tools/learning_retriever/**'
      - '10_运行时/director_feature_compiler.yaml'
      - '10_运行时/director_route_index.yaml'
      - '10_运行时/read_sets.yaml'
      - '10_运行时/write_routes.yaml'
      - '10_运行时/learning_application_gate.yaml'
      - '10_运行时/source_authority.yaml'
      - '10_运行时/screen_observable_audible_ir_schema.yaml'
      - '10_运行时/learning_recall_index.yaml'
      - '11_验收/director_feature_compiler_regression_cases.yaml'
      - '11_验收/cinematic_visual_grammar_regression_cases.yaml'
      - '11_验收/learning_smart_recall_production_validation_matrix.yaml'
      - '11_验收/learning_smart_recall_transfer_contract.yaml'
      - '.github/workflows/learning-feature-compiler.yml'

jobs:
  feature-compiler-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head checkout
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python -c "import os,subprocess; expected=os.environ['EXPECTED_PR_HEAD']; actual=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(); print(f'EXACT_HEAD={actual}'); assert actual == expected, (actual, expected)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install pytest PyYAML
      - name: Validate canonical retrieval index
        run: |
          PYTHONPATH=tools/learning_retriever python -m learning_retriever.cli --project-root . --validate-index
      - name: Validate SOAC semantic dependencies
        run: |
          PYTHONPATH=tools/learning_retriever python -m learning_retriever.cli --project-root . --validate-feature-compiler
      - name: Run production validation matrix
        run: |
          PYTHONPATH=tools/learning_retriever python -m learning_retriever.cli --project-root . --production-validation-matrix
      - name: Run targeted feature compiler regressions
        run: |
          PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests/test_feature_compiler.py tools/learning_retriever/tests/test_production_validation.py
      - name: Run full learning retriever tests
        run: |
          PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests

  # BEGIN TEMP_PR17_DIRECTION_BOUNDARY_REMEDIATION
  pr17-direction-boundary-remediation:
    if: github.event.pull_request.number == 17 && github.event.pull_request.head.ref == 'gpt/learning-smart-recall-v1-1-production-validation-matrix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gpt/learning-smart-recall-v1-1-production-validation-matrix
          fetch-depth: 1
      - name: Patch bounded direction grammar and self-remove remediation scaffolding
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tools/learning_retriever/learning_retriever/feature_compiler.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    def directional_object_precedes_action(')
          end = text.index('\n    def first_action_object_match(', start)
          replacement = '''    def directional_object_precedes_action(
              actions: tuple[str, ...],
              objects: tuple[str, ...],
              *,
              subject_terms: tuple[str, ...],
              max_chars: int = 16,
          ) -> bool:
              """Recognize bounded Chinese preposed direction such as `群众朝她跪下`.

              Bare `朝/向` are only directional when the material before the marker
              is clause-start/continuation glue or ends in a known actor subject.
              This prevents lexical dynasty nouns such as `王朝圣女/前朝圣女` from
              being reinterpreted as target-oriented blocking merely because a
              kneeling verb appears later in the same clause.
              """
              separators = ("，", "。", "；", "！", "？", ",", ";", "!", "?")
              markers = ("面朝", "朝着", "对着", "向着", "朝", "向")
              trailing_adverbs = ("缓缓", "慢慢", "纷纷", "共同", "一起", "一同", "都")
              leading_glue = tuple(sorted(set(
                  ("随后", "随即", "然后", "接着", "继而", "再", "又", "便", "于是", "立刻", "马上",
                   "纷纷", "共同", "一起", "一同", "全都", "都", "转身", "转过身", "回身")
              ), key=len, reverse=True))
              subject_forms = set(subject_terms) | {"她", "他", "他们", "她们"}
              subject_forms.update(f"{subject}们" for subject in subject_terms if not subject.endswith("们"))
              bounded_subjects = tuple(sorted(subject_forms, key=len, reverse=True))
              object_candidates = tuple(sorted(set(objects), key=len, reverse=True))

              for action in actions:
                  search_from = 0
                  while True:
                      hit = text.find(action, search_from)
                      if hit < 0:
                          break
                      prefix = text[max(0, hit - max_chars):hit]
                      for separator in separators:
                          prefix = prefix.rsplit(separator, 1)[-1]
                      prefix = prefix.strip()

                      for marker in markers:
                          marker_pos = prefix.rfind(marker)
                          if marker_pos < 0:
                              continue
                          candidate = prefix[marker_pos + len(marker):].strip()
                          changed = True
                          while changed and candidate:
                              changed = False
                              for adverb in trailing_adverbs:
                                  if candidate.endswith(adverb):
                                      candidate = candidate[:-len(adverb)].strip()
                                      changed = True
                                      break
                          if not any(candidate == obj for obj in object_candidates):
                              continue

                          if marker in {"朝", "向"}:
                              leader = prefix[:marker_pos].strip()
                              changed = True
                              while changed and leader:
                                  changed = False
                                  for glue in leading_glue:
                                      if leader.endswith(glue):
                                          leader = leader[:-len(glue)].strip()
                                          changed = True
                                          break
                              if leader and not any(leader.endswith(subject) for subject in bounded_subjects):
                                  continue
                          return True
                      search_from = hit + len(action)
              return False
'''
          text = text[:start] + replacement + text[end:]

          old_call = '''    preposed_kneel_target_evidence = has_kneel and directional_object_precedes_action(
              ritual_kneel_terms, target_object_terms
          )'''
          new_call = '''    preposed_kneel_target_evidence = has_kneel and directional_object_precedes_action(
              ritual_kneel_terms,
              target_object_terms,
              subject_terms=actor_terms,
          )'''
          if text.count(old_call) != 1:
              raise SystemExit(f'expected one directional helper call, found {text.count(old_call)}')
          path.write_text(text.replace(old_call, new_call), encoding='utf-8')

          workflow = Path('.github/workflows/learning-feature-compiler.yml')
          workflow_text = workflow.read_text(encoding='utf-8')
          marker = '  # BEGIN TEMP_PR17_DIRECTION_BOUNDARY_REMEDIATION\n'
          if marker not in workflow_text:
              raise SystemExit('temporary remediation marker missing')
          workflow.write_text(workflow_text.split(marker, 1)[0].rstrip() + '\n', encoding='utf-8')
          Path('.github/workflows/tmp-pr17-direction-boundary-patch.yml').unlink(missing_ok=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Bound bare Chinese direction markers to valid subject context"
          git push origin HEAD:gpt/learning-smart-recall-v1-1-production-validation-matrix
  # END TEMP_PR17_DIRECTION_BOUNDARY_REMEDIATION
