name: learning-feature-compiler

on:
  pull_request:
    paths:
      - 'PROJECT_INDEX.yaml'
      - 'tools/learning_retriever/**'
      - '10_运行时/director_feature_compiler.yaml'
      - '10_运行时/director_route_index.yaml'
      - '10_运行时/read_sets.yaml'
      - '10_运行时/learning_application_gate.yaml'
      - '10_运行时/source_authority.yaml'
      - '10_运行时/screen_observable_audible_ir_schema.yaml'
      - '10_运行时/learning_recall_index.yaml'
      - '11_验收/director_feature_compiler_regression_cases.yaml'
      - '.github/workflows/learning-feature-compiler.yml'

permissions:
  contents: write

jobs:
  feature-compiler-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head checkout
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python -c "import os,subprocess; expected=os.environ['EXPECTED_PR_HEAD']; actual=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(); print(f'EXACT_HEAD={actual}'); assert actual == expected, (actual, expected)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install pytest PyYAML
      - name: Validate canonical retrieval index
        run: |
          PYTHONPATH=tools/learning_retriever python -m learning_retriever.cli --project-root . --validate-index
      - name: Validate SOAC semantic dependencies
        run: |
          PYTHONPATH=tools/learning_retriever python -m learning_retriever.cli --project-root . --validate-feature-compiler
      - name: Run targeted feature compiler regressions
        run: |
          PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests/test_feature_compiler.py
      - name: Run full learning retriever tests
        run: |
          PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests
      - name: Run branch-only canonical appender
        if: github.event.pull_request.number == 21 && github.head_ref == 'gpt/cinematic-visual-grammar-integration'
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(Path('.github/workflows/tmp-cinematic-visual-grammar-append.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['append-canonical-method']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Append candidate method without rewriting existing canonical content')
          subprocess.run(['bash', '-lc', script], check=True)
          PY
      - name: Commit canonical append to integration branch
        if: github.event.pull_request.number == 21 && github.head_ref == 'gpt/cinematic-visual-grammar-integration'
        shell: bash
        run: |
          if git diff --quiet -- '01_AI电影系统/AI电影系统.md'; then
            echo 'No canonical append needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '01_AI电影系统/AI电影系统.md'
          git commit -m 'Integrate cinematic visual grammar into canonical AI film system'
          git push origin HEAD:gpt/cinematic-visual-grammar-integration
