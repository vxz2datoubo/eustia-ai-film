name: learning-feature-compiler

on:
  pull_request:
    paths:
      - 'PROJECT_INDEX.yaml'
      - '01_AI电影系统/AI电影系统.md'
      - '07_连续性与生产状态/连续性与当前生产状态.md'
      - '09_资料证据/Cinematic Visual Grammar外部研究与融合证据.md'
      - '09_资料证据/活动工作项解析与修订状态证据索引.md'
      - 'tools/learning_retriever/**'
      - '10_运行时/active_work_item_resolution_gate.yaml'
      - '10_运行时/director_feature_compiler.yaml'
      - '10_运行时/director_route_index.yaml'
      - '10_运行时/read_sets.yaml'
      - '10_运行时/write_routes.yaml'
      - '10_运行时/learning_application_gate.yaml'
      - '10_运行时/source_authority.yaml'
      - '10_运行时/screen_observable_audible_ir_schema.yaml'
      - '10_运行时/learning_recall_index.yaml'
      - '10_运行时/targeted_repair_policy.yaml'
      - '11_验收/active_work_item_resolution_regression_cases.yaml'
      - '11_验收/director_feature_compiler_regression_cases.yaml'
      - '11_验收/cinematic_visual_grammar_regression_cases.yaml'
      - '11_验收/cinematic_intent_contract_regression_cases.yaml'
      - '11_验收/expected_observed_eval_regression_cases.yaml'
      - '11_验收/targeted_repair_regression_cases.yaml'
      - '.github/workflows/learning-feature-compiler.yml'

jobs:
  feature-compiler-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact PR head checkout
        env:
          EXPECTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python -c "import os,subprocess; expected=os.environ['EXPECTED_PR_HEAD']; actual=subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip(); print(f'EXACT_HEAD={actual}'); assert actual == expected, (actual, expected)"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install pytest PyYAML
      - name: Validate canonical retrieval index
        run: |
          PYTHONPATH=tools/learning_retriever python -m learning_retriever.cli --project-root . --validate-index
      - name: Validate SOAC semantic dependencies
        run: |
          PYTHONPATH=tools/learning_retriever python -m learning_retriever.cli --project-root . --validate-feature-compiler
      - name: Run Active Work Item regressions
        run: |
          set -o pipefail
          PYTHONPATH=tools/learning_retriever python -m pytest -vv \
            tools/learning_retriever/tests/test_active_work_item.py \
            tools/learning_retriever/tests/test_active_work_item_continuity_guard.py \
            tools/learning_retriever/tests/test_active_work_item_source_revision_hardening.py \
            tools/learning_retriever/tests/test_active_work_item_transport.py \
            2>&1 | tee active-work-item-pytest.log
      - name: Upload Active Work Item failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: active-work-item-pytest-${{ github.event.pull_request.head.sha }}
          path: active-work-item-pytest.log
          if-no-files-found: error
          retention-days: 7
      - name: Run targeted feature compiler regressions
        run: |
          PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests/test_feature_compiler.py
      - name: Run targeted CinematicIntent contract regressions
        run: |
          PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests/test_cinematic_intent_contract.py
      - name: Run targeted Expected-vs-Observed eval regressions
        run: |
          PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests/test_expected_observed_eval.py
      - name: Run targeted repair planner regressions
        run: |
          PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests/test_targeted_repair.py
      - name: Run full learning retriever tests
        run: |
          PYTHONPATH=tools/learning_retriever python -m pytest tools/learning_retriever/tests
