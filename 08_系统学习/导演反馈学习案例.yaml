cases:
  - case_id: MOTIVE-FIRST-CROWD-001
    work_item: 钟楼谒见仪式前广场群众反应
    user_feedback:
      - 贫苦居民处在恶劣生存环境中，不应因为“管理者/权威人物出现”就自动套用嘲讽、起哄、看不起的喜剧模板。
      - 居民可能对猎羽、治安官等直接管理和执法者不满，但教会同时提供施粥、面包、精神寄托与圣女希望，因此居民对教会存在依赖、敬畏、希望投射和近乎畸形的尊重。
      - 因此当前场景中，钟楼平台出现人影后，广场应由沸腾瞬间转为安静，而不是进入“怎么又是这个神官”的群体喜剧反应。
    observed_problem:
      - 旧导演方案先从类型化喜剧效果出发，再给群众安排反应，没有先解析群众的现实生存动机、资源依赖、信仰依赖和对机构的不同关系。
      - 把“贫苦群众对权威不满”泛化成“群众会嘲讽教会”，忽略同一群体可同时憎恶执法压力、依赖救济、敬畏宗教并把希望投射给圣女。
    inferred_intent:
      - 群众行为必须由角色/群体当前动机、需求、依赖、恐惧、希望和既有关系推出，再决定语气与戏剧效果。
      - 社会处境不是背景说明，而是群众表演和声音行为的因果源。
    operational_candidate:
      - 群众反应设计前先运行 motive_dependency_scan，再决定喜剧、敌意、敬畏、沉默、狂热、冷漠或混合反应。
      - 对机构的态度不得只按“统治者/被统治者”二分；必须区分执法压力、物资供给、精神寄托、身份认同、救济依赖、希望投射和现实怨恨。
      - 当机构同时掌握生存资源与超越性希望时，群众可能形成尊敬、依赖、恐惧、感激、狂热和怨恨并存的复杂关系。
    mandatory_scan_fields:
      - immediate_need
      - material_dependency
      - hope_dependency
      - spiritual_dependency
      - institutional_function
      - grievance_target
      - perceived_legitimacy
      - fear_and_cost
      - emotional_ambivalence
      - group_heterogeneity
    current_scene_application:
      crowd_state_before: 广场沸腾、期待圣女出现
      trigger: 钟楼敲钟平台出现人影
      response: 整个广场从沸腾瞬间变得非常安静，形成集体注意力和宗教权威的屏幕/声音证据
      interpretation: 安静不是普通“守规矩”，而是绝望环境中对教会、圣女和希望来源的依赖与敬畏外显
    boundaries:
      - 不把“贫民一定尊敬宗教机构”泛化为规则；若机构失去救济功能、合法性、希望投射或发生明确背叛，群众反应可完全不同。
      - 不把所有群众做成同一表情；宏观声场可统一安静，个体仍可有紧张、敬畏、期待、疲惫、虔诚等差异。
      - 喜剧不是禁用，而是必须在人物动机、社会关系与当前情境允许时成立。
    maturity:
      current_scene_application: scene_verified
      transferable_rule: candidate
    confidence:
      user_intent: HIGH
      scene_match: HIGH
      cross_scene_transfer: MEDIUM

  - case_id: EXPOSITION-MEDIA-DISTANCE-001
    work_item: 达尔世界观布道与诺瓦斯起源说明
    user_feedback:
      - 前面较长章节一直没有完整介绍世界观，这里与教会、圣女、浮空都市的制度逻辑直接相关，是较早且自然的世界观入口，因此信息不能仅因“说明多”而默认大幅压缩。
      - 若全程只看达尔讲话会枯燥，因此在达尔先说两句建立真人场景和说话者后，转入与画外音同步的羊皮纸手绘简笔画。
      - 手绘画应展示天使、人类繁荣、遗忘天使、洪水、祈祷、都市漂浮、历代圣女维持城市等因果，并明确当前所处世界是一座漂浮的天空城。
      - 羊皮纸/手绘具有宗教历史感和时间距离，不容易让观众误以为这些画面是“不久以前的真实回忆”。相较之下，后来的大崩落等更接近角色/社会记忆的事件可以用写实真实画面回忆。
      - 同时希望保留一个“真实历史画面切回”的A/B版本，与羊皮纸简笔画版本真实比较。
    observed_problem:
      - 旧策略倾向把世界观说明视为节奏风险后优先压缩、穿插凯姆或群众现实行动，虽能降低听课感，但可能削弱本段作为早期世界观入口和教会制度因果说明的职责。
      - 若直接使用写实历史闪回，影像语法容易提高“客观历史事实/近期真实记忆”的感觉，并提前锁定大量古代世界视觉事实与资产。
    first_principle:
      - 说明信息是否保留，先按未来因果价值、制度合法性、角色信念、主题预埋和当前放置位置判断，而不是按字数判断。
      - 当重要信息必须保留但持续真人讲话会停滞时，可以改变视觉表达介质，而不是只删信息或强行用无关行动盖住信息。
      - 历史说明的视觉介质同时决定观众如何理解其“真实性、时间距离、文化归属和叙述来源”。
    operational_candidate:
      - exposition_value_scan: 判断该信息是否承担后续剧情因果、制度解释、角色信念或主题预埋；高价值信息允许保留。
      - placement_scan: 世界观尽量在与其最相关的场景、机构、人物和行动中较早出现，避免开场硬讲，也避免拖到观众已需要理解时仍缺失。
      - medium_selection: 可在真人讲话、羊皮纸/壁画/宗教图像、风格化动画、写实闪回、现实行动并行之间选择，介质应服务信息性质而非只为“好看”。
      - epistemic_distance_scan: 先决定观众应把该段理解为客观事实、角色亲历回忆、历史记录、宗教教义、共同神话还是未证实传说，再选视觉介质。
      - return_to_present: 说明段结束必须重新落回现实行动/仪式，使信息成为当前剧情的一部分。
    current_scene_structure:
      - 广场由沸腾瞬间安静
      - 凯姆向远处望去
      - 手持观察钟楼敲钟平台的人影
      - 放大确认走出的是中年神官达尔
      - 达尔以有空间回音的声音宣布谒见仪式并开始解释诺瓦斯存在意义
      - 达尔说出前两句后转入羊皮纸手绘动画
      - 手绘动画与画外音严格同步，展示完整因果链和漂浮天空城
      - 达尔越说越投入，现实/手绘之间最终回到现实
      - 达尔张开双手，以“感谢圣女大人，同时，向她献上祈祷”结束并推动下一仪式行为
    medium_A_B_experiment:
      status: OPEN_EXPERIMENT
      A:
        name: 羊皮纸彩色简笔画历史叙述
        expected_strengths:
          - 宗教历史与共同神话感
          - 更强时间距离
          - 不轻易把教义叙事拍成客观历史录像
          - 可以低成本统一表现跨时代、大洪水、城市升空与历代圣女
      B:
        name: 写实真人历史闪回
        expected_strengths:
          - 更强沉浸和灾难规模
          - 更直接的情绪冲击与历史具象
        dependencies:
          - 必须先建立初代圣女伊莲的高质量角色设定与视觉资产，且需要非常强的神圣感
          - 需要古代时代、天使、洪水、城市升空等额外视觉设计，避免临时生成造成世界观锁死或廉价感
      control_variables:
        - same_core_dialogue_information
        - same_story_function
        - comparable_duration
        - same_return_to_present_and_final_prayer
      compare_dimensions:
        - worldbuilding_comprehension
        - religious_history_feeling
        - temporal_distance
        - perceived_objectivity_of_history
        - emotional_engagement
        - exposition_fatigue
        - visual_coherence
        - production_cost
        - premature_worldbuilding_lock_risk
      promotion_rule: A/B真实结果出来前，不把“羊皮纸一定优于写实闪回”晋级为稳定规则
    boundaries:
      - 羊皮纸不等于“古代历史默认画法”；如果导演明确要给观众客观、亲历、强沉浸的历史事实，写实闪回可能更适合。
      - 写实闪回不天然意味着近期事件，但会提高影像的直接现实感，需要用上下文和风格控制其时间/知识地位。
      - 现实行动并行仍是有效工具，尤其当说明内容本身不值得完整占据注意力时；本案例不是撤销叙事并行化，而是增加“先判断信息价值与介质”的上位门。
    maturity:
      current_scene_placement_and_need: scene_verified
      medium_choice: candidate
      transferable_rule: candidate
    confidence:
      user_intent: HIGH
      causal_mechanism: MEDIUM_HIGH
      medium_A_vs_B: UNKNOWN_UNTIL_TEST

  - case_id: VN-TO-FILM-DIALOGUE-001
    work_item: Galgame文字剧本到电影对白的转换
    user_feedback:
      - 原始母本属于日本GAL/文字游戏表达，书面说明和长句结构不应直接当作电影口语。
      - 当前达尔台词应保留世界观与宗教逻辑，但改写成更适合真人说出口、听众一次听懂、能配合表演节奏的电影对白。
    operational_candidate:
      - adaptation_preserves_dramatic_information_not_source_sentence_shape
      - 把叙述性书面句拆成可呼吸、可重音、可表演、可一次听懂的口语句组
      - 保留角色身份与用词层级，避免为口语化把高阶神官写成现代随意说话
      - 世界观术语首次出现时优先让语义关系清楚，再追求文采
    boundaries:
      - 原作有强识别度、剧情关键或用户明确锁定的台词不可只因“口语化”擅自改写
      - 角色语言时代感与社会身份仍须保留
    maturity:
      current_scene_application: scene_verified
      transferable_rule: candidate

  - case_id: NOVUS-30S-REAL-OUTPUT-001
    work_item: 达尔世界观布道与诺瓦斯写实历史闪回30秒
    model_scope: C-DANCE 2.5 / Seedance 2.5 project alias
    evidence:
      source_prompt_supplied_by_user: true
      generated_video_supplied_by_user: true
      current_conversation_video_file_id: file_0000000005f081fd9a153d76eefb4b9e
      assistant_temporal_review: sampled_frames_and_contact_sheets
      user_output_verdict: mixed_with_specific_failures_and_one_clear_success
    user_feedback:
      - 开头天空之城与提示基本对得上，但美感只算“还可以”，没有达到很美、很惊艳的水平。
      - 初代圣女画面下方群众的行为动机不真实，实际看起来有点像在跳舞。
      - 历代圣女段把“假小子”直接理解成了小孩子；用户本意是“成年女性圣女具有假小子气质”，假小子属性必须与圣女成人身份合并理解。
      - 后半再次使用天空之城拉远大全景，与开头视觉职责重复，信息密度下降。
      - 临近结尾的天空之城拉远镜头在云层下方出现地面火光，严重违反当前世界观：诺瓦斯下方世界仍长期处于大洪水状态，不应出现暴露陆地上的火光/城市灯火。
      - 最后达尔激动地张开双手这一表演效果是好的。
      - 但结尾回到达尔时，上一镜头状态中跟在他后面的四名修女消失，形成跨镜头连续性穿帮。
    observed_output:
      opening_novus:
        result: SEMANTIC_PASS_AESTHETIC_MEDIUM
        note: 天空之城、云海、尺度与神圣光基本成立，但构图与美感未达到用户期望的记忆级视觉。
      historical_elen_crowd:
        result: CROWD_MOTION_MOTIVE_MISMATCH
        note: 逐帧可见多个群众动作缺乏统一现实任务方向，存在抬臂、摇摆、节律性位移的读感，容易被观众解释为舞蹈/仪式舞蹈而非灾难中的求生、聚集或祈祷行为。
      successive_saints:
        result: SEMANTIC_ENTITY_CLASS_DRIFT
        note: 约14.5至15.5秒出现明显儿童体态角色，说明“假小子”自由描述压过了“历代圣女=成年女性”的实体类别、年龄和社会身份约束。
      second_novus_wide:
        result: SEQUENCE_FUNCTION_REDUNDANCY
        note: 后半再次长时间承担“天空城大全景+拉远”的近似视觉职责，较少提供新的世界机制、人物、空间或因果信息。
      lower_world_background:
        result: CANONICAL_WORLD_STATE_VIOLATION
        note: 约24.5秒云层下方可见明显橙红火光/地面灯火读感；与用户确认的“大洪水持续覆盖下方世界”冲突。
      final_daal:
        result: PERFORMANCE_PASS_CONTINUITY_FAIL
        note: 达尔激动张开双臂的表演成立；但画面没有延续此前跟随达尔的四名修女，缺少明确离场事件，属于 inherited state 丢失。
    final_delta:
      preserved_strengths:
        - 天空之城世界级尺度与云海总体语义可用
        - 达尔最后激动张开双手的仪式高潮继续保留
      failures_to_repair:
        - 群众运动必须从当前动机与现实任务推出，不能把高自由度背景动作交给模型随机补全
        - 形容词必须绑定到既有实体身份，不能允许“假小子”等风格词改变年龄、性别、社会身份或角色类别
        - 30秒序列必须检查镜头功能重复，重复构图只有在产生新的信息、情绪或主题递进时才保留
        - 大景别不仅检查主体，还必须检查背景世界状态是否违反canonical，例如洪水世界、生态、地表、远景灯火
        - 同一时间地点连续镜头必须继承未发生离场的角色、道具、服装、位置和状态；提示词省略不等于角色消失
    operational_candidates:
      - motive_to_motion_scan: 群众/配角不仅检查“为什么这样想”，还要把动机编译成可观察动作包络；例如逃难、祈祷、等待、围观、抢救各自有不同重心、方向、速度和手部行为，禁止无因节律性摇摆成为默认背景动作。
      - semantic_attribute_binding_gate: 先锁定实体类别、性别、年龄段、身份、关系与canonical不变量，再把“假小子、可爱、神秘、冷酷”等描述只作用于允许变化的气质、发型、姿态、服装细节与表演，不得自动改写实体身份。
      - sequence_function_redundancy_scan: 在多镜头段内比较每镜 dramatic_function / audience_new_information / composition_role；若后镜只是重复前镜的建立功能且没有新增信息，优先改成新的视角、关系、细节、因果或删减。
      - canonical_background_integrity_scan: 大全景、远景、拉远、鸟瞰等会暴露大量背景时，必须把不可变世界状态加入hard invariants并验收背景层，不允许模型用“漂亮末日地表、火光城市、飞鸟生态”等泛奇幻补全覆盖项目世界观。
      - inherited_scene_state_scan: 同一场景连续镜头在编译前读取上一镜exit_state与当前WorldState，未发生exit/remove/state_change的实体继续存在；若构图理应可见却缺失，判定连续性错误。
      - aesthetic_quality_separation: 指令遵循与“画面是否美、构图是否高级、是否达到记忆级视觉”必须分开验收；语义PASS不得自动等于美学PASS。
    candidate_functions_to_integrate:
      - Semantic Attribute Binding Gate
      - Persistent Scene State Carry-Forward
      - Canonical Background World-State Integrity
      - Sequence Shot-Function Redundancy Scan
      - Crowd Motive-to-Motion Compiler
    boundaries:
      - “假小子”并不在所有语境下都代表成年人；只有当canonical实体已明确为成年女性圣女时，描述词必须服从该实体身份。
      - 重复镜头并非绝对禁用；若重复构图承担对照、主题回环、时间变化或情绪升级，并产生新信息，则可以成立。
      - 群众不需要动作完全一致；需要的是个体差异仍处于同一社会情境可解释的运动范围内。
      - 四名修女的连续性要求绑定当前钟楼场景与当前时间链；若后续明确离场、被遮挡或镜头景别裁切不包含其位置，不应机械强塞进每一帧。
      - 大洪水下方世界状态属于项目世界事实，不应只作为本模型的负面提示词技巧。
    maturity:
      output_observations: scene_verified
      current_work_item_repairs: scene_verified
      transferable_methods: candidate
      model_version_behavior: candidate
    confidence:
      user_feedback: HIGH
      video_observation: HIGH
      causal_attribution: MEDIUM
      cross_scene_transfer: MEDIUM
    validation:
      - 下次历代圣女提示使用“所有历代圣女均为成年女性”作为身份硬锚，再仅改变气质与造型，验证儿童化是否显著下降。
      - 同一群众镜头A/B：自由背景动作 vs 动机约束动作包络，比较舞蹈化/随机手势率与现实可信度。
      - 同一30秒序列在第二个诺瓦斯镜头改成提供新信息的视角，比较信息密度与重复感。
      - 所有大全景增加world-state background checklist，检查洪水、地表、远景灯火、生态和天空状态。
      - 达尔回切镜头显式继承四名修女并与不写继承状态版本比较连续性。

learning_checkpoint:
  checkpoint_id: BELL-TOWER-EXPOSITION-20260818
  work_item: 钟楼谒见仪式与世界观说明
  locked_or_accepted:
    - 教会在底层居民心中同时承担救济、信仰与希望来源，群众宏观反应必须从这种依赖关系推出
    - 钟楼平台出现人影时，广场由沸腾瞬间变得非常安静，形成集体注意力和宗教权威的屏幕/声音证据
    - 达尔真人先建立仪式与世界观开头，再进入历史视觉化说明
    - 世界观在此处较早出现，原因是前段尚未完整介绍且本场与教会/圣女制度因果高度相关
