schema_version: "0.1.0"
adapter_id: EUSTIA_PERSISTENT_FILM_WORLD_STATE_ADAPTER
status: candidate
source_issue: 76
source_user_decision: DEC-MIDS-ARCH-002
scope: cross_shot_persistent_world_state_projection_over_existing_worldstateir_map_and_continuity

purpose:
  - 让现有 WorldStateIR 从单镜世界描述升级为跨镜持续状态投影
  - 让角色对象空间事件摄影机与持续实体状态在镜头之间有明确继承和变化依据
  - 防止提示词省略导致角色对象世界状态或场景运行状态被模型擅自删除或重建

not_a_new_authority:
  screenplay_authority: false
  character_authority: false
  map_authority: false
  continuity_authority: false
  asset_authority: false
  camera_director_authority: false
  rule: adapter projects and validates existing canonical state; it cannot mint canonical facts

upstream_authorities:
  project_index: PROJECT_INDEX.yaml
  screenplay: 03_剧本与改编/当前改编剧本.md
  character_db: 04_角色与表演/角色与表演设定库.md
  scene_db: 05_场景与空间/场景与空间设定库.md
  map: 05_场景与空间/00_项目地图文件.md
  asset_registry: 06_视觉资产/视觉资产登记库.md
  continuity: 07_连续性与生产状态/连续性与当前生产状态.md
  world_state_schema: 10_运行时/screen_observable_audible_ir_schema.yaml#WorldStateIR
  transition_contract: 10_运行时/screen_observable_audible_ir_schema.yaml#TransitionContract

persistent_state_contract:
  world_state_id_required: true
  parent_world_state_id_required_after_first_state: true
  work_item_binding_required_when_existing_work_item: true
  fields:
    - time
    - location
    - scene_operating_state
    - characters
    - objects
    - spatial_relations
    - persistent_entities
    - world_invariants
    - active_events
    - camera_state_when_material_to_continuity
    - source_authority_refs
    - state_delta_from_parent
  inheritance_rule: omitted_state_is_inherited_unless_explicit_change_or_exit_removal_camera_exclusion_is_resolved
  canonical_change_rule: topology_identity_or_formal_asset_changes_require_existing_high_impact_gate

character_persistence:
  required_fields:
    - identity
    - world_position
    - orientation
    - current_activity
    - current_goal
    - body_state
    - knowledge_or_belief_when_material
    - carried_or_worn_objects_when_material
    - persistence_status
  exit_conditions:
    - explicit_exit_event
    - explicit_removal_event
    - death_or_state_change_confirmed_by_story_authority
    - camera_exclusion_only_affects_visibility_not_world_existence

object_persistence:
  required_fields: [identity, world_position, owner_or_controller, state, persistence_status]
  omission_does_not_delete_object: true
  formal_asset_identity_still_owned_by_asset_registry: true

camera_state:
  role: persistent_only_when_camera_continuity_or_spatial_relation_needs_it
  may_track: [position, orientation, height, lens_intent, current_anchor, last_shot_exit_state]
  cannot_override_director_camera_plan: true

state_transition:
  allowed_delta_classes:
    - CHARACTER_MOVE
    - CHARACTER_ORIENTATION_CHANGE
    - CHARACTER_ACTIVITY_CHANGE
    - OBJECT_MOVE
    - OBJECT_STATE_CHANGE
    - EVENT_START
    - EVENT_END
    - ENTITY_ENTER
    - ENTITY_EXIT
    - WORLD_INVARIANT_CHANGE_WITH_AUTHORITY
    - CAMERA_STATE_CHANGE
  each_material_delta_requires:
    - cause_or_event_ref
    - source_provenance
    - affected_entities
    - before_state
    - after_state
  illegal_shortcuts:
    - delete_entity_because_prompt_omitted_it
    - change_map_topology_from_generated_output
    - infer_formal_asset_replacement_from_visual_similarity
    - change_character_identity_from_model_output

rendering_boundary:
  generation_model_role: renderer_or_executor_not_world_truth_source
  generated_output_may_propose_observation: true
  generated_output_cannot_mutate_world_state_without_reverse_observation_eval_and_governed_update: true

future_geometry_levels:
  G0: text_and_semantic_state
  G1: static_2_5D_or_clay_geometry
  G2: key_state_geometry
  G3: trajectory_previs
  G4: explicit_3D_or_4D_research_only
  rule: user_confirmed_persistent_world_direction_does_not_auto_activate_G4

fail_closed_conditions:
  - MISSING_PARENT_STATE
  - WORK_ITEM_STATE_MISMATCH
  - ENTITY_DISAPPEARED_WITHOUT_EXIT
  - CANONICAL_TOPOLOGY_DRIFT
  - FORMAL_ASSET_IDENTITY_DRIFT
  - GENERATED_OUTPUT_MINTED_WORLD_TRUTH
  - UNPROVEN_MATERIAL_STATE_DELTA

activation:
  current: candidate
  project_index_registration: absent
  requires:
    - exact_head_tests
    - replay_on_existing_multi_shot_sequence
    - at_least_one_live_continuity_pilot
    - independent_architecture_review
    - no_second_map_or_continuity_authority
