manifest_id: EUSTIA_SCENE_MEDIA_RESOLVER
version: 1.0.0
status: active
confirmed_by_user: 2026-08-14
scope: formal_scene_media_asset_version_and_locator_resolution

authority:
  identity_schema: 10_运行时/scene_asset_identity_schema.yaml
  logical_asset_registry: 06_视觉资产/视觉资产登记库.md
  this_file: scene_asset_current_version_version_history_and_locators

purpose:
  - 为正式场景媒体提供稳定的 Asset → Current Media Version → Locator 解析层
  - 允许同一正式资产被反复修改而不改变上层 Asset 身份、View、Camera Anchor 或 Relation 引用
  - 把“图片内容版本”与“图片存放位置”分离，支持 ChatGPT Library、未来本地仓库、Git LFS、对象存储、Unreal、OpenUSD 等迁移
  - 避免通过删除旧文件、同名覆盖或 old→new→newer 映射链维持系统正确性

identity_rules:
  asset_id_role: stable_logical_media_slot
  media_version_id_role: immutable_pixel_revision
  locator_role: physical_or_platform_specific_retrieval_address
  asset_id_is_stable_across_pixel_revisions: true
  media_version_id_is_immutable: true
  current_version_pointer_is_mutable: true
  locator_is_replaceable_and_multi_valued: true
  persistent_old_asset_id_to_new_asset_id_mapping: forbidden
  old_versions_are_not_identity_mappings: true
  storage_filename_default: "{version_id}.{ext}"

id_namespace:
  media_version:
    pattern: "EUS-VER-######"
    example: EUS-VER-000001

version_lifecycle:
  states:
    - pending_verification
    - current
    - superseded
    - archived
    - missing_binary
    - rejected
  invariants:
    - 一个active正式Asset最多一个current版本
    - current版本必须属于同一asset_id
    - current版本切换必须在新版本像素核验与引用完整性检查后进行
    - superseded版本默认保留为历史证据，不参与普通导演调用
    - 物理删除不作为普通替换流程的一部分

locator_model:
  allowed_types:
    - chatgpt_file_id
    - file_library_title
    - current_conversation_file
    - local_path
    - github_content_url
    - external_uri
    - derived_preview
  locator_status:
    - verified
    - unverified
    - stale
    - unavailable
  rules:
    - 同一个Media Version可以有多个locator
    - locator变化不创建新Media Version
    - 同一像素被重新上传且content_hash相同，只增加或更新locator，不创建新版本
    - 无法从某个locator解引用时，尝试同版本其他verified locator
    - 不得用语义相近候选图替代目标version

content_identity:
  preferred_hash: sha256
  rules:
    - content_hash用于判断像素内容是否实际变化
    - 同hash默认视为同一Media Version的再次上传或复制，除非文件解码后实际内容不一致
    - hash不同不自动等于新Asset；先判断Scene、Camera Anchor、View、media_role、时间/天气/光照职责是否仍相同

classification_on_new_upload:
  same_pixels_new_locator:
    condition:
      - content_hash_equal
      - logical_asset_same
    action:
      - keep_same_version_id
      - add_or_refresh_locator
      - do_not_move_asset_identity
  same_asset_new_revision:
    condition:
      - content_hash_changed
      - scene_same
      - camera_anchor_same
      - view_same
      - media_role_same
      - variant_dimensions_same
    action:
      - create_new_media_version
      - verify_pixels
      - set_previous_current_to_superseded
      - move_current_version_pointer_after_verification
  new_variant_asset:
    condition_examples:
      - time_state_intentionally_changed
      - lighting_state_intentionally_changed
      - weather_state_intentionally_changed
      - media_role_changed_from_color_master_to_depth_or_white_model
    action:
      - keep_same_view_when_spatial_view_is_same
      - create_or_resolve_separate_asset_id
      - version_inside_that_asset_separately
  new_view_or_anchor:
    condition_examples:
      - camera_position_changed_materially
      - camera_facing_changed_to_another_view
      - projection_or_top_orientation_defines_new_view_duty
    action:
      - create_or_resolve_new_camera_anchor_or_view
      - create_separate_asset_id
      - do_not_treat_as_revision_of_old_asset

replacement_transaction:
  trigger_examples:
    - 这张替换正式母图以后用这版
    - 更新这个正式资产
    - 这是修改后的正式图
    - 用这张覆盖当前正式版
  steps:
    - FETCH PROJECT_INDEX、identity schema、logical asset registry、本manifest、相关连续性和活动引用
    - 实际打开新上传像素
    - 解析目标Asset并判断same_pixels / new_revision / new_variant / new_view_or_anchor
    - 计算或记录content_hash；无法计算时明确hash_unknown并禁止自动去重
    - same_pixels时只更新locator
    - new_revision时创建新的EUS-VER并先标pending_verification
    - 核验Scene、Camera Anchor、View、方向、地标、构图和媒体职责
    - 核验通过后把新version设为current并把旧current设为superseded
    - 检查默认指针、Relation、连续性和当前镜头绑定不因版本切换失效
    - COMMIT serially
    - FETCH AGAIN验证current_version_id、version状态和locator可解析性
  failure_policy:
    - 事务中途失败时不得切换current_version_pointer
    - 若已部分写入则在连续性记录blocked transaction并优先恢复
    - 不得宣布正式替换完成

garbage_collection:
  automatic_physical_delete: forbidden
  default_old_version_action: superseded
  delete_gate:
    requires_explicit_user_confirmation: true
    preconditions:
      - version不是current
      - 无active镜头或连续性引用需要该version
      - 无回归、证据或审计保留需求
      - 有可恢复备份或用户明确接受不可恢复删除
  note: File Library或外部存储若当前工具无删除能力，系统只更新生命周期状态，不声称已物理删除。

runtime_resolution:
  order:
    - resolve_asset_id_from_view_and_continuity
    - lookup_current_version_id_in_this_manifest
    - collect_verified_locators_for_current_version
    - resolve_actual_binary
    - open_and_verify_pixels_when_visual_analysis_is_required
  failure_behavior:
    - if_current_version_missing: report_formal_asset_version_unresolved
    - if_all_locators_fail: report_identity_found_but_pixels_unavailable
    - never_substitute_semantically_similar_candidate

shot_binding_policy:
  default_binding_level: asset_id
  optional_reproducibility_pin: media_version_id
  rules:
    - 普通导演与长期场景连续性默认绑定asset_id，以便正式母图升级后自动使用current版本
    - 已生成镜头、回归案例、复现任务或需要精确追溯时可额外锁定media_version_id
    - 若镜头显式锁定media_version_id，不因current版本更新而自动重指向

assets: {}

migration_state:
  legacy_scene_assets_have_not_entered_this_manifest: true
  reason: 现有SCN-*场景图仍需按用户要求逐张重新上传或实际打开后完成像素核验与身份迁移
  next_step: 用户逐张提供正式场景图；每张按identity schema与本manifest完成Scene/Camera/View/Asset/Version/Locator登记
