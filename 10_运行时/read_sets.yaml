rules:
  full_repository_injection_default: false
  local_targeted_retrieval_default: true
  global_expand_on_route_uncertainty: true
  director_task_must_read_project_index: true
  directing_learning_application_gate_required: true
  learning_retrieval_must_resolve_scope_and_conflicts_before_application: true
  episodic_surface_constraints_must_expire_outside_scope_unless_promoted: true
  unresolved_material_learning_conflict_must_defer_to_user: true
  candidate_validation_may_offer_low_cost_controlled_ab_when_natural: true
  learning_application_gate_failure_requires_self_revision_before_output: true
  proxy_model_pass_must_not_equal_target_model_pass: true
  directing_must_run_next_step_opportunity_scan: true
  high_dynamic_motion_failure_must_consider_motion_compiler: true
  high_dynamic_motion_text_probe_limit_before_reference_escalation: 2
  proactive_high_confidence_handoff_may_include_native_deliverable_without_extra_user_prompt: true
  proactive_medium_confidence_must_suggest_not_force: true
  proactive_low_confidence_should_remain_silent: true
  proactive_router_cannot_override_user_creative_control: true
  spatial_task_must_read_map: true
  formal_scene_asset_task_must_read_scene_asset_identity_schema: true
  formal_scene_media_resolution_must_read_resolver_manifest: true
  formal_scene_asset_replacement_must_classify_version_variant_or_new_view: true
  formal_asset_retrieval_must_initialize_attempt_NOT_ATTEMPTED: true
  historical_registration_evidence_must_not_initialize_current_attempt: true
  formal_generation_reference_claim_requires_binding_receipt_BOUND: true
  sound_relevant_task_must_read_sound_director: true
  suno_prompt_compilation_must_read_lexicon: true
  golden_prompt_explicit_user_verdict_must_run_two_step_ingestion: true
  golden_prompt_ingestion_must_execute_director_grade_pull: true
  golden_prompt_prompt_only_pull_must_remain_prospective: true
  golden_prompt_media_backed_pull_must_be_seconds_grounded: true
  golden_prompt_source_verbatim_must_be_preserved: true
  golden_prompt_case_registration_must_not_auto_promote_skill: true
  golden_prompt_retrieval_must_be_targeted_not_full_library: true
  golden_media_persistent_representation_must_follow_temporal_evidence_bundle_schema: true
  golden_media_source_video_default_persistence_is_not_required: true
  golden_media_timestamps_must_be_seconds_first_for_human_facing_use: true
  golden_media_retrieval_must_start_from_text_retrieval_card_and_timeline: true
  golden_media_reconstructed_prompt_must_not_be_labeled_as_source_prompt: true
  golden_media_without_true_source_prompt_must_not_claim_prompt_causality: true
  cdance25_version_bound_behavior_must_read_real_generation_feedback_when_relevant: true