read_sets:
  directing:
    always:
      - PROJECT_INDEX.yaml
      - AI电影系统#relevant_sections_only
      - 当前改编剧本#hit_range
      - 连续性与当前生产状态#relevant_work_item
    conditional:
      characters: 角色与表演设定库#named_characters
      scenes: 场景与空间设定库#named_scene
      map: 00_项目地图文件#required_for_spatial_direction_camera_orientation_movement
      scene_asset_identity: scene_asset_identity_schema#formal_scene_asset_camera_anchor_view_pair_or_direction_sensitive
      scene_media_resolver: scene_media_resolver_manifest#formal_scene_pixel_version_locator_or_reproducibility_sensitive
      assets: 视觉资产登记#bound_assets
      sound: 声音导演系统#sound_music_song_dialogue_foley_mix_relevant
      suno_lexicon: SUNO提示词词库与编译映射#when_suno_prompt_terms_vocal_structure_or_style_compilation
      sound_evidence: 声音导演与SUNO证据索引#only_if_sound_research_or_model_capability_uncertain
      suno_user_evidence: SUNO用户提示词资料摄取记录#only_if_source_provenance_correction_or_legacy_term_needed
      sound_unknowns: SOUND_UNKNOWN_REGISTRY#only_if_sound_tool_or_delivery_unknown
      evidence: 官方资料与证据索引#only_if_research_or_tool_uncertain
      learning: 反馈反推与系统反哺引擎#relevant_lessons
      model_real_generation_feedback: C-DANCE2.5真实生成反馈库#when_cdance_seedance_2_5_prompting_generation_reverse_observation_or_version_bound_behavior_is_relevant
      golden_prompt_cases: 优秀提示词案例库#only_if_a_relevant_precedent_or_regression_case_exists
      soac_runtime: screen_observable_audible_ir_schema#only_if_full_directing_story_to_shot_AI_execution_observable_audible_diagnosis_reverse_evaluation_or_compiler_regression

  sound_directing:
    always:
      - PROJECT_INDEX.yaml
      - AI电影系统#relevant_sections_only
      - 声音导演系统#relevant_sections_only
    conditional:
      story: 当前改编剧本#hit_range
      continuity: 连续性与当前生产状态#relevant_work_item
      characters: 角色与表演设定库#named_characters
      scenes: 场景与空间设定库#named_scene
      map: 00_项目地图文件#diegetic_source_position_or_acoustic_topology
      suno_lexicon: SUNO提示词词库与编译映射#suno_generation_or_prompt_compilation
      sound_evidence: 声音导演与SUNO证据索引#model_research_or_professional_method
      suno_user_evidence: SUNO用户提示词资料摄取记录#source_provenance_or_legacy_prompt_audit
      sound_unknowns: SOUND_UNKNOWN_REGISTRY#unresolved_sound_or_suno_capability
      sound_regression: sound_director_regression_cases#targeted_eval_or_regression
      suno_prompt_regression: suno_prompt_regression_cases#prompt_lexicon_eval_or_revalidation
      learning: 反馈反推与系统反哺引擎#relevant_sound_lessons
      golden_prompt_cases: 优秀提示词案例库#only_if_a_sound_or_suno_precedent_is_relevant

  suno_prompt_compilation:
    always:
      - PROJECT_INDEX.yaml
      - AI电影系统#relevant_sections_only
      - 声音导演系统#relevant_sections_only
      - SUNO提示词词库与编译映射#relevant_namespaces_only
    conditional:
      story: 当前改编剧本#only_if_film_or_character_song
      characters: 角色与表演设定库#only_if_character_voice_or_song
      scenes: 场景与空间设定库#only_if_diegetic_or_worldbuilding_sensitive_music
      sound_evidence: 声音导演与SUNO证据索引#current_model_capability_or_official_check
      suno_user_evidence: SUNO用户提示词资料摄取记录#legacy_term_or_source_audit
      sound_unknowns: SOUND_UNKNOWN_REGISTRY#metatag_weight_api_or_control_unknown
      suno_prompt_regression: suno_prompt_regression_cases#A_B_or_version_revalidation
      learning: 反馈反推与系统反哺引擎#relevant_sound_lessons
      golden_prompt_cases: 优秀提示词案例库#only_if_a_relevant_music_prompt_precedent_exists

  asset_registration:
    always:
      - PROJECT_INDEX.yaml
      - scene_asset_identity_schema
      - scene_media_resolver_manifest
      - 视觉资产登记
    conditional:
      - 00_项目地图文件#direction_or_topology_sensitive_assets
      - 场景与空间设定库
      - 角色与表演设定库
      - 连续性与当前生产状态

  asset_replacement:
    always:
      - PROJECT_INDEX.yaml
      - scene_asset_identity_schema
      - scene_media_resolver_manifest
      - 视觉资产登记
      - 连续性与当前生产状态#asset_binding_state
    conditional:
      map: 00_项目地图文件#when_camera_anchor_view_direction_or_topology_may_change
      scene: 场景与空间设定库#when_scene_design_or_view_duty_may_change
      regression: director_regression_cases#when_existing_version_is_pinned_by_eval_or_reproducibility

  system_research:
    always:
      - PROJECT_INDEX.yaml
      - AI电影系统#relevant_sections_only
      - 反馈反推与系统反哺引擎
      - 官方资料与证据索引
      - UNKNOWN_REGISTRY
    conditional:
      scene_asset_identity: scene_asset_identity_schema#asset_identity_camera_anchor_view_relation_or_interop_research
      scene_media_resolver: scene_media_resolver_manifest#media_version_locator_migration_or_retrieval_research
      sound: 声音导演系统#when_sound_music_song_or_audio_domain
      suno_lexicon: SUNO提示词词库与编译映射#when_suno_prompt_or_music_generation_domain
      sound_evidence: 声音导演与SUNO证据索引#when_sound_music_song_or_audio_domain
      suno_user_evidence: SUNO用户提示词资料摄取记录#when_user_prompt_pack_or_legacy_terms_are_relevant
      sound_unknowns: SOUND_UNKNOWN_REGISTRY#when_sound_music_song_or_audio_domain
      golden_prompt_protocol: 优秀提示词案例学习协议#when_golden_case_learning_or_prompt_case_system_is_relevant
      golden_prompt_evidence: 优秀提示词案例学习证据索引#when_golden_case_external_research_is_relevant
      golden_prompt_regression: golden_prompt_regression_cases#when_golden_case_protocol_eval_is_relevant
      soac_runtime: screen_observable_audible_ir_schema#when_story_to_shot_compilation_observable_audible_diagnosis_reverse_evaluation_or_compiler_test
      model_real_generation_feedback: C-DANCE2.5真实生成反馈库#when_seedance_2_5_cdance_real_generation_or_model_behavior_is_under_review

  golden_prompt_ingestion:
    always:
      - PROJECT_INDEX.yaml
      - 优秀提示词案例学习协议
      - 反馈反推与系统反哺引擎#relevant_learning_sections_only
      - maturity_model
      - 优秀提示词案例库
    conditional:
      ai_film_method: AI电影系统#relevant_sections_only
      sound_method: 声音导演系统#when_sound_music_dialogue_or_suno_case
      suno_lexicon: SUNO提示词词库与编译映射#when_suno_case
      screenplay: 当前改编剧本#only_if_story_or_dialogue_sensitive
      characters: 角色与表演设定库#named_characters
      scenes: 场景与空间设定库#named_scene
      map: 00_项目地图文件#spatial_or_camera_direction_sensitive
      scene_asset_identity: scene_asset_identity_schema#formal_scene_asset_or_camera_anchor_sensitive
      scene_media_resolver: scene_media_resolver_manifest#formal_scene_media_version_or_locator_sensitive
      assets: 视觉资产登记#bound_assets
      continuity: 连续性与当前生产状态#relevant_work_item
      evidence: 优秀提示词案例学习证据索引#K2_K3_research_or_method_validation
      regression: golden_prompt_regression_cases#protocol_or_transfer_eval
      unknowns: UNKNOWN_REGISTRY#unresolved_K3_or_model_behavior

rules:
  full_repository_injection_default: false
  local_targeted_retrieval_default: true
  global_expand_on_route_uncertainty: true
  director_task_must_read_project_index: true
  spatial_task_must_read_map: true
  formal_scene_asset_task_must_read_scene_asset_identity_schema: true
  formal_scene_media_resolution_must_read_resolver_manifest: true
  formal_scene_asset_replacement_must_classify_version_variant_or_new_view: true
  sound_relevant_task_must_read_sound_director: true
  suno_prompt_compilation_must_read_lexicon: true
  golden_prompt_explicit_user_verdict_must_run_two_step_ingestion: true
  golden_prompt_source_verbatim_must_be_preserved: true
  golden_prompt_case_registration_must_not_auto_promote_skill: true
  golden_prompt_retrieval_must_be_targeted_not_full_library: true
  cdance25_version_bound_behavior_must_read_real_generation_feedback_when_relevant: true
