read_sets:
  directing:
    always:
      - PROJECT_INDEX.yaml
      - AI电影系统#relevant_sections_only
      - 当前改编剧本#hit_range
      - 连续性与当前生产状态#relevant_work_item
    conditional:
      characters: 角色与表演设定库#named_characters
      scenes: 场景与空间设定库#named_scene
      assets: 视觉资产登记#bound_assets
      evidence: 官方资料与证据索引#only_if_research_or_tool_uncertain
      learning: 反馈反推与系统反哺引擎#relevant_lessons

  asset_registration:
    always:
      - PROJECT_INDEX.yaml
      - 视觉资产登记
    conditional:
      - 场景与空间设定库
      - 角色与表演设定库
      - 连续性与当前生产状态

  system_research:
    always:
      - PROJECT_INDEX.yaml
      - AI电影系统#relevant_sections_only
      - 反馈反推与系统反哺引擎
      - 官方资料与证据索引
      - UNKNOWN_REGISTRY

rules:
  full_repository_injection_default: false
  local_targeted_retrieval_default: true
  global_expand_on_route_uncertainty: true
  director_task_must_read_project_index: true
