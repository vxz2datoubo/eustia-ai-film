  - id: PCW-2026-08-13-SHOT-SCOPE-001
    target: 01_AI电影系统/AI电影系统.md
    route_classes:
      - general_directing_method
      - ai_image_video_method
    status: completed
    created_at: 2026-08-13
    completed_at: 2026-08-13
    commit_sha: 8e2057555ac2b2253a65c21d971eb0fe80450f2c
    verified_target: 01_AI电影系统/AI电影系统.md
    verification:
      intended_rules_present: true
      existing_main_content_intact: true
      diff_scope_verified: true
    reason: 本地精确 patch 已写入 target canonical；提交后回读确认 SHOT-SCOPE-001、S25-20、既有主档尾部和 diff 范围均符合要求。
    already_persisted_evidence:
      - 08_系统学习/反馈反推与系统反哺引擎.md#SHOT-SCOPE-001
      - 09_资料证据/官方资料与证据索引.md#单镜头可观察域与跨镜头信息隔离证据
      - 10_运行时/director_route_index.yaml#SHOT_SCOPE_LEAK
      - 11_验收/director_regression_cases.yaml#REG-SHOT-SCOPE-001
    candidate_rules_to_integrate:
      - id: SHOT-SCOPE-001
        maturity: candidate
        scene_observation: scene_verified observation / E4
        summary: 全局剧情规划与逐shot渲染条件分层；最终AI视频执行稿每个shot只编译当前camera state实际可见、可听或在本shot内被摄影机真实揭示的内容，未来shot信息放入next-shot contract而不提前进入当前visible set。
        compiler: GLOBAL PLAN internal only -> SHOT BOUNDARY -> CAMERA STATE -> VISIBLE SET -> AUDIBLE SET -> ACTION/CHANGE -> IN-SHOT REVEAL -> EXIT STATE -> NEXT-SHOT CONTRACT
        key_rules:
          - 前景中景后景只列当前机位实际可见元素
          - POV目标只在切到POV或本shot真实camera reveal后进入visible set
          - VO与镜外声属于audible set且说话者不自动成为画面实体
          - 下一shot需要继承的信息进入final_state或next-shot contract
          - 白模与因果连续分镜同样按shot/action-state隔离可见实体与几何
          - 图生视频或白模已锁当前构图时文字优先描述当前shot动作摄影机时间推进和合法新变化
        boundaries:
          - 不等于只能描述第一帧
          - 同一连续shot内真实camera reveal可按先后描述新区域和主体
          - 镜面玻璃开口中实际可见内容属于visible set
          - 镜外但可听声音可进入audible set
          - T2V无参考图时可完整建立当前shot所需环境
        regression: REG-SHOT-SCOPE-001
    integration_target_hint:
      - 在 10.1 Candidate 技能登记区新增 SHOT-SCOPE-001
      - 在 DirectorSkills Candidate 调用入口新增 S25-20 / SHOT-SCOPE-001
      - 可在 Seedance执行提示词标准中把当前可见人物与背景进一步解释为 current shot visible set
      - 保留既有所有主档内容和尾部运行时兼容章节
    verification_required:
      - fetch_current_AI电影系统
      - apply_precise_local_patch_only
      - inspect_diff_for_only_SHOT_SCOPE_related_changes
      - fetch_target_again
      - verify_SHOT_SCOPE_001_present
      - verify_S25_20_present
      - verify_existing_main_content_and_tail_intact
    completion_condition: AI电影系统.md 回读确认 SHOT-SCOPE-001 与 S25-20 已存在、既有内容完整且 diff 仅含预期改动后，状态才可改为 completed。

  - id: PCW-2026-08-13-SEQUENCE-CONTEXT-001
    target: 01_AI电影系统/AI电影系统.md
    route_classes:
      - general_directing_method
      - ai_image_video_method
    status: completed
    created_at: 2026-08-13
    completed_at: 2026-08-13
    commit_sha: afd87d5708b8a017b95675fff680ffbb98dcb158
    verified_target: 01_AI电影系统/AI电影系统.md
    verification:
      intended_rules_present: true
      optional_segment_context_field_present: true
      shot_scope_intact_and_higher_local_visual_authority: true
      existing_main_content_intact: true
      diff_scope_verified: true
    change_type:
      - MODIFY
      - EXPERIMENT
    parent_revision_series: KAIM-HIGH-SEARCH-30S
    reason: 用户提出在15至30秒多镜头AI视频执行稿前保留一个受限的本段剧情语境，使具备剧情理解能力的视频模型能基于人物动机、当前场景职能和局部社会状态自动补全合理动作、表情与环境行为；这不是恢复旧的全局剧情总结，而是一个受SHOT-SCOPE约束的segment-level semantic prior。精确局部 patch 已写入两份指定 canonical，提交后回读确认 candidate、可选模板字段、SHOT-SCOPE 局部权威与主档尾部完整。
    candidate_rules_to_integrate:
      - id: SEQUENCE-CONTEXT-001
        title: 本段剧情语境与受限全段语义锚
        maturity: candidate
        experiment_status: unvalidated
        scope: 约15至30秒的多镜头AI视频段落，尤其是模型会根据上下文自主补动作、表情、群众行为和环境反应的剧情型生成。
        purpose: 在逐shot执行描述之前提供一个很短的segment-level context，让模型理解本段人物为何行动、现场正在发生什么、各角色在本段中的职能和局部社会状态，从而提高未逐项标注的自然补全质量与跨镜头语义一致性。
        operational_rule:
          - 在逐shot块之前可加入一个简短的本段剧情语境区，默认约2至6句，长度按信息密度而不是固定字数决定。
          - 只写本生成段内会被表现、会影响表演或会影响模型自主补全的局部事实与动机。
          - 可包含当前主目标、即时行动动机、角色在本段中的职能或关系、场景当前运作状态、群众或组织正在进行的活动、必要的局部社会背景。
          - 不要求把这些信息全部直接拍成显式动作；其用途之一就是给模型合理补全微表情、视线、自然动作、群众活动和环境反应提供语义条件。
          - 逐shot块仍是视觉与声音执行权威；每个shot继续严格服从SHOT-SCOPE-001的camera state、visible set、audible set、in-shot reveal与next-shot contract。
          - 当segment context与具体shot描述冲突时，以具体shot描述和canonical事实为准。
        context_inclusion_test:
          - 这条信息是否属于当前生成段而不是完整故事或未来剧情
          - 它是否会改变当前段人物的动作选择表情注意力环境行为或镜头理解
          - 它是否能帮助模型补全合理但无需逐项指定的行为
          - 即使某事实不在每一镜显式可见它是否属于本段真实成立的局部状态
        exclude_from_sequence_context:
          - 本段不会出现也不会影响本段可见行为的未来人物实体事件或揭示
          - 后续剧情答案完整世界观和超出本段需要的背景史
          - 镜头一镜头二镜头三的流程摘要
          - 观众应该如何理解这一镜等内部导演分析
          - 后续POV或后续镜头才可见的具体前景中景后景元素清单
          - 为避免模型出错而堆叠的大量否定条款
        relation_to_SHOT_SCOPE_001:
          - SEQUENCE-CONTEXT负责本段为什么这样运作以及模型可据此自然补什么
          - SHOT-SCOPE负责这一镜此刻具体能看见和听见什么
          - sequence context不能授权任何实体提前进入某个shot的visible set
          - sequence context中提到的角色或地点只有在对应shot合法出现时才可视觉实体化
          - VO说话者仍只因声音进入audible set不能仅因sequence context被自动生成到画面
        current_scene_example_boundary:
          allowed_examples:
            - 凯姆爬上高处的即时目的可概括为侦查和扩大搜索视野并体现其高强轻松熟练的移动能力
            - 菲奥奈与副队长在当前公共区域执行巡查和秩序职责
            - 平民在教会施粥与面包发放区域排队并维持正常生活活动
            - 若某农妇触发动机已经在当前镜头方案中成立可概括其因钟声或窗外动静来到窗口
          excluded_examples:
            - 把当前30秒没有出现的目标男孩作为可见实体或详细剧情对象塞入本段总览
            - 提前说明后续抓捕目标男孩或其他尚未发生事件
            - 用完整镜头流程告诉模型先农妇再广场再副队长再屋顶
        targeted_eval:
          design: A_B_or_A_B_C
          A: 不提供sequence context只给逐shot执行稿
          B: 提供受限sequence context加同一逐shot执行稿
          optional_C: 提供过长或包含镜头流程及未来信息的全局总结作为负面对照
          compare:
            - overall_narrative_coherence
            - spontaneous_behavior_relevance
            - character_motivation_alignment
            - facial_and_micro_action_plausibility
            - crowd_and_environment_semantic_fit
            - cross_shot_entity_leakage
            - premature_reveal_rate
            - offscreen_voice_visual_leakage
            - shot_instruction_following
            - subject_action_binding
            - prompt_complexity
        promotion_gate: 真实Seedance生成结果证明受限sequence context改善本段语义连贯与自主补全且未显著增加串台提前揭示或指令漂移后才可考虑scene_verified。
    integration_target_hint:
      - 在10.1 Candidate技能登记区新增SEQUENCE-CONTEXT-001紧邻SHOT-SCOPE-001并明确二者上下层关系
      - 在Seedance执行提示词标准中于逐shot时间块前增加可选的本段剧情语境字段并标注为segment-level而非shot visible set
      - 在DirectorSkills Candidate调用入口新增对应调用项仅用于多镜头剧情段
      - 在反馈引擎把上一轮revoked的整体叙事总结修正为仍撤销旧全局总结但新增受限sequence-context实验
      - targeted eval建立后再根据真实生成结果决定maturity
    verification_required:
      - fetch_current_AI电影系统
      - apply_precise_local_patch_only
      - inspect_diff_for_only_SEQUENCE_CONTEXT_related_changes
      - fetch_target_again
      - verify_SEQUENCE_CONTEXT_001_present
      - verify_optional_segment_context_field_present
      - verify_SHOT_SCOPE_001_still_intact_and_higher_local_visual_authority
      - verify_existing_main_content_and_tail_intact
    completion_condition: AI电影系统.md回读确认SEQUENCE-CONTEXT-001与可选segment context字段已存在且SHOT-SCOPE-001完整保留后，状态才可改为completed。

  - id: PCW-2026-08-13-SCREEN-EVIDENCE-ABSTRACT-001
    target: 01_AI电影系统/AI电影系统.md
    supporting_target: 08_系统学习/反馈反推与系统反哺引擎.md
    route_classes:
      - general_directing_method
      - ai_image_video_method
    status: pending_safe_patch
    created_at: 2026-08-13
    change_type:
      - MODIFY
      - EXPERIMENT
    parent_revision_series: KAIM-HIGH-SEARCH-30S
    reason: 用户明确反馈AI视频执行稿应写镜头可见可听的东西而不是只写其含义；具体可视直白描述优先于隐喻诗性或小说化结论。现有SCREEN-EVIDENCE-001已覆盖空间动作尺度与部分压迫等抽象词转屏幕证据，本次不是新增重复技能，而是扩展其scope到情绪氛围人物气质能力感和主题含义等承担关键生成职责的抽象语义，并增加隐喻字面化风险边界。
    already_persisted_changes:
      - 10_运行时/director_route_index.yaml#SCREEN_EVIDENCE_GAP
      - 11_验收/director_regression_cases.yaml#REG-SCREEN-EVIDENCE-001
    candidate_modification:
      id: SCREEN-EVIDENCE-001
      maturity: candidate
      evidence_status: explicit_user_feedback_unvalidated_by_controlled_generation
      scope_extension:
        - 高度尺度速度危险距离空间与动作
        - 情绪与氛围
        - 人物气质能力感与状态
        - 主题或叙事含义中真正需要由画面承担的部分
      operational_rule:
        - 先判断导演意图中哪些含义必须由当前shot实际表现
        - 将关键含义翻译为最小充分的可见或可听证据再交给视频模型
        - 优先使用主体物体动作表情视线构图遮挡占幅负空间光线反射材质状态天气环境反应群众行为和声音等可渲染证据
        - 抽象词可在证据之后作为弱辅助但不能独自承担关键生成职责
        - 隐喻诗性表达或小说化句子如果不是希望按字面生成必须先转译为屏幕证据
        - 每次转译仍服从SHOT-SCOPE-001只编译当前shot合法可见可听的证据
        - 遵守Prompt Constraint Budget只保留改变目标画面或模型行为的最小充分证据
      boundaries:
        - 不是全面禁止情绪风格或抽象词
        - 风格意图可保留少量抽象标签但关键叙事表演空间动作和氛围控制应有屏幕证据支撑
        - 有意追求象征主义梦境超现实或字面隐喻画面时隐喻本身可以成为可渲染对象
        - 参考图已锁定的信息不重复高密度描述
        - 具体化不得演化为逐帧过控同义词堆叠或无叙事价值微动作清单
      fast_test: 如果一句话交给不会读心的摄影机无法直接拍出来或录出来而它又承担关键生成职责则先改写成屏幕证据
      regression: REG-SCREEN-EVIDENCE-001
      targeted_eval:
        A: 关键意图主要使用抽象含义隐喻或小说化概括
        B: 同一导演意图翻译成最小充分的可见可听证据
        compare:
          - instruction_following
          - emotional_and_atmospheric_alignment
          - character_state_readability
          - metaphor_literalization_error
          - generic_style_cliche_rate
          - unwanted_model_invention
          - prompt_complexity
          - overconstraint_rigidity
    integration_target_hint:
      - 扩展AI电影系统.md中SCREEN-EVIDENCE-001的scope trigger operational rule和boundary不新建同义技能
      - 扩展反馈引擎SCREEN-EVIDENCE-001章节的第一性原理和抽象词映射并记录本次用户反馈为MODIFY加EXPERIMENT
      - 保留现有S25-14和SCREEN_EVIDENCE_GAP路由名称不新增重复入口
      - SHOT-SCOPE-001继续裁决每个shot哪些证据合法进入执行稿
    verification_required:
      - fetch_current_AI电影系统
      - fetch_current_feedback_engine
      - apply_precise_local_patch_only
      - inspect_diff_for_only_SCREEN_EVIDENCE_scope_extension
      - verify_SCREEN_EVIDENCE_001_not_duplicated
      - verify_existing_SCREEN_EVIDENCE_behavior_preserved
      - verify_SHOT_SCOPE_001_intact
      - verify_S25_14_still_routes_to_SCREEN_EVIDENCE_001
      - fetch_targets_again
      - verify_existing_tail_intact
    completion_condition: AI电影系统.md和反馈引擎回读确认SCREEN-EVIDENCE-001已完成抽象含义与隐喻转屏幕证据的scope扩展、无重复技能且既有内容完整后才可改为completed。

rules:
