        maturity: candidate
        summary: 把关键高度、尺度、速度、危险、距离和动作关系从概念总结翻译成最小充分的可见屏幕证据。
      - id: POSITIVE-SPEC-001
        maturity: candidate
        summary: AI视频执行稿优先正向描述正确动作与允许运动范围；少量硬约束只保护剧情、身份、空间、关键道具、揭示和最终状态。
      - id: EVENT-SEQUENCE-EXPLICIT-001
        maturity: candidate
        summary: 对存在先后因果且容易被模型并发化的动作，显式写清先后顺序、施力者、被作用者与结果；不必因此逐秒锁时间码。
      - id: ROLE-FUNCTION-COMPRESSION-001
        maturity: candidate
        summary: 角色首次进入新章节时，可用一个高信息密度但因果清楚的短事件同时建立人物性格、职责、组织层级和现场关系，避免说明对白。
      - id: OPERATIONAL-PRESENCE-PRELOAD-001
        maturity: candidate
        summary: 后续某组织或角色需要快速响应事件时，前面先通过正常工作状态证明其本来就在该区域，避免剧情需要时突然出现。
      - id: MOTION-SIGNATURE-001
        maturity: candidate
        summary: 相同移动能力可通过节奏、目的、力度、支点使用和收束方式形成不同人物运动指纹，避免动作同质化。
