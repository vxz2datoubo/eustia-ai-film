write_protocol:
  - fetch_current_blob
  - edit_current_content
  - commit_serially
  - fetch_again
  - verify_new_content_and_status
  - report_committed_only_after_verification

minimax_h3_official_skill_policy:
  vendor_root: .agents/skills/h3-prompt-writing/
  upstream_repository: MiniMax-AI/MiniMax-H3
  upstream_skill_path: skills/h3-prompt-writing
  project_adapter: 10_运行时/minimax_h3_prompt_adapter.yaml
  regression_suite: 11_验收/minimax_h3_prompt_regression_cases.yaml
  vendor_files_are_verbatim_official_mirror: true
  project_rules_must_not_be_written_into_vendor_files: true
  official_skill_controls_only_h3_prompt_structure_and_syntax: true
  generic_generation_must_not_route_to_h3_skill: true
  seedance_seedream_other_model_prompting_must_not_route_to_h3_skill: true
  update_transaction:
    - fresh_fetch_upstream
    - compare_pinned_commit_and_source_blobs
    - update_vendor_files_verbatim
    - update_adapter_pin_and_project_index
    - rerun_h3_regression
    - fetch_again_and_verify

scene_media_transaction_policy:
  retrieval_policy: 10_运行时/asset_retrieval_policy.yaml
  binary_body_default_home: ChatGPT Library / Project
  logical_asset_change:
    target: 06_视觉资产/视觉资产登记库.md
    includes:
      - asset_identity
      - view_binding
      - media_role
      - variant_duty
      - default_pointer
      - user_confirmation
  media_version_or_locator_change:
    target: 10_运行时/scene_media_resolver_manifest.yaml
    includes:
      - current_version_pointer
      - media_version_history
      - content_hash
      - locator_set
      - pixel_verification
      - supersession_state
  default_locator_write_scope:
    - chatgpt_file_id
    - file_library_title
    - current_conversation_file
    - existing_compatible_locator_when_user_explicitly_supplies_it
  forbidden_registration_side_effects:
    - copy_media_body_to_github
    - copy_media_body_to_cloudflare_kv
    - copy_media_body_to_r2
    - provision_external_object_storage
    - create_api_token_or_github_secret
    - require_payment_method
  atomicity_rule: Asset职责与Version/Locator同时变化时必须串行写入两个唯一主档并最终共同回读；任一分支失败不得宣布完整替换完成。

golden_media_evidence_policy:
  schema: 10_运行时/golden_media_evidence_schema.yaml
  director_pull_schema: 10_运行时/golden_case_director_pull_schema.yaml
  default_persistence_authority: GitHub
  default_bundle_root: 11_验收/golden_case_bundles/{case_id}/
  source_video_default_persistence: transient_not_retained
  github_stores:
    - source_prompt_verbatim_when_real
    - reconstructed_prompt_when_inferred
    - provenance
    - source_hash_and_metadata_when_available
    - retrieval_card
    - timeline
    - temporal_annotations
    - compressed_contact_sheets
    - selected_keyframes
    - selected_dense_window_frames
    - audio_transcript_and_audio_event_descriptions
    - director_pull
    - prompt_effect_alignment
    - causal_graphs
    - aesthetic_and_director_fingerprint
    - user_verdict
    - eval_results
  source_video_retention_exception:
    allowed: true
    requires:
      - irreducible_motion_or_sound_evidence_or_user_explicit_request
    note: 原视频若保留只承担证据职责，不因此自动成为正式视觉资产
  media_only_without_true_source_prompt:
    may_record_observation: true
    may_create_reconstructed_prompt: true
    reconstructed_prompt_provenance: inferred_from_media
    may_claim_prompt_causality: false
  explicit_golden_case:
    case_target: 11_验收/golden_prompt_cases.yaml
    bundle_target: 11_验收/golden_case_bundles/{case_id}/
    director_pull_target: 11_验收/golden_case_bundles/{case_id}/director_pull.md
  version_bound_generation_behavior:
    target: 08_系统学习/C-DANCE2.5真实生成反馈库.md
  formal_asset_boundary:
    require_explicit_asset_intent: true
    golden_evidence_does_not_auto_become_asset: true

canonical_learning_gate:
  principle: maturity_controls_promotion_not_registration
  recall_index_is_derived_router_metadata_not_authority: true
  candidate_registration_allowed: true
  applies_to:
    - general_directing_method
    - ai_image_video_method
    - sound_directing_method
    - suno_music_method
    - suno_prompt_lexicon
    - director_feedback_learning_case
    - model_version_real_generation_feedback
    - formal_asset_retrieval_policy
  candidate_registration_requires:
    - operational_rule
    - evidence_or_user_feedback
    - scope
    - boundary_or_failure_condition
    - explicit_maturity_label
  after_learning_capture:
    - classify_write_route
    - decide_maturity
    - write_operational_rule_to_target_canonical_or_mark_pending
    - keep_evidence_and_revision_trace_in_feedback_engine
    - when_reusable_director_feedback_case_exists_record_or_update_director_feedback_learning_case
    - when_model_version_specific_store_real_generation_input_output_observation_in_model_feedback_library
    - create_or_update_targeted_eval_when_needed
    - fetch_again_and_verify_target_canonical
  pending_write_policy:
    canonical_write_failure_or_unsafe_edit_must_be_explicit: true
    may_not_report_fully_integrated_until_verified: true
    next_project_turn_must_recheck_pending_canonical_write: true
  promotion_policy:
    candidate_to_scene_verified_requires_validation: true
    scene_verified_to_project_verified_requires_cross_scene_evidence: true
    project_verified_to_general_stable_requires_clear_transfer_boundary: true

golden_prompt_ingestion_gate:
  trigger_authority: user_explicit_golden_case_verdict
  required_steps:
    - learn_from_case
    - execute_director_grade_pull
    - register_case_verbatim_or_reconstructed_with_provenance
  learn_from_case:
    - run_edcm_k0_k1_k2_k3_scan
    - when_media_exists_distill_adaptive_temporal_evidence
    - align_visual_audio_and_text_to_seconds
    - build_world_cinematic_and_prompt_control_causal_graphs_when_relevant
    - distill_atomic_lessons
    - link_or_conflict_with_existing_skills
    - assign_maturity_without_auto_global_promotion
    - route_each_lesson_to_unique_domain_canonical_or_mark_pending
    - create_targeted_eval_or_regression_when_needed
  execute_director_grade_pull:
    schema: 10_运行时/golden_case_director_pull_schema.yaml
    output: 11_验收/golden_case_bundles/{case_id}/director_pull.md
    machine_output_optional: 11_验收/golden_case_bundles/{case_id}/director_pull.yaml
    mode_selection:
      verified_media: observed_director_pull
      prompt_only: prompt_prospective_director_analysis
      prompt_plus_verified_media: hybrid_pull
    must_analyze:
      - context_and_trigger
      - dramatic_function
      - audience_cognition
      - character_inner_action_with_confidence
      - performance_beats
      - duration_hold_latency_threshold_and_release
      - blocking_camera_and_composition
      - editing_and_rhythm
      - sound_strategy_and_sound_punctuation
      - observation_vs_inference
      - why_it_works
      - retrieval_mechanisms
      - transfer_boundaries
      - prompt_distillation
    low_motion_rule:
      - stillness_may_be_high_information
      - duration_evidence_must_survive_perceptual_dedup
      - preserve_hold_start_middle_microchange_threshold_release_when_relevant
  register_case_verbatim_or_reconstructed_with_provenance:
    - preserve_source_prompt_verbatim_when_true_source_exists
    - if_source_prompt_absent_keep_reconstructed_prompt_separate_and_labeled_inferred
    - distinguish_prompt_approval_from_output_verification
    - when_media_exists_bind_using_golden_media_evidence_schema
    - write_or_update_golden_prompt_case
    - write_or_update_case_bundle
    - link_director_pull_to_case
    - preserve_model_version_asset_and_provenance_when_known
  verification:
    - fetch_target_domain_canonical_if_lesson_written
    - fetch_golden_prompt_cases
    - verify_case_and_lesson_references
    - verify_director_pull_exists_and_mode_matches_evidence
    - verify_low_motion_duration_evidence_preserved_when_relevant
    - verify_case_bundle_timestamps_and_retrieval_card_when_media_is_bound
    - verify_reconstructed_prompt_not_mislabeled_as_source_prompt
    - report_partial_status_if_one_branch_failed

rules:
  memory_cannot_substitute_for_formal_write: true
  candidate_cannot_auto_promote_to_stable: true
  candidate_can_exist_in_target_canonical_with_maturity_label: true
  registration_and_promotion_are_separate: true
  fixed_active_filenames_only: true
  revision_checkpoint_does_not_equal_skill_promotion: true
  omitted_constraint_does_not_equal_revoked: true
  sound_subsystem_cannot_override_story_character_scene_or_map_canonical: true
  suno_lexicon_cannot_override_sound_director_or_current_official_model_capability: true
  minimax_h3_vendor_files_must_remain_verbatim_official: true
  minimax_h3_project_adapter_cannot_become_second_director_system: true
  minimax_h3_official_skill_cannot_route_generic_generation: true
  minimax_h3_official_skill_cannot_contaminate_seedance_seedream_or_other_model_prompts: true
  golden_prompt_case_registration_and_skill_promotion_are_separate: true
  golden_prompt_source_verbatim_cannot_be_replaced_by_normalized_summary: true
  golden_prompt_exact_demo_case_cannot_be_sole_holdout_eval: true
  golden_prompt_case_replay_must_be_targeted_and_bounded: true
  golden_case_director_pull_is_mandatory_for_explicit_golden_ingestion: true
  golden_case_prompt_only_pull_must_be_prospective_not_observed: true
  golden_case_low_motion_cannot_be_deduped_without_duration_check: true
  golden_case_emotion_retrieval_must_use_mechanism_not_only_label: true
  golden_media_persistent_representation_is_temporal_evidence_bundle_by_default: true
  golden_media_source_video_is_not_required_for_default_persistence: true
  golden_media_seconds_are_primary_human_temporal_coordinate: true
  golden_media_reconstructed_prompt_cannot_be_reported_as_original_prompt: true
  golden_media_observational_sequence_cannot_prove_physical_or_prompt_causality: true
  golden_media_storage_does_not_imply_model_weight_training: true
  scene_asset_identity_schema_controls_scene_camera_view_asset_version_relation_identifiers: true
  scene_media_resolver_manifest_controls_scene_asset_current_version_and_locator_resolution: true
  asset_retrieval_policy_cannot_create_second_asset_or_version_resolver: true
  formal_asset_registration_cannot_imply_binary_replication: true
  formal_asset_external_storage_is_exception_only: true
  model_version_feedback_cannot_override_general_directing_method_or_canonical_story_character_scene_asset_facts: true
  confounded_ab_result_cannot_promote_maturity: true
