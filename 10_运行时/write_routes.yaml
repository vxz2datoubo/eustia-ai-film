  sound_directing_method: 01_AI电影系统/声音导演系统.md
  suno_music_method: 01_AI电影系统/声音导演系统.md
  project_long_term_fact: 02_AI电影项目记忆/AI电影项目记忆.md
  confirmed_story_change: 03_剧本与改编/当前改编剧本.md
  character_behavior_dialogue_relationship: 04_角色与表演/角色与表演设定库.md
  scene_local_design_material_light_props: 05_场景与空间/场景与空间设定库.md
  scene_topology_map_movement: 05_场景与空间/00_项目地图文件.md
  formal_visual_asset: 06_视觉资产/视觉资产登记库.md
  current_shot_production_state: 07_连续性与生产状态/连续性与当前生产状态.md
  revision_checkpoint_current_state: 07_连续性与生产状态/连续性与当前生产状态.md
  revision_trace_and_learning: 08_系统学习/反馈反推与系统反哺引擎.md
  learning_evidence_and_outcome: 08_系统学习/反馈反推与系统反哺引擎.md
