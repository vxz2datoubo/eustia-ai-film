write_protocol:
  - fetch_current_blob
  - edit_current_content
  - commit_serially
  - fetch_again
  - verify_new_content_and_status
  - report_committed_only_after_verification

scene_media_transaction_policy:
  logical_asset_change:
    target: 06_视觉资产/视觉资产登记库.md
    includes:
      - asset_identity
      - view_binding
      - media_role
      - variant_duty
      - default_pointer
      - user_confirmation
  media_version_or_locator_change:
    target: 10_运行时/scene_media_resolver_manifest.yaml
    includes:
      - current_version_pointer
      - media_version_history
      - content_hash
      - locator_set
      - pixel_verification
      - supersession_state
  atomicity_rule: Asset职责与Version/Locator同时变化时必须串行写入两个唯一主档并最终共同回读；任一分支失败不得宣布完整替换完成。

canonical_learning_gate:
  principle: maturity_controls_promotion_not_registration
  candidate_registration_allowed: true
  applies_to:
    - general_directing_method
    - ai_image_video_method
    - sound_directing_method
    - suno_music_method
    - suno_prompt_lexicon
  candidate_registration_requires:
    - operational_rule
    - evidence_or_user_feedback
    - scope
    - boundary_or_failure_condition
    - explicit_maturity_label
  after_learning_capture:
    - classify_write_route
    - decide_maturity
    - write_operational_rule_to_target_canonical_or_mark_pending
    - keep_evidence_and_revision_trace_in_feedback_engine
    - create_or_update_targeted_eval_when_needed
    - fetch_again_and_verify_target_canonical
  pending_write_policy:
    canonical_write_failure_or_unsafe_edit_must_be_explicit: true
    may_not_report_fully_integrated_until_verified: true
    next_project_turn_must_recheck_pending_canonical_write: true
  promotion_policy:
    candidate_to_scene_verified_requires_validation: true
    scene_verified_to_project_verified_requires_cross_scene_evidence: true
    project_verified_to_general_stable_requires_clear_transfer_boundary: true

golden_prompt_ingestion_gate:
  trigger_authority: user_explicit_golden_case_verdict
  required_steps:
    - learn_from_case
    - register_case_verbatim
  learn_from_case:
    - run_edcm_k0_k1_k2_k3_scan
    - distill_atomic_lessons
    - link_or_conflict_with_existing_skills
    - assign_maturity_without_auto_global_promotion
    - route_each_lesson_to_unique_domain_canonical_or_mark_pending
    - create_targeted_eval_or_regression_when_needed
  register_case_verbatim:
    - preserve_source_prompt_verbatim
    - distinguish_prompt_approval_from_output_verification
    - write_or_update_golden_prompt_case
    - preserve_model_version_asset_and_provenance_when_known
  verification:
    - fetch_target_domain_canonical_if_lesson_written
    - fetch_golden_prompt_cases
    - verify_case_and_lesson_references
    - report_partial_status_if_one_branch_failed

rules:
  memory_cannot_substitute_for_formal_write: true
  candidate_cannot_auto_promote_to_stable: true
  candidate_can_exist_in_target_canonical_with_maturity_label: true
  registration_and_promotion_are_separate: true
  fixed_active_filenames_only: true
  revision_checkpoint_does_not_equal_skill_promotion: true
  omitted_constraint_does_not_equal_revoked: true
  sound_subsystem_cannot_override_story_character_scene_or_map_canonical: true
  suno_lexicon_cannot_override_sound_director_or_current_official_model_capability: true
  golden_prompt_case_registration_and_skill_promotion_are_separate: true
  golden_prompt_source_verbatim_cannot_be_replaced_by_normalized_summary: true
  golden_prompt_exact_demo_case_cannot_be_sole_holdout_eval: true
  golden_prompt_case_replay_must_be_targeted_and_bounded: true
  scene_asset_identity_schema_controls_scene_camera_view_asset_version_relation_identifiers: true
  scene_media_resolver_manifest_controls_scene_asset_current_version_and_locator_resolution: true
