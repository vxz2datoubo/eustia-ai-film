schema_version: "1.0"
index_id: EUSTIA_LEARNING_RECALL_INDEX
status: active
role: compact_derived_router_metadata_only
canonical_authority_boundary:
  this_index_is_not_learning_authority: true
  full_learning_authority_remains_in_referenced_canonical: true
  may_store_only:
    - authority_ref
    - recall_signature
    - routing_scope
    - maturity_summary
    - mandatory_scans
    - conflict_refs
  must_not_copy_full_learning_rules: true
source_authorities:
  - 08_系统学习/导演反馈学习案例.yaml
  - 08_系统学习/C-DANCE2.5真实生成反馈库.md
  - 11_验收/golden_prompt_cases.yaml
retrieval_runtime:
  top_k_default: 5
  normalize_casefold: true
  ranking_priority:
    - hard_canonical
    - failure_mechanism
    - dramatic_function
    - spatial_action_relation
    - character_mechanism
    - model_version
    - camera_performance_sound
    - surface_similarity
  weights:
    hard_canonical: 10000
    failure_mechanism: 120
    dramatic_function: 90
    spatial_action_relation: 75
    character_mechanism: 55
    model_version: 40
    camera_performance_sound: 20
    surface_similarity: 5
    negative_retrieval: -300
  embedding_policy:
    future_candidate_expansion_allowed: true
    role: candidate_expansion_only
    may_bypass_authority_gate: false
    may_bypass_scope_gate: false
    may_bypass_maturity_gate: false
    may_bypass_model_version_gate: false
    may_bypass_conflict_gate: false
    may_satisfy_mandatory_route_without_canonical_ref: false
receipt_contract:
  required_fields:
    - task_id
    - index_id
    - index_schema_version
    - hard_routes
    - mandatory_case_ids
    - scored_candidates
    - selected_case_ids
    - selected_authority_refs
    - excluded_candidates
    - filters_applied
    - unresolved_conflicts
    - mandatory_recall_satisfied
    - top_k
    - receipt_complete
