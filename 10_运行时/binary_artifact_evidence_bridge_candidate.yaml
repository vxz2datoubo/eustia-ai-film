schema_version: "1.0"
component_id: BINARY_ARTIFACT_EVIDENCE_BRIDGE
status: candidate
source_issue: 107
activation: absent_until_independent_accept_and_separate_registration

purpose:
  - 从运行时实际可读的媒体/文件字节计算 invocation-local 内容身份
  - 为 before/after 实际字节提供 same-content / distinct-content 证据
  - 为后续 generation provenance bridge 提供最小二进制事实层，但绝不自行宣称生成事件身份

canonical_relationship:
  project_index: PROJECT_INDEX.yaml
  asset_registry: 06_视觉资产/视觉资产登记库.md
  asset_retrieval_policy: 10_运行时/asset_retrieval_policy.yaml
  golden_media_evidence_schema: 10_运行时/golden_media_evidence_schema.yaml
  final_delta_candidate: tools/learning_retriever/learning_retriever/final_delta.py

truth_layers:
  BYTE_VERIFIED:
    meaning: 本次调用中 runtime 自己打开并完整读取了实际普通文件字节，并由这些字节计算内容哈希
  DISTINCT_CONTENT_VERIFIED:
    meaning: 本次 pair 调用中 before/after 的 runtime-computed 内容身份不同
  GENERATION_BINDING_UNVERIFIED:
    meaning: 不证明这些字节分别对应哪个模型生成事件、generation_id 或 vendor job
  FORMAL_ASSET_UNVERIFIED:
    meaning: 不证明这些字节已登记为项目正式 Asset / Media Version

hard_invariants:
  locator_is_not_identity: true
  caller_hash_is_not_identity: true
  caller_verified_boolean_is_not_authority: true
  serialized_receipt_is_not_reusable_verification_authority: true
  content_hash_must_be_computed_from_actual_bytes_by_runtime: true
  hashing_must_be_streaming_bounded_memory: true
  same_bytes_under_different_paths_are_same_content: true
  distinct_bytes_do_not_prove_distinct_generation_events: true
  byte_receipt_does_not_register_formal_asset: true
  byte_receipt_does_not_prove_pixels_opened_or_semantically_verified: true
  final_delta_repair_attribution_not_activated_by_this_candidate: true
  no_second_asset_authority: true
  no_second_learning_authority: true

input_contract:
  accepted_authority_input:
    - actual_local_file_locator_readable_by_current_runtime
  rejected_as_verification_authority:
    - serialized_receipt_mapping
    - caller_supplied_sha256
    - caller_supplied_byte_length
    - caller_supplied_verified_boolean
    - chatgpt_file_id_string_without_actual_binary_resolution
    - file_library_title_without_actual_binary_resolution
    - media_ref_string_without_actual_binary_resolution
    - generation_id_string
    - filename_or_extension

single_artifact_observation:
  algorithm: sha256
  runtime_read_mode: read_only_binary_stream
  symlink_policy: reject_locator_indirection_for_v1
  regular_file_required: true
  empty_file_allowed: true
  receipt_fields:
    - content_sha256
    - byte_length
    - locator_fingerprint
    - locator_class
    - byte_verification_state
    - generation_binding_state
    - formal_asset_state
  receipt_authority:
    actual_bytes_observed: true
    content_identity_observed: true
    generation_event_identity: false
    formal_asset_identity: false
    pixel_or_audio_semantic_identity: false

pair_verification:
  public_authority_input: two_actual_file_locators
  implementation: reexecute_single_artifact_observation_for_each_locator
  serialized_receipt_pair_input: forbidden
  same_content_when:
    - same_runtime_computed_sha256
    - same_runtime_computed_byte_length
  distinct_content_when:
    - runtime_computed_content_identity_differs
  output_claim_limit: byte_content_identity_only
  generation_event_distinct_claim: forbidden
  formal_asset_distinct_claim: forbidden

failure_codes:
  ARTIFACT_LOCATOR_INVALID: locator type/shape is unsupported
  ARTIFACT_NOT_FOUND: target file does not exist at read time
  ARTIFACT_LOCATOR_INDIRECTION_FORBIDDEN: symbolic-link style indirection is rejected in v1
  ARTIFACT_NOT_REGULAR_FILE: locator resolves to directory/device/non-regular file
  ARTIFACT_READ_FAILED: actual binary read could not complete
  ARTIFACT_MUTATED_DURING_READ: underlying file identity/size/mtime changed during observation

candidate_isolation:
  project_index_registration: forbidden
  read_set_registration: forbidden
  write_route_registration: forbidden
  package_public_export_required: false
  asset_registry_write: forbidden
  continuity_write: forbidden
  final_delta_activation: forbidden
  generation_trigger: forbidden

future_binding_requirements:
  - separate governed adapter must prove exact inspected artifact corresponds to exact before/after generation provenance
  - generation binding must not trust caller generation_id alone
  - consumer requiring byte authority must re-execute actual-byte verification in the trusted call path rather than accept serialized receipts
  - formal asset registration remains governed by existing asset registry/resolver write transaction
