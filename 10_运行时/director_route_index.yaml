routes:
  - id: CHARACTER_WAITS_FOR_PLOT
    symptoms:
      - 人物像在等剧情
      - 人物一出场才开始做事
      - 所有人反应一致
      - 行为过度理性
    mandatory_scans:
      - CALC
      - CLCS
      - character_knowledge_boundary
    candidate_axes:
      - preexisting_activity
      - interruption_and_resumption
      - personality_specific_response
      - duty_and_relationship_filter

  - id: MOTIVATION_BEFORE_TONE
    symptoms:
      - 群众反应像类型模板而不是从动机推出
      - 贫苦群众被默认写成嘲讽权威或反机构
      - 群众喜怒与救济信仰希望或现实依赖不匹配
      - 角色当前需求与表演语气矛盾
      - 同一群体对不同机构的态度被简单合并
    maturity: candidate
    mandatory_reads:
      - 08_系统学习/导演反馈学习案例.yaml#MOTIVE-FIRST-CROWD-001
    mandatory_scans:
      - immediate_need
      - material_dependency
      - hope_dependency
      - spiritual_dependency
      - institutional_function
      - grievance_target
      - perceived_legitimacy
      - fear_and_cost
      - emotional_ambivalence
      - group_heterogeneity
      - motive_before_tone
    candidate_axes:
      - silence_as_reverence
      - ritual_attention
      - ambivalent_dependence
      - institution_as_hope
      - differentiated_group_reaction
      - comedy_only_after_motive_validation

  - id: EXPOSITION_STALL
    symptoms:
      - 持续对白
      - 世界观说明
      - 画外音
      - 节奏停滞
      - 信息很多但画面不推进
      - 重要世界观不能简单删减但真人讲话过于枯燥
      - 宗教历史传说或制度起源需要视觉化
    mandatory_reads:
      - 08_系统学习/导演反馈学习案例.yaml#EXPOSITION-MEDIA-DISTANCE-001
    mandatory_scans:
      - exposition_information_value
      - placement_need
      - narrative_multiplex
      - attention_budget
      - reveal_budget
      - representation_medium
      - epistemic_status_of_history
      - temporal_distance
      - religious_or_cultural_frame
      - dialogue_speakability
      - return_to_present
      - asset_lock_cost
    candidate_axes:
      - compression
      - embodiment
      - temporal_parallel
      - deliberate_stillness
      - illustrated_history
      - parchment_animation
      - cultural_iconography
      - stylized_historical_visualization
      - realistic_flashback
      - medium_A_B_validation

  - id: VN_TO_FILM_DIALOGUE
    symptoms:
      - GAL
      - galgame
      - 文字游戏台词
      - 原作对白太书面
      - 小说式对白
      - 长句读起来成立但说出来不像真人
      - 原作说明句需要电影化
      - 台词需要更能表演和一次听懂
    maturity: candidate
    mandatory_reads:
      - 08_系统学习/导演反馈学习案例.yaml#VN-TO-FILM-DIALOGUE-001
    mandatory_scans:
      - source_medium
      - dramatic_information_to_preserve
      - character_register
      - dialogue_speakability
      - breath_grouping
      - emphasis_and_stress
      - listener_one_pass_comprehension
      - source_line_lock_status
    candidate_axes:
      - preserve_information_not_sentence_shape
      - spoken_phrase_grouping
      - playable_emphasis
      - character_register_preservation
      - terminology_clarity

  - id: SCREEN_EVIDENCE_GAP
    symptoms:
      - 提示词太概念
      - 画面描述太空泛
      - 像小说需要观众脑补
      - 数层高或很高但没有可见高度证据
      - 很快或很危险但没有动作与空间证据
      - AI需要自行猜测画面
      - 抽象形容词承担了关键空间或动作信息
      - 抽象情绪氛围人物气质能力感或主题含义承担关键生成职责但没有可见可听证据
      - 使用隐喻诗性表达或小说化结论让模型自行猜测应渲染成什么
      - 只写忧郁压迫神圣高手感紧张感等含义而没有光线材质构图动作表情环境或声音证据
      - 为补救歧义不断堆叠约束
    maturity: candidate
    mandatory_reads:
      - 08_系统学习/反馈反推与系统反哺引擎.md#SCREEN-EVIDENCE-001
    mandatory_scans:
      - observable_screen_evidence
      - visible_frame_outline
      - abstract_meaning_to_renderable_evidence
      - literal_renderability
      - metaphor_literalization_risk
      - relative_scale_and_elevation
      - physical_contact_action_chain
      - environment_response
      - audible_evidence
      - modality_role_split
      - prompt_constraint_budget
      - final_state
    candidate_axes:
      - visible_geometry_anchor
      - relative_position_anchor
      - scale_and_height_evidence
      - physical_contact_and_motion
      - light_material_environment_evidence
      - facial_gaze_body_evidence
      - audible_behavioral_evidence
      - environmental_reaction
      - abstract_as_optional_auxiliary
      - temporal_order_without_forced_timecode
      - minimum_sufficient_constraints
      - final_state_anchor

  - id: NEGATIVE_CONSTRAINT_OVERLOAD
    symptoms:
      - 大量否定词
      - 不飞跃不悬空等绝对动作禁令
      - 禁止项比正向动作描述更强或更长
      - 模型为了满足禁止项改走错误动作路线
      - 出现形式合规但导演意图失败的替代行为
      - 为避免夸张动作而误杀正常的短距离腾跃或自然悬空
      - 负面约束导致动作僵硬保守或退化
    maturity: candidate
    mandatory_reads:
      - 08_系统学习/反馈反推与系统反哺引擎.md#POSITIVE-SPEC-001
    mandatory_scans:
      - positive_target_specification
      - negation_scope
      - hard_vs_soft_constraint
      - feasible_action_space
      - substitute_behavior_risk
      - prompt_constraint_budget
      - platform_negative_prompt_support
      - physical_motion_envelope
    candidate_axes:
      - positive_action_envelope
      - bounded_freedom
      - localized_exclusion
      - hard_invariants_only
      - physical_support_evidence
      - reference_based_control
      - A_B_C_validation

  - id: SHOT_SCOPE_LEAK
    symptoms:
      - 当前镜头描述了当前机位实际看不到的人物场景或目标
      - 反应镜头提前写入下一主观镜头才会揭示的内容
      - 画面还没切到POV就把POV目标写进当前shot
      - 全局剧情总结被复制进每个镜头执行描述
      - 画外音人物被错误实体化进当前画面
      - 当前shot混入后续shot的背景实体或空间信息
      - 镜头视点与提示词中的前景中景后景不一致
    maturity: candidate
    mandatory_reads:
      - 08_系统学习/反馈反推与系统反哺引擎.md#SHOT-SCOPE-001
    mandatory_scans:
      - shot_observable_set
      - camera_view_consistency
      - visible_entity_scope
      - audible_offscreen_scope
      - global_summary_vs_shot_caption
      - reveal_scope
      - transition_contract
      - cross_shot_information_leakage
      - prompt_constraint_budget
    candidate_axes:
      - shot_local_prompt_compilation
      - current_visible_set
      - current_audible_set
      - latent_global_state_isolation
      - reveal_on_cut_or_camera_reveal
      - per_shot_entity_binding
      - next_shot_contract
      - storyboard_scope_alignment

  - id: SEQUENCE_CONTEXT_UNDERCONDITIONED
    symptoms:
      - 多镜头剧情段每个shot单独成立但整段像彼此失联的片段
      - AI自动补出的表情视线小动作与人物当前动机不符
      - 群众和环境行为技术上合理但不符合当前场景正在运作的社会状态
      - 角色在多个shot中缺少一致的即时目标或职业职能感
      - 逐shot提示很完整但模型仍把现场理解成泛化的街景人群或随机活动
      - 15至30秒多镜头段需要模型自主补全大量未逐项标注的自然行为
    maturity: candidate
    mandatory_reads:
      - 12_未知项/UNKNOWN_REGISTRY.yaml#U-SEQUENCE-CONTEXT-001
      - 01_AI电影系统/AI电影系统.md#SHOT-SCOPE-001
    mandatory_scans:
      - segment_context_need
      - segment_causal_relevance
      - current_character_motives
      - current_role_and_relationship_state
      - scene_operating_state
      - spontaneous_behavior_budget
      - entity_embodiment_gate
      - future_information_leakage
      - shot_scope_compatibility
      - prompt_constraint_budget
    candidate_axes:
      - limited_segment_context
      - motive_prior
      - role_prior
      - scene_state_prior
      - local_social_context
      - guided_spontaneous_behavior
      - per_shot_visual_authority
      - A_B_C_validation

