routes:
  - id: CHARACTER_WAITS_FOR_PLOT
    symptoms:
      - 人物像在等剧情
      - 人物一出场才开始做事
      - 所有人反应一致
      - 行为过度理性
    mandatory_scans:
      - CALC
      - CLCS
      - character_knowledge_boundary
    candidate_axes:
      - preexisting_activity
      - interruption_and_resumption
      - personality_specific_response
      - duty_and_relationship_filter

  - id: EXPOSITION_STALL
    symptoms:
      - 持续对白
      - 世界观说明
      - 画外音
      - 节奏停滞
      - 信息很多但画面不推进
    mandatory_scans:
      - narrative_multiplex
      - attention_budget
      - reveal_budget
    candidate_axes:
      - compression
      - embodiment
      - temporal_parallel
      - deliberate_stillness

  - id: SCREEN_EVIDENCE_GAP
    symptoms:
      - 提示词太概念
      - 画面描述太空泛
      - 像小说需要观众脑补
      - 数层高或很高但没有可见高度证据
      - 很快或很危险但没有动作与空间证据
      - AI需要自行猜测画面
      - 抽象形容词承担了关键空间或动作信息
      - 抽象情绪氛围人物气质能力感或主题含义承担关键生成职责但没有可见可听证据
      - 使用隐喻诗性表达或小说化结论让模型自行猜测应渲染成什么
      - 只写忧郁压迫神圣高手感紧张感等含义而没有光线材质构图动作表情环境或声音证据
      - 为补救歧义不断堆叠约束
    maturity: candidate
    mandatory_reads:
      - 08_系统学习/反馈反推与系统反哺引擎.md#SCREEN-EVIDENCE-001
    mandatory_scans:
      - observable_screen_evidence
      - visible_frame_outline
      - abstract_meaning_to_renderable_evidence
      - literal_renderability
      - metaphor_literalization_risk
      - relative_scale_and_elevation
      - physical_contact_action_chain
      - environment_response
      - audible_evidence
      - modality_role_split
      - prompt_constraint_budget
      - final_state
    candidate_axes:
      - visible_geometry_anchor
      - relative_position_anchor
      - scale_and_height_evidence
      - physical_contact_and_motion
      - light_material_environment_evidence
      - facial_gaze_body_evidence
      - audible_behavioral_evidence
      - environmental_reaction
      - abstract_as_optional_auxiliary
      - temporal_order_without_forced_timecode
      - minimum_sufficient_constraints
      - final_state_anchor

  - id: NEGATIVE_CONSTRAINT_OVERLOAD
    symptoms:
      - 大量否定词
      - 不飞跃不悬空等绝对动作禁令
      - 禁止项比正向动作描述更强或更长
      - 模型为了满足禁止项改走错误动作路线
      - 出现形式合规但导演意图失败的替代行为
      - 为避免夸张动作而误杀正常的短距离腾跃或自然悬空
      - 负面约束导致动作僵硬保守或退化
    maturity: candidate
    mandatory_reads:
      - 08_系统学习/反馈反推与系统反哺引擎.md#POSITIVE-SPEC-001
    mandatory_scans:
      - positive_target_specification
      - negation_scope
      - hard_vs_soft_constraint
      - feasible_action_space
      - substitute_behavior_risk
      - prompt_constraint_budget
      - platform_negative_prompt_support
      - physical_motion_envelope
    candidate_axes:
      - positive_action_envelope
      - bounded_freedom
      - localized_exclusion
      - hard_invariants_only
      - physical_support_evidence
      - reference_based_control
      - A_B_C_validation

  - id: SHOT_SCOPE_LEAK
    symptoms:
      - 当前镜头描述了当前机位实际看不到的人物场景或目标
      - 反应镜头提前写入下一主观镜头才会揭示的内容
      - 画面还没切到POV就把POV目标写进当前shot
      - 全局剧情总结被复制进每个镜头执行描述
      - 画外音人物被错误实体化进当前画面
      - 当前shot混入后续shot的背景实体或空间信息
      - 镜头视点与提示词中的前景中景后景不一致
    maturity: candidate
    mandatory_reads:
      - 08_系统学习/反馈反推与系统反哺引擎.md#SHOT-SCOPE-001
    mandatory_scans:
      - shot_observable_set
      - camera_view_consistency
      - visible_entity_scope
      - audible_offscreen_scope
      - global_summary_vs_shot_caption
      - reveal_scope
      - transition_contract
      - cross_shot_information_leakage
      - prompt_constraint_budget
    candidate_axes:
      - shot_local_prompt_compilation
      - current_visible_set
      - current_audible_set
      - latent_global_state_isolation
      - reveal_on_cut_or_camera_reveal
      - per_shot_entity_binding
      - next_shot_contract
      - storyboard_scope_alignment

  - id: SEQUENCE_CONTEXT_UNDERCONDITIONED
    symptoms:
      - 多镜头剧情段每个shot单独成立但整段像彼此失联的片段
      - AI自动补出的表情视线小动作与人物当前动机不符
      - 群众和环境行为技术上合理但不符合当前场景正在运作的社会状态
      - 角色在多个shot中缺少一致的即时目标或职业职能感
      - 逐shot提示很完整但模型仍把现场理解成泛化的街景人群或随机活动
      - 15至30秒多镜头段需要模型自主补全大量未逐项标注的自然行为
    maturity: candidate
    mandatory_reads:
      - 12_未知项/UNKNOWN_REGISTRY.yaml#U-SEQUENCE-CONTEXT-001
      - 01_AI电影系统/AI电影系统.md#SHOT-SCOPE-001
    mandatory_scans:
      - segment_context_need
      - segment_causal_relevance
      - current_character_motives
      - current_role_and_relationship_state
      - scene_operating_state
      - spontaneous_behavior_budget
      - entity_embodiment_gate
      - future_information_leakage
      - shot_scope_compatibility
      - prompt_constraint_budget
    candidate_axes:
      - limited_segment_context
      - motive_prior
      - role_prior
      - scene_state_prior
      - local_social_context
      - guided_spontaneous_behavior
      - per_shot_visual_authority
      - A_B_C_validation

  - id: SPACE_CONTINUITY_RISK
    symptoms:
      - 左右反了
      - 正反打关系不清
      - 桥上桥下混乱
      - 场景拓扑漂移
    mandatory_scans:
      - map_authority
      - camera_orientation
      - asset_direction_tags
      - adjacency_and_height

  - id: SOUND_DIRECTOR_INVOCATION
    symptoms:
      - 配乐
      - BGM
      - score
      - underscore
      - SUNO
      - 主题曲
      - 片头曲
      - 片尾曲
      - 插曲
      - 角色歌
      - 歌词
      - 画内音乐
      - 环境声
      - Foley
      - 音效
      - 声桥
      - 静默
      - 混音
      - 对白听不清
      - stem
      - 完整导演且声音可能改变剧情理解或剪辑
    mandatory_reads:
      - 01_AI电影系统/声音导演系统.md#relevant_sections_only
    mandatory_scans:
      - sound_need
      - diegesis
      - narrative_sound_function
      - dialogue_priority
      - audience_knowledge
      - sound_layer_hierarchy
      - music_or_silence
      - spotting_need
      - edit_and_mix_interface
    candidate_axes:
      - silence
      - ambience
      - foley
      - sfx
      - source_music
      - underscore
      - song
      - sound_bridge
      - subjective_sound

  - id: SUNO_SONG_SCORE_ROUTING
    symptoms:
      - SUNO提示词
      - 做一首歌
      - 主题曲
      - 角色歌
      - 写歌词
      - 电影配乐
      - 长Cue
      - 配一段音乐
      - 同一个Suno既做歌曲又做配乐
    mandatory_reads:
      - 01_AI电影系统/声音导演系统.md#4-先分流再创作
      - 09_资料证据/声音导演与SUNO证据索引.md
    mandatory_scans:
      - task_class_song_vs_score
      - central_intent_or_scene_function
      - prosody_if_song
      - spotting_if_score
      - structure_goal
      - diegesis
      - suno_current_capability
      - rights_provenance
    candidate_axes:
      - song_compiler
      - film_score_compiler
      - diegetic_music_compiler
      - hybrid_music_task

  - id: SUNO_VERSION_REVALIDATION
    symptoms:
      - Suno更新
      - Suno新模型
      - v5.5以后新版本
      - 提示词突然失效
      - Exclude效果变化
      - Voice效果变化
      - Custom Model效果变化
      - Stem效果变化
      - Song Editor功能变化
    maturity: candidate
    mandatory_reads:
      - 01_AI电影系统/声音导演系统.md#8-Suno当前执行层版本相关
      - 12_未知项/SOUND_UNKNOWN_REGISTRY.yaml
      - 11_验收/sound_director_regression_cases.yaml#REG-SOUND-MODEL-UPDATE-001
    mandatory_scans:
      - current_official_model
      - feature_availability
      - version_bound_rules
      - prior_project_evidence_version
      - needs_revalidation
      - regression_scope
    candidate_axes:
      - official_doc_refresh
      - controlled_A_B_retest
      - preserve_stable_sound_principles
      - deprecate_version_specific_prompt_hacks

  - id: ASSET_REGISTRATION
    symptoms:
      - 登记资产
      - 加入资产库
      - 录入资产
      - 设为正式资产
    mandatory_scans:
      - asset_identity
      - source_authority
      - continuity_binding
      - commit_verification
    candidate_axes: []

  - id: MULTI_REVISION_WORK_ITEM
    symptoms:
      - 在上一版基础上继续改
      - 这版更好
      - 这版不对再改
      - 继续修改同一镜头
      - 继续修改同一场景
      - 这一版先用
      - 好了下一镜
      - 换下一个场景
    mandatory_scans:
      - revision_series_identity
      - constraint_ledger
      - accepted_vs_revoked
      - continuity_inheritance
      - checkpoint_need
      - semantic_finalization
      - trajectory_final_delta
    candidate_axes:
      - micro_capture
      - preserve_accepted_constraints
      - checkpoint
      - final_consolidation
