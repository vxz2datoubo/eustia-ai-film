routes:
  - id: CHARACTER_WAITS_FOR_PLOT
    symptoms:
      - 人物像在等剧情
      - 人物一出场才开始做事
      - 所有人反应一致
      - 行为过度理性
    mandatory_scans:
      - CALC
      - CLCS
      - character_knowledge_boundary
    candidate_axes:
      - preexisting_activity
      - interruption_and_resumption
      - personality_specific_response
      - duty_and_relationship_filter

  - id: EXPOSITION_STALL
    symptoms:
      - 持续对白
      - 世界观说明
      - 画外音
      - 节奏停滞
      - 信息很多但画面不推进
    mandatory_scans:
      - narrative_multiplex
      - attention_budget
      - reveal_budget
    candidate_axes:
      - compression
      - embodiment
      - temporal_parallel
      - deliberate_stillness

  - id: SCREEN_EVIDENCE_GAP
    symptoms:
      - 提示词太概念
      - 画面描述太空泛
      - 像小说需要观众脑补
      - 数层高或很高但没有可见高度证据
      - 很快或很危险但没有动作与空间证据
      - AI需要自行猜测画面
      - 抽象形容词承担了关键空间或动作信息
      - 为补救歧义不断堆叠约束
    maturity: candidate
    mandatory_reads:
      - 08_系统学习/反馈反推与系统反哺引擎.md#SCREEN-EVIDENCE-001
    mandatory_scans:
      - observable_screen_evidence
      - visible_frame_outline
      - relative_scale_and_elevation
      - physical_contact_action_chain
      - environment_response
      - modality_role_split
      - prompt_constraint_budget
      - final_state
    candidate_axes:
      - visible_geometry_anchor
      - relative_position_anchor
      - scale_and_height_evidence
      - physical_contact_and_motion
      - environmental_reaction
      - temporal_order_without_forced_timecode
      - minimum_sufficient_constraints
      - final_state_anchor

  - id: NEGATIVE_CONSTRAINT_OVERLOAD
    symptoms:
      - 大量否定词
      - 不飞跃不悬空等绝对动作禁令
      - 禁止项比正向动作描述更强或更长
      - 模型为了满足禁止项改走错误动作路线
      - 出现形式合规但导演意图失败的替代行为
      - 为避免夸张动作而误杀正常的短距离腾跃或自然悬空
      - 负面约束导致动作僵硬保守或退化
    maturity: candidate
    mandatory_reads:
      - 08_系统学习/反馈反推与系统反哺引擎.md#POSITIVE-SPEC-001
    mandatory_scans:
      - positive_target_specification
      - negation_scope
      - hard_vs_soft_constraint
      - feasible_action_space
      - substitute_behavior_risk
      - prompt_constraint_budget
      - platform_negative_prompt_support
      - physical_motion_envelope
    candidate_axes:
      - positive_action_envelope
      - bounded_freedom
      - localized_exclusion
      - hard_invariants_only
      - physical_support_evidence
      - reference_based_control
      - A_B_C_validation

  - id: SPACE_CONTINUITY_RISK
    symptoms:
      - 左右反了
      - 正反打关系不清
      - 桥上桥下混乱
      - 场景拓扑漂移
    mandatory_scans:
      - map_authority
      - camera_orientation
      - asset_direction_tags
      - adjacency_and_height

  - id: ASSET_REGISTRATION
    symptoms:
      - 登记资产
      - 加入资产库
      - 录入资产
      - 设为正式资产
    mandatory_scans:
      - asset_identity
      - source_authority
      - continuity_binding
      - commit_verification
    candidate_axes: []

  - id: MULTI_REVISION_WORK_ITEM
    symptoms:
      - 在上一版基础上继续改
      - 这版更好
      - 这版不对再改
      - 继续修改同一镜头
      - 继续修改同一场景
      - 这一版先用
      - 好了下一镜
      - 换下一个场景
    mandatory_scans:
      - revision_series_identity
      - constraint_ledger
      - accepted_vs_revoked
      - continuity_inheritance
      - checkpoint_need
      - semantic_finalization
      - trajectory_final_delta
    candidate_axes:
      - micro_capture
      - preserve_accepted_constraints
      - checkpoint
      - final_consolidation
