  - WorkItemContext
  - WorldStateIR
  - Beat_EventGraphIR
  - BlockingIR
  - CinematicIntentIR
  - ShotPlanIR
  - VisibleIR
  - PerformanceIR
  - AudibleIR
  - TransitionContract
  - ConstraintAutonomyContract
