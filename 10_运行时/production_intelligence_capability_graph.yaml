routing_pipeline:
  - resolve_current_work_item_when_required
  - classify_problem_signatures
  - classify_epistemic_zones
  - resolve_authority_refs
  - select_primary_capability
  - expand_only_material_dependencies
  - compile_cross_department_handoff_requirements
  - select_representation_layers
  - select_material_eval_dimensions
  - select_experiment_strategy_if_uncertain
  - execute_through_existing_domain_and_model_authorities
  - reverse_observe
  - existing_expected_vs_observed_eval
  - existing_targeted_repair_if_needed
  - existing_learning_and_maturity_route

materiality_gate:
  include_department_when_any:
    - its_decision_can_change_current_pixels_sound_timing_or_required_handoff
    - it_owns_a_hard_invariant_or_dependency
    - its_failure_can_explain_current_problem
    - downstream_tool_requires_its_representation
    - eval_dimension_requires_its_expected_state
  exclude_when:
    - only_thematically_related
    - no_current_execution_consequence
    - duplicate_of_existing_owner
    - future_shot_or_future_department_not_yet_material

confidence_dimensions:
  - user_intent_confidence
  - problem_classification_confidence
  - authority_resolution_confidence
  - external_evidence_confidence
  - causal_hypothesis_confidence
  - transfer_confidence
  - model_version_confidence
  - measurement_confidence

cost_risk_reversibility:
  cost_levels: [LOW, MEDIUM, HIGH]
  risk_levels: [LOW, MEDIUM, HIGH]
  reversibility: [EASY, MODERATE, HARD_OR_CANONICAL]
  rules:
    - high_cost_high_uncertainty_prefers_probe_or_research_before_execution
    - hard_or_canonical_change_uses_existing_human_gate
    - low_risk_deterministic_handoff_may_be_proactive

experiment_strategy_router:
  NONE:
    trigger: uncertainty_is_not_material_or_existing_evidence_is_sufficient
  COMPARATIVE_AB:
    trigger: one_primary_factor_or_one_a_priori_hypothesis
    requirements:
      - preserve_non_test_variables_as_far_as_practical
      - predeclare_material_response_dimensions
  SCREENING:
    trigger: multiple_plausible_factors_and_main_effect_discovery_is_primary_goal
    requirements:
      - do_not_change_many_factors_without_factor_ledger
      - use_small_bounded_design_not_prompt_pileup
  BOUNDED_FACTORIAL:
    trigger: interaction_between_small_number_of_factors_is_plausible_and_material
    requirements:
      - factor_count_must_remain_small
      - interpret_interaction_not_only_main_effect
  SEQUENTIAL_PROBE:
    trigger: expensive_final_model_or_unknown_mechanism_can_be_de_risked_by_cheaper_information_stage
    requirements:
      - proxy_can_only_validate_dimensions_with_transfer_evidence
      - final_model_still_validates_model_specific_and_final_quality_dimensions
  PARAMETER_SEARCH:
    trigger: continuous_control_parameter_and_response_is_observable
    requirements:
      - bounded_range
      - stop_when_gain_is_small_or_quality_tradeoff_worsens
  MEASUREMENT_SYSTEM_CHECK:
    trigger: reviewer_metric_sampling_or_repeat_observation_disagreement_can_change_decision
    requirements:
      - distinguish_repeatability_reproducibility_stability
      - do_not_blame_generator_before_measurement_uncertainty_is_bounded
  EXTERNAL_RESEARCH:
    trigger: official_capability_standard_or_specialist_knowledge_is_missing_and_material
  HUMAN_DECISION:
    trigger: unresolved_high_impact_creative_or_canonical_choice

# Dimension registry is a vocabulary. Existing Expected-vs-Observed remains evaluator authority.
evaluation_dimension_registry:
  STORY_FUNCTION:
    owner: DIRECTOR
    examples: [dramatic_function, audience_knowledge_delta, reveal_function]
  INSTRUCTION_ADHERENCE:
    owner: REVERSE_OBSERVATION_EVAL
  IDENTITY_ENTITY_SEMANTICS:
    owner: ASSET_REFERENCE
    examples: [character_identity, entity_class, wardrobe_or_prop_identity_when_locked]
  COMPOSITION_FRAMING_CAMERA:
    owner: CINEMATOGRAPHY_FRAMING
    examples: [framing, camera_side, camera_height, lens_intent, camera_motion]
  SPATIAL_RELATION_TRAJECTORY:
    owner: BLOCKING_SPATIAL
  ACTION_MOTION_BINDING:
    owner: BLOCKING_SPATIAL
  SUPPORT_CONTACT_TOPOLOGY:
    owner: BLOCKING_SPATIAL
  EVENT_ORDER_CAUSALITY:
    owner: DIRECTOR
  PHYSICAL_PLAUSIBILITY:
    owner: PREVIS_GEOMETRY
  TEMPORAL_STABILITY:
    owner: REVERSE_OBSERVATION_EVAL
  PERFORMANCE_READABILITY:
    owner: PERFORMANCE
  LIGHT_MATERIAL_COLOR:
    owner: LIGHTING_COLOR
  REFERENCE_RESPONSIBILITY:
    owner: ASSET_REFERENCE
  AUDIO_SEMANTICS_QUALITY:
    owner: SOUND
  AUDIO_VIDEO_SYNC:
    owner: SOUND
    examples: [lip_speech, physical_sound_timing, event_sound_sync]
  EDIT_ATTENTION_HANDOFF:
    owner: EDITORIAL
  CROSS_SHOT_CONTINUITY:
    owner: DIRECTOR
  WORLD_STATE_CONTINUITY:
    owner: BLOCKING_SPATIAL
  SHOT_SCOPE_REVEAL_LEAK:
    owner: DIRECTOR
  AESTHETIC_DIRECTOR_FIT:
    owner: DIRECTOR
    rule: never_collapsed_with_technical_dimensions_into_one_score

