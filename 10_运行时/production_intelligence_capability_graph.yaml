source_issue: 59
scope: capability_mapping_epistemic_routing_cross_department_dependencies_eval_dimension_and_experiment_strategy

purpose:
  - map_production_problem_to_required_capabilities_without_copying_domain_rules
  - make_authority_department_inputs_outputs_handoffs_and_eval_dimensions_machine_readable
  - distinguish_explicit_user_tacit_inference_adjacent_expert_knowledge_and_frontier_unknowns
  - expand_only_material_cross_domain_dependencies
  - choose_bounded_experiment_strategy_when_uncertainty_is_material
  - preserve_existing_director_learning_eval_repair_and_canonical_authorities

non_goals:
  - second_director_method
  - second_learning_authority
  - second_asset_or_media_resolver
  - second_targeted_repair_router
  - automatic_aesthetic_scoring
  - full_MovieLabs_OMC_implementation
