    epistemic_zones: [K1_EXPLICIT_USER, K2_TACIT_OR_IMPLICIT, K3_ADJACENT_EXPERT]
    department_owner: PERFORMANCE
    authority_refs: [01_AI电影系统/AI电影系统.md, 04_角色与表演/角色与表演设定库.md]
    representation_layers: [PerformanceIR, VisibleIR]
    evaluation_dimensions: [PERFORMANCE_READABILITY, STORY_FUNCTION]
