  scene: 05_场景与空间/场景与空间设定库.md
  topology: 05_场景与空间/00_项目地图文件.md
  formal_assets: 06_视觉资产/视觉资产登记库.md
  continuity: 07_连续性与生产状态/连续性与当前生产状态.md
  learning: 10_运行时/learning_application_gate.yaml
  execution_ir: 10_运行时/screen_observable_audible_ir_schema.yaml
