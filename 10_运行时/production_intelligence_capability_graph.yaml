    problem_signatures: [scene_purpose_unclear, technique_without_story_reason, audience_knowledge_unclear, reveal_problem, exposition_stall, story_function_fail]
    epistemic_zones: [K1_EXPLICIT_USER, K2_TACIT_OR_IMPLICIT, K3_ADJACENT_EXPERT]
    department_owner: DIRECTOR
    supporting_participants: [SCRIPT_ADAPTATION]
    authority_refs: [01_AI电影系统/AI电影系统.md, 03_剧本与改编/当前改编剧本.md]
    representation_layers: [Beat_EventGraphIR, CinematicIntentIR, ShotPlanIR]
    evaluation_dimensions: [STORY_FUNCTION, SHOT_SCOPE_REVEAL_LEAK]
