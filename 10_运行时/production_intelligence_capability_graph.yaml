handoff_compilation_rules:
  - output_minimum_sufficient_packet_not_full_internal_reasoning
  - preserve_work_item_identity_when_available
  - preserve_hard_invariants_live_constraints_and_reference_identity
  - include_only_material_departments_and_eval_dimensions
  - unresolved_K4_unknowns_must_survive_handoff
  - K2_inference_must_remain_labeled_inference
  - K3_external_rule_must_keep_source_scope_boundary
  - downstream_cannot_treat_packet_as_story_map_asset_authority
  - failed_dimension_routes_to_existing_targeted_repair
  - infrastructure_failure_cannot_be_recorded_as_model_or_director_failure_without_evidence

static_checks:
  ERROR:
    - CAPABILITY_GRAPH_MINTS_CANONICAL_FACT
    - EXTERNAL_RESEARCH_OVERRIDES_PROJECT_AUTHORITY
    - SECOND_NATURAL_LANGUAGE_DIRECTOR_PARSER
    - K2_INFERENCE_MASQUERADES_AS_EXPLICIT_USER_FACT
    - K4_UNKNOWN_MASQUERADES_AS_ACQUIRED_SKILL
    - DUPLICATE_REPAIR_OR_LEARNING_AUTHORITY
    - HANDOFF_WORK_ITEM_IDENTITY_MISMATCH
    - HIGH_IMPACT_CHANGE_BYPASSES_EXISTING_HUMAN_GATE
  WARNING:
    - DEPARTMENT_OVEREXPANSION
    - NON_MATERIAL_EVAL_DIMENSION_SELECTED
    - SINGLE_GLOBAL_VIDEO_SCORE
    - MULTIFACTOR_CHANGE_WITHOUT_FACTOR_LEDGER
    - PROXY_RESULT_TREATED_AS_FINAL_MODEL_RESULT
    - EVALUATOR_DISAGREEMENT_WITHOUT_MEASUREMENT_CHECK
    - VERSION_SENSITIVE_KNOWLEDGE_NOT_REVALIDATED
    - HANDOFF_PACKET_TOO_VERBOSE
    - INFRASTRUCTURE_FAILURE_MISATTRIBUTED_TO_GENERATOR
  INFO:
    - K3_PROFESSIONAL_KNOWLEDGE_AVAILABLE
    - K4_RESEARCH_OR_PROBE_OPPORTUNITY
    - HIGH_INFORMATION_PROBE_AVAILABLE

maturity:
  current: candidate_unvalidated
  promotion_requires:
    - independent_architecture_review
    - no_second_authority_regression_pass
    - at_least_three_distinct_production_pilots
    - evidence_of_reduced_handoff_loss_or_repeated_failure
    - bounded_department_overexpansion_rate
    - no_material_user_control_loss
