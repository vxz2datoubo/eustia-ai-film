    - external_research_is_candidate_evidence_only
    - handoff_packet_is_not_canonical_fact_authority
    - department_participation_does_not_grant_authority
    - sparse_dependency_expansion_required

# These zones describe the relationship between the user/system and a knowledge item.
# They are NOT truth-authority levels.
epistemic_zones:
  K1_EXPLICIT_USER:
    meaning: user_explicitly_stated_goal_preference_requirement_judgment_or_constraint
    default_behavior:
      - preserve_exact_intent_when_material
      - bind_to_current_scope_or_canonical_route_according_to_user_intent
      - do_not_replace_with_external_best_practice
    confidence: user_explicit
    may_become_canonical: only_through_existing_write_route_when_user_intends_persistence

  K2_TACIT_OR_IMPLICIT:
    meaning: repeated_behavior_feedback_or_workflow_implies_a_preference_goal_or_heuristic_not_fully_stated
    default_behavior:
      - record_as_inference_not_user_quote
      - keep_confidence_and_evidence
      - use_as_guided_candidate_when_low_risk_and_context_match_is_high
      - ask_or_AB_test_when_material_and_ambiguous
    cannot_be_silently_promoted_to_explicit_user_fact: true

  K3_ADJACENT_EXPERT:
    meaning: professional_industry_academic_or_tool_knowledge_the_user_did_not_supply_but_can_be_explained_and_applied
    default_behavior:
      - retrieve_high_quality_source
      - state_problem_mechanism_scope_boundary
      - translate_to_project_candidate
      - expose_user_relevant_explanation_when_it_changes_decision
      - test_before_maturity_promotion
    cannot_override_project_canonical: true

  K4_FRONTIER_OR_OPAQUE:
    meaning: evidence_insufficient_capability_unknown_high_complexity_or_model_behavior_not_safely_predictable
    default_behavior:
      - mark_UNKNOWN_or_research_question
      - choose_low_cost_high_information_probe_when_possible
      - escalate_to_specialist_tool_or_external_research_when_material
      - do_not_write_as_acquired_skill
    high_impact_fail_closed: true

participant_roles:
  USER_CREATIVE_AUTHORITY:
    type: human
    owns: [explicit_current_intent, final_high_impact_creative_choice]
  DIRECTOR:
    type: creative_department
    owns: [dramatic_function, audience_cognition, director_intent, cross_department_creative_coherence]
  SCRIPT_ADAPTATION:
    type: creative_department
    owns: [scene_information_dialogue_adaptation_story_structure_within_confirmed_scope]
  PERFORMANCE:
    type: creative_department
    owns: [playable_action_subtext_behavioral_evidence]
  BLOCKING_SPATIAL:
    type: creative_department
    owns: [positions_orientations_paths_contacts_scene_action_geometry]
  CINEMATOGRAPHY_FRAMING:
    type: creative_department
    owns: [camera_position_orientation_lens_framing_movement_exposure_intent]
  LIGHTING_COLOR:
    type: creative_department
    owns: [motivated_light_color_sources_exposure_continuity_color_intent]
  PRODUCTION_DESIGN_SCENE:
    type: creative_department
    owns: [scene_local_material_prop_visual_affordance]
  EDITORIAL:
    type: creative_department
    owns: [cut_structure_timing_transition_attention_handoff_timeline]
  SOUND:
    type: creative_department
