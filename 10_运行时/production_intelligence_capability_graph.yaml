    epistemic_zones: [K3_ADJACENT_EXPERT, K4_FRONTIER_OR_OPAQUE]
    department_owner: TARGETED_REPAIR
    authority_refs: [10_运行时/targeted_repair_policy.yaml]
    representation_layers: [TargetedRepairHandoff]
    rule: must_call_existing_repair_authority_not_duplicate_it
    handoff_to: [capability_owner_for_failed_dimension, CAP-LEARNING]
    maturity: existing_authority_bridge

  - capability_id: CAP-LEARNING
    problem_signatures: [feedback, final_delta, repeated_failure, successful_controlled_change, conflict, revalidation]
    epistemic_zones: [K1_EXPLICIT_USER, K2_TACIT_OR_IMPLICIT, K3_ADJACENT_EXPERT, K4_FRONTIER_OR_OPAQUE]
    department_owner: LEARNING_MATURITY
    authority_refs: [10_运行时/learning_application_gate.yaml, 10_运行时/maturity_model.yaml, 08_系统学习/反馈反推与系统反哺引擎.md]
    representation_layers: [LearningEvidence]
    evaluation_dimensions: []
    rule: capability_graph_never_promotes_maturity
    maturity: existing_authority_bridge

  - capability_id: CAP-EXPERIMENT-DESIGN
    problem_signatures: [causal_uncertainty, multiple_plausible_factors, interaction_suspected, expensive_generation, evaluator_disagreement]
    epistemic_zones: [K3_ADJACENT_EXPERT, K4_FRONTIER_OR_OPAQUE]
    department_owner: REVERSE_OBSERVATION_EVAL
    supporting_participants: [PRODUCTION_MANAGEMENT, LEARNING_MATURITY]
    authority_refs: [10_运行时/learning_application_gate.yaml]
    evidence_refs:
      - 09_资料证据/AI电影生产智能能力图谱与协同证据.md#E-PICG-NIST-DOE-001
      - 09_资料证据/AI电影生产智能能力图谱与协同证据.md#E-PICG-NIST-GRR-001
    representation_layers: [ProductionHandoffPacket, ReverseObservation, LearningEvidence]
    evaluation_dimensions: experiment_specific
    experiment_strategy: selected_by_experiment_strategy_router
    maturity: candidate_research_supported

  - capability_id: CAP-PROACTIVE-COLLABORATION
    problem_signatures: [clear_next_step, repeated_manual_friction, low_cost_probe_opportunity, context_relevant_professional_gap]
    epistemic_zones: [K2_TACIT_OR_IMPLICIT, K3_ADJACENT_EXPERT, K4_FRONTIER_OR_OPAQUE]
    department_owner: PRODUCTION_MANAGEMENT
    authority_refs: [10_运行时/proactive_execution_opportunity_router.yaml]
    evidence_refs: [09_资料证据/AI电影生产智能能力图谱与协同证据.md#E-PICG-HUMAN-AI-001]
    rule: extend_existing_proactive_router_do_not_create_second_intervention_authority
    maturity: candidate_bridge

  - capability_id: CAP-UNKNOWN-RESEARCH
    problem_signatures: [material_unknown, external_capability_uncertain, frontier_specialist_question, contradictory_evidence]
    epistemic_zones: [K4_FRONTIER_OR_OPAQUE]
    department_owner: LEARNING_MATURITY
    authority_refs: [12_未知项/UNKNOWN_REGISTRY.yaml, 09_资料证据/官方资料与证据索引.md]
    representation_layers: [LearningEvidence]
    default_experiment: EXTERNAL_RESEARCH
    rule: unknown_cannot_be_relabelled_as_skill_until_evidence_and_validation_exist
    maturity: existing_unknown_bridge

handoff_compilation_rules:
  - output_minimum_sufficient_packet_not_full_internal_reasoning
  - preserve_work_item_identity_when_available
  - preserve_hard_invariants_live_constraints_and_reference_identity
  - include_only_material_departments_and_eval_dimensions
  - unresolved_K4_unknowns_must_survive_handoff
  - K2_inference_must_remain_labeled_inference
  - K3_external_rule_must_keep_source_scope_boundary
  - downstream_cannot_treat_packet_as_story_map_asset_authority
  - failed_dimension_routes_to_existing_targeted_repair

static_checks:
  ERROR:
    - CAPABILITY_GRAPH_MINTS_CANONICAL_FACT
    - EXTERNAL_RESEARCH_OVERRIDES_PROJECT_AUTHORITY
    - K2_INFERENCE_MASQUERADES_AS_EXPLICIT_USER_FACT
    - K4_UNKNOWN_MASQUERADES_AS_ACQUIRED_SKILL
    - DUPLICATE_REPAIR_OR_LEARNING_AUTHORITY
    - HANDOFF_WORK_ITEM_IDENTITY_MISMATCH
    - HIGH_IMPACT_CHANGE_BYPASSES_EXISTING_HUMAN_GATE
  WARNING:
    - DEPARTMENT_OVEREXPANSION
    - NON_MATERIAL_EVAL_DIMENSION_SELECTED
    - SINGLE_GLOBAL_VIDEO_SCORE
    - MULTIFACTOR_CHANGE_WITHOUT_FACTOR_LEDGER
    - PROXY_RESULT_TREATED_AS_FINAL_MODEL_RESULT
    - EVALUATOR_DISAGREEMENT_WITHOUT_MEASUREMENT_CHECK
    - VERSION_SENSITIVE_KNOWLEDGE_NOT_REVALIDATED
    - HANDOFF_PACKET_TOO_VERBOSE
  INFO:
    - K3_PROFESSIONAL_KNOWLEDGE_AVAILABLE
    - K4_RESEARCH_OR_PROBE_OPPORTUNITY
    - LOW_COST_SEQUENTIAL_PROBE_AVAILABLE

maturity:
  current: candidate_unvalidated
  promotion_requires:
    - independent_architecture_review
    - no_second_authority_regression_pass
    - at_least_three_distinct_production_pilots
    - evidence_of_reduced_handoff_loss_or_repeated_failure
    - bounded_department_overexpansion_rate
    - no_material_user_control_loss
