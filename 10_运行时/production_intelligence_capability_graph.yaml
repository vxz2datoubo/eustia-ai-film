schema_version: "0.2.0"
graph_id: EUSTIA_PRODUCTION_INTELLIGENCE_CAPABILITY_GRAPH
status: candidate_unvalidated
source_issue: 59
scope: capability_mapping_epistemic_routing_cross_department_dependencies_eval_dimension_and_experiment_strategy

purpose:
  - map_structured_production_problem_signals_to_existing_capabilities_without_copying_domain_rules
  - make_authority_department_inputs_outputs_handoffs_and_eval_dimensions_machine_readable
  - distinguish_explicit_user_tacit_inference_adjacent_expert_knowledge_and_frontier_unknowns
  - expand_only_material_cross_domain_dependencies
  - choose_bounded_experiment_strategy_when_uncertainty_is_material
  - separate_creative_model_evaluation_infrastructure_and_process_failures
  - preserve_existing_director_learning_eval_repair_and_canonical_authorities

non_goals:
  - second_director_method
  - second_natural_language_director_parser
  - second_learning_authority
  - second_asset_or_media_resolver
  - second_targeted_repair_router
  - automatic_aesthetic_scoring
  - full_MovieLabs_OMC_implementation
  - full_OpenUSD_OTIO_OpenAssetIO_implementation
  - automatic_expensive_generation
  - automatic_high_impact_canonical_change

authority_boundary:
  project_registry: PROJECT_INDEX.yaml
  director_method: 01_AI电影系统/AI电影系统.md
  sound_method: 01_AI电影系统/声音导演系统.md
  story: 03_剧本与改编/当前改编剧本.md
  character: 04_角色与表演/角色与表演设定库.md
  scene: 05_场景与空间/场景与空间设定库.md
  topology: 05_场景与空间/00_项目地图文件.md
  formal_assets: 06_视觉资产/视觉资产登记库.md
  continuity: 07_连续性与生产状态/连续性与当前生产状态.md
  natural_language_features: 10_运行时/director_feature_compiler.yaml
  hard_routes: 10_运行时/director_route_index.yaml
  learning: 10_运行时/learning_application_gate.yaml
  execution_ir: 10_运行时/screen_observable_audible_ir_schema.yaml
  expected_observed_eval: existing_expected_observed_runtime
  repair: 10_运行时/targeted_repair_policy.yaml
  maturity: 10_运行时/maturity_model.yaml
  proactive_next_step: 10_运行时/proactive_execution_opportunity_router.yaml
  epistemic_cycle_policy: 10_运行时/production_intelligence_epistemic_cycle_policy.yaml
  evidence:
    - 09_资料证据/AI电影生产智能能力图谱与协同证据.md
    - 09_资料证据/AI电影生产认知与迭代优化证据.md
  rules:
    - graph_routes_and_explains_but_does_not_mint_domain_truth
    - graph_cannot_change_story_character_scene_map_asset_or_continuity
    - graph_cannot_promote_learning_maturity
    - external_research_is_candidate_evidence_only
    - handoff_packet_is_not_canonical_fact_authority
    - department_participation_does_not_grant_authority
    - sparse_dependency_expansion_required

upstream_signal_contract:
  free_text_director_parsing_owned_here: false
  structured_signal_sources:
    - CURRENT_USER_K1_CONSTRAINT_OR_FEEDBACK
    - WorkItemContext
    - DirectorFeatureCompiler_receipt
    - director_route_index_hard_routes
    - SOAC_static_checks
    - CinematicIntent_static_checks
    - ExpectedVsObserved_failed_or_unknown_dimensions
    - TargetedRepair_handoff
    - asset_reference_resolution_receipt
    - model_adapter_or_generation_receipt
    - infrastructure_runtime_status
    - revision_and_learning_evidence
  rules:
    - free_text_director_intent_must_pass_existing_Director_Feature_Compiler_before_learning_or_capability_routing_when_that_runtime_requires_it
    - capability_graph_may_receive_user_explicit_K1_constraints_without_reinterpreting_them_as_director_features
    - exact_signal_vocabulary_is_coordination_metadata_not_a_second_semantic_parser
    - unknown_structured_signal_may_remain_unmatched_and_route_to_K4_or_existing_unknown_process
    - hard_route_authority_remains_director_route_index

# Epistemic relationship is orthogonal to knowledge abstraction and validation maturity.
epistemic_zones:
  K1_EXPLICIT_USER:
    meaning: user_explicitly_stated_goal_preference_requirement_judgment_or_constraint
    default_behavior: [preserve_exact_intent_when_material, do_not_replace_with_external_best_practice]
    may_become_canonical: only_through_existing_write_route_when_user_intends_persistence
  K2_TACIT_OR_IMPLICIT:
    meaning: repeated_behavior_feedback_or_workflow_implies_a_preference_goal_or_heuristic_not_fully_stated
    default_behavior: [record_as_inference_not_user_quote, keep_confidence_and_evidence, verify_when_material]
    cannot_be_silently_promoted_to_explicit_user_fact: true
  K3_ADJACENT_EXPERT:
    meaning: professional_industry_academic_or_tool_knowledge_the_user_did_not_supply_but_can_be_explained_and_applied
    default_behavior: [retrieve_high_quality_source, state_problem_mechanism_scope_boundary, translate_to_project_candidate, test_before_maturity_promotion]
    cannot_override_project_canonical: true
  K4_FRONTIER_OR_OPAQUE:
    meaning: evidence_insufficient_capability_unknown_high_complexity_or_model_behavior_not_safely_predictable
    default_behavior: [mark_UNKNOWN_or_research_question, choose_high_information_probe_when_possible, do_not_write_as_acquired_skill]
    high_impact_fail_closed: true

participant_roles:
  USER_CREATIVE_AUTHORITY: {type: human, owns: [explicit_current_intent, final_high_impact_creative_choice]}
  DIRECTOR: {type: creative_department, owns: [dramatic_function, audience_cognition, director_intent, cross_department_creative_coherence]}
  SCRIPT_ADAPTATION: {type: creative_department, owns: [scene_information, dialogue_adaptation, story_structure_within_confirmed_scope]}
  PERFORMANCE: {type: creative_department, owns: [playable_action, subtext, behavioral_evidence]}
  BLOCKING_SPATIAL: {type: creative_department, owns: [positions, orientations, paths, contacts, scene_action_geometry]}
  CINEMATOGRAPHY_FRAMING: {type: creative_department, owns: [camera_position, orientation, lens, framing, movement, exposure_intent]}
  LIGHTING_COLOR: {type: creative_department, owns: [motivated_light, color_sources, exposure_continuity, color_intent]}
  PRODUCTION_DESIGN_SCENE: {type: creative_department, owns: [scene_local_material_prop_visual_affordance]}
  EDITORIAL: {type: creative_department, owns: [cut_structure, timing, transition, attention_handoff, timeline]}
  SOUND: {type: creative_department, owns: [dialogue, sound, foley, ambience, music, mix_intent]}
  ASSET_REFERENCE: {type: production_department, owns: [asset_identity_reference_role_version_locator_provenance_with_existing_authorities]}
  PREVIS_GEOMETRY: {type: production_department, owns: [white_model_geometry_trajectory_camera_previsualization_only]}
  MODEL_ADAPTER: {type: technical_department, owns: [capability_bound_prompt_or_reference_compilation_for_selected_model]}
  GENERATION_SERVICE: {type: ai_service, owns: [execution_only]}
  REVERSE_OBSERVATION_EVAL: {type: evaluation_department, owns: [observed_output_evidence_dimension_results]}
  TARGETED_REPAIR: {type: repair_department, owns: [existing_failed_dimension_routing_only]}
  LEARNING_MATURITY: {type: learning_department, owns: [existing_learning_capture_conflict_maturity_regression]}
  PRODUCTION_MANAGEMENT: {type: production_department, owns: [cost_latency_schedule_iteration_task_state_resource_tradeoff]}
  INFRASTRUCTURE_TOOLING: {type: technical_department, owns: [runtime_connectivity_auth_transport_CI_tool_availability_status]}

relationship_types: [DEPENDS_ON, CONSUMES, PRODUCES, INFORMS, HANDOFF_TO, CONSTRAINS, VALIDATES, REPAIRS, SUPPORTS, REFINES, BOUNDS, SUPERSEDES, REVALIDATES]

representation_layers:
  - CanonicalFacts
  - WorkItemContext
  - WorldStateIR
  - Beat_EventGraphIR
  - BlockingIR
  - CinematicIntentIR
  - ShotPlanIR
  - VisibleIR
  - PerformanceIR
  - AudibleIR
  - TransitionContract
  - ConstraintAutonomyContract
  - ReferenceResponsibility
  - ProductionHandoffPacket
  - ModelAdapterExecution
  - ReverseObservation
  - ExpectedVsObserved
  - TargetedRepairHandoff
  - LearningEvidence
  - InfrastructureStatusReceipt

routing_pipeline:
  - resolve_current_work_item_when_required
  - consume_existing_structured_signals
  - classify_epistemic_zones
  - resolve_authority_refs
  - select_primary_capabilities
  - expand_only_material_dependencies
  - compile_cross_department_handoff_requirements
  - select_representation_layers
  - select_material_eval_dimensions
  - select_experiment_strategy_if_uncertain
  - execute_through_existing_domain_and_model_authorities
  - reverse_observe
  - existing_expected_vs_observed_eval
  - existing_targeted_repair_if_needed
  - existing_learning_and_maturity_route

materiality_gate:
  include_department_when_any:
    - its_decision_can_change_current_pixels_sound_timing_or_required_handoff
    - it_owns_a_hard_invariant_or_dependency
    - its_failure_can_explain_current_problem
    - downstream_tool_requires_its_representation
    - eval_dimension_requires_its_expected_state
  exclude_when:
    - only_thematically_related
    - no_current_execution_consequence
    - duplicate_of_existing_owner
    - future_shot_or_future_department_not_yet_material

confidence_dimensions: [user_intent_confidence, problem_classification_confidence, authority_resolution_confidence, external_evidence_confidence, causal_hypothesis_confidence, transfer_confidence, model_version_confidence, measurement_confidence]

cost_risk_reversibility:
  cost_levels: [LOW, MEDIUM, HIGH]
  risk_levels: [LOW, MEDIUM, HIGH]
  reversibility: [EASY, MODERATE, HARD_OR_CANONICAL]
  rules:
    - high_cost_high_uncertainty_prefers_high_information_probe_or_research_before_execution
    - hard_or_canonical_change_uses_existing_human_gate
    - low_risk_deterministic_handoff_may_be_proactive

experiment_strategy_router:
  NONE: {trigger: uncertainty_is_not_material_or_existing_evidence_is_sufficient}
  COMPARATIVE_AB:
    trigger: one_primary_factor_or_one_a_priori_hypothesis
    requirements: [preserve_non_test_variables_as_far_as_practical, predeclare_material_response_dimensions]
  SCREENING:
    trigger: multiple_plausible_factors_and_main_effect_discovery_is_primary_goal
    requirements: [do_not_change_many_factors_without_factor_ledger, use_small_bounded_design_not_prompt_pileup]
  BOUNDED_FACTORIAL:
    trigger: interaction_between_small_number_of_factors_is_plausible_and_material
    requirements: [factor_count_must_remain_small, interpret_interaction_not_only_main_effect]
  SEQUENTIAL_PROBE:
    trigger: expensive_final_model_or_unknown_mechanism_can_be_de_risked_by_cheaper_information_stage
    requirements: [proxy_can_only_validate_dimensions_with_transfer_evidence, final_model_still_validates_model_specific_and_final_quality_dimensions]
  PARAMETER_SEARCH:
    trigger: continuous_control_parameter_and_response_is_observable
    requirements: [bounded_range, stop_when_gain_is_small_or_quality_tradeoff_worsens]
  MEASUREMENT_SYSTEM_CHECK:
    trigger: reviewer_metric_sampling_or_repeat_observation_disagreement_can_change_decision
    requirements: [distinguish_repeatability_reproducibility_stability, do_not_blame_generator_before_measurement_uncertainty_is_bounded]
  EXTERNAL_RESEARCH: {trigger: official_capability_standard_or_specialist_knowledge_is_missing_and_material}
  HUMAN_DECISION: {trigger: unresolved_high_impact_creative_or_canonical_choice}

# Vocabulary only. Existing Expected-vs-Observed remains evaluator authority.
evaluation_dimension_registry:
  STORY_FUNCTION: {owner: DIRECTOR, examples: [dramatic_function, audience_knowledge_delta, reveal_function]}
  INSTRUCTION_ADHERENCE: {owner: REVERSE_OBSERVATION_EVAL}
  IDENTITY_ENTITY_SEMANTICS: {owner: ASSET_REFERENCE}
  COMPOSITION_FRAMING_CAMERA: {owner: CINEMATOGRAPHY_FRAMING}
  SPATIAL_RELATION_TRAJECTORY: {owner: BLOCKING_SPATIAL}
  ACTION_MOTION_BINDING: {owner: BLOCKING_SPATIAL}
  SUPPORT_CONTACT_TOPOLOGY: {owner: BLOCKING_SPATIAL}
  EVENT_ORDER_CAUSALITY: {owner: DIRECTOR}
  PHYSICAL_PLAUSIBILITY: {owner: PREVIS_GEOMETRY}
  TEMPORAL_STABILITY: {owner: REVERSE_OBSERVATION_EVAL}
  PERFORMANCE_READABILITY: {owner: PERFORMANCE}
  LIGHT_MATERIAL_COLOR: {owner: LIGHTING_COLOR}
  REFERENCE_RESPONSIBILITY: {owner: ASSET_REFERENCE}
  AUDIO_SEMANTICS_QUALITY: {owner: SOUND}
  AUDIO_VIDEO_SYNC: {owner: SOUND, examples: [lip_speech, physical_sound_timing, event_sound_sync]}
  EDIT_ATTENTION_HANDOFF: {owner: EDITORIAL}
  CROSS_SHOT_CONTINUITY: {owner: DIRECTOR}
  WORLD_STATE_CONTINUITY: {owner: BLOCKING_SPATIAL}
  SHOT_SCOPE_REVEAL_LEAK: {owner: DIRECTOR}
  AESTHETIC_DIRECTOR_FIT: {owner: DIRECTOR, rule: never_collapsed_with_technical_dimensions_into_one_score}

capability_nodes:
