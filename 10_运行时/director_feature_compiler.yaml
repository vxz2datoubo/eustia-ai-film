schema_version: "1.2"
component: DIRECTOR_FEATURE_COMPILER_V1_1
status: active
purpose: >-
  Convert bounded natural-language director intent into structured retrieval
  features before the existing Learning Smart Recall retriever, without changing
  retriever authority or creating a second learning knowledge base. Cinematic
  visual-grammar language is normalized into the same four existing feature
  families rather than creating a parallel aesthetic feature authority.

authority:
  project_registry: PROJECT_INDEX.yaml
  retriever_authority_unchanged: true
  learning_authority: 10_运行时/learning_application_gate.yaml
  route_authority: 10_运行时/director_route_index.yaml
  recall_router_metadata: 10_运行时/learning_recall_index.yaml
  semantic_ir: 10_运行时/screen_observable_audible_ir_schema.yaml
  director_method: 01_AI电影系统/AI电影系统.md#SOAC-001
  cinematic_visual_method: 01_AI电影系统/AI电影系统.md#CINEMATIC-VISUAL-GRAMMAR-001
  knowledge_base_duplication: forbidden
  compiler_output_is_retrieval_query_only: true
  fail_closed: true

runtime_binding:
  canonical_entrypoint: tools/learning_retriever/learning_retriever/runtime.py#DirectorLearningRuntime.retrieve
  route_resolver: tools/learning_retriever/learning_retriever/route_resolver.py#resolve_hard_routes
  natural_language_flow:
    - director_feature_compiler
    - hard_route_from_director_route_index
    - semantic_recall_from_learning_recall_index
  natural_language_bypass_forbidden: true
  route_definition_duplication_in_compiler: forbidden
  structured_feature_only_retrieval_compatibility: preserved

input:
  type: director_task_description
  structured_task_merge_allowed: true
  explicit_structured_features_are_preserved: true

output:
  dramatic_function:
    required_key: true
    semantic_sources:
      - ShotPlanIR.dramatic_function
      - EventGraphIR.narrative_function
      - CinematicIntentIR.unresolved_state
      - CinematicIntentIR.attention_flow
      - CinematicIntentIR.color_intent
      - CinematicIntentIR.visual_density
  relation_type:
    required_key: true
    semantic_sources:
      - EventGraphIR.agent_action_target
      - BlockingIR.relative_positions
      - BlockingIR.orientations
      - CinematicIntentIR.relation_pressure
      - CinematicIntentIR.viewer_position
      - CinematicIntentIR.reference_signal_roles
      - CinematicIntentIR.attention_handoff
  spatial_action_features:
    required_key: true
    semantic_sources:
      - BlockingIR.movement_paths
      - BlockingIR.approach_or_retreat
      - BlockingIR.occlusion
      - BlockingIR.final_positions
      - VisibleIR.relative_position
      - VisibleIR.body_orientation
      - VisibleIR.gaze_target
      - VisibleIR.support_or_contact
      - CinematicIntentIR.attention_flow
      - CinematicIntentIR.composition
      - CinematicIntentIR.capture_intent
      - CinematicIntentIR.reference_signal_roles
  failure_mechanism:
    required_key: true
    semantic_sources:
      - EventGraphIR.precondition_temporal_relation_state_change_result
      - VisibleIR.expected_vs_observed_binding
      - CinematicIntentIR.expected_vs_observed_visual_intent
      - existing_learning_recall_signature_vocabulary

cinematic_visual_vocabulary:
  authority_boundary: retrieval_normalization_only
  failure_mechanisms:
    - generic_cinematic_style_stacking
    - composition_without_pressure
    - attention_flow_break
    - color_as_filter
    - visual_density_overload
    - reference_appearance_contamination
    - template_composition_repetition
    - unmotivated_capture_style
  dramatic_functions:
    - cinematic_visual_design
    - attention_design
    - look_design
    - visual_hierarchy
    - reference_control
    - shot_variation
  relation_types:
    - viewer_to_screen_information
    - relation_pressure
    - reference_to_generation
  spatial_action_features:
    - attention_path
    - motivated_composition
    - motivated_light_color
    - detail_hierarchy
    - reference_responsibility_split
    - capture_substrate
  guardrails:
    - style_word_alone_cannot_create_failure_mechanism
    - film_stock_or_lens_name_alone_cannot_create_unmotivated_capture_failure
    - reference_word_alone_cannot_create_reference_contamination_failure
    - negative_or_problem_evidence_is_required_for_failure_tokens
    - compiler_does_not_choose_camera_color_or_style_solution
    - compiler_does_not_define_skill_maturity_or_payload

resolution_rule:
  mechanism_first: true
  wording_is_not_identity: true
  character_and_scene_are_context_only: true
  relational_evidence_required_for_target_or_causal_relation: true
  surface_noun_or_verb_alone_cannot_create_causal_mechanism: true
  literal_objective_word_is_not_spatial_target_without_spatial_action: true
  camera_orientation_is_not_character_facing_relation: true
  untargeted_escape_does_not_create_locatable_escape_source: true
  bounded_natural_language_synonym_normalization: true
  adjacent_event_target_carry:
    allowed: true
    requires:
      - prior_event_has_explicit_target
      - same_agent_or_group_is_preserved
      - complete_inter_event_clause_chain_has_no_unproven_agent_transition
      - temporal_or_causal_link_is_explicit
      - no_competing_target
      - no_alternate_physical_cause_for_the_second_action
    fail_closed_when_ambiguous: true
  compiler_may_not_emit_learning_payload: true
  compiler_may_not_define_hard_route_ids: true
  compiler_may_not_change_scope_maturity_conflict_or_authority: true

fail_closed:
  conditions:
    - empty_director_task
    - no_recognized_director_feature
    - director_route_index_unavailable_for_natural_language_retrieval
  error_codes:
    - EMPTY_DIRECTOR_TASK
    - NO_RECOGNIZED_DIRECTOR_FEATURES
    - DIRECTOR_ROUTE_INDEX_REQUIRED
  downstream_rule: compiler_or_route_resolution_failure_must_not_enter_learning_retrieval_or_prompt_compilation

provenance:
  receipt_required_for_natural_language_compilation: true
  receipt_fields:
    - component
    - status
    - input_fingerprint
    - compiled_feature_keys
    - matched_rules
    - semantic_trace
    - route_resolution
    - hard_routes
    - authority_boundary
  raw_director_description_persistence_required: false

regression_authority: 11_验收/director_feature_compiler_regression_cases.yaml
