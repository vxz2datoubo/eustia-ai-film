candidate_locked_constraint_semantics:
  scarf_clothesline_geometry: 围巾与固定粗晾衣绳的承重接触关系保持为围巾搭过固定线，不把固定晾衣绳改成随凯姆移动的绳索或交换二者角色。
  scarf_midpoint_single_drape_over_fixed_thick_line: 围巾只以中点单次搭过一根固定粗晾衣绳，不改成多圈缠绕、多支点或整条绳索替代。
  scarf_ends_separate_and_one_end_per_hand: 围巾两端保持分离，凯姆左右手各握一端。
  kaim_body_and_hands_remain_below_fixed_line: 横移期间凯姆身体与双手保持在固定晾衣绳下方。
  scarf_and_kaim_co_translate_while_clothesline_stays_fixed: 凯姆与围巾共同从右向左横移，固定晾衣绳保持世界位置不平移。
  screen_right_to_screen_left_side_on_traverse: 主横移动作保持侧面关系可读，并以画面右侧到画面左侧为运动方向。
  no_open_sky_prison_city_enclosure: 当前监牢城市空间保持封闭围困感，不生成改变世界空间属性的大面积自由开放天空。
  disappearance_reveal_return_to_same_master_with_kaim_already_absent: 凯姆在 reaction cutaway 遮蔽期间离开，回到同一 master 时凯姆已经不在画面中。

