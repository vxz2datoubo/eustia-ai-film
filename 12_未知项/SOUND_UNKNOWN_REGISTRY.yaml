unknowns:
  - id: U-SUNO-USER-SONG-SOURCE-001
    question: 用户此前提到的偏歌曲类 SUNO 提示词表在当前 File Library 中的精确文件与完整内容是什么
    impact: 当前已稳定找到电影配乐向旧补丁，但本轮按 SUNO、歌曲、歌词、verse、chorus、style 等多组查询仍未定位到独立歌曲词表，因此无法声称已完整迁移用户原表中的歌曲术语与权重。
    evidence:
      file_library_search_date: 2026-08-13
      found_score_source: 00_项目长期外部记忆与系统演化总文档_v1.0.35_更新补丁.md
      song_specific_source_found: false
    safe_default: 歌曲分支先使用用户当前明确需求加 Berklee 歌曲写作专业知识与 Suno 当前官方功能建立完整框架；若后续定位到用户原歌曲表，按来源对照做差异合并，不静默覆盖当前规则。
    next_action: 后续 File Library 检索命中疑似歌曲词表时先 mclick 全文，再做 terminology mapping / duplicate / conflict / missing coverage audit。
    status: open

  - id: U-SUNO-API-001
    question: Suno 官方 Platform API 的完整 endpoint schema、认证方式、异步任务合同、配额、速率限制、模型参数和商用条款是什么
    impact: 官方页面已确认存在 REST API，但当前公开抓取只能看到登录入口，无法安全实现自动提交、轮询、下载和回写。
    evidence:
      official_platform: https://platform.suno.com/auth/login
      public_claim: Make music with the Suno API
      full_public_docs_retrieved: false
    safe_default: 不猜测 API schema，不使用逆向私有端点或第三方兼容接口冒充官方；当前声音导演只生成可人工粘贴或 UI 执行的 Suno 任务合同。
    next_action: 取得官方开发文档或用户已登录后的官方文档快照后，单独建立 API capability matrix 与安全自动化 eval。
    status: open

  - id: U-SUNO-V55-CONTROL-001
    question: v5.5 对 Style 文本、Exclude、Weirdness、Style Influence、Audio Influence、段落标签、时长和精确结构的实际可控性曲线是什么
    impact: 官方确认这些控制存在，但没有公开提供可直接转成项目固定数值的可靠响应函数；不同任务可能存在交互效应。
    safe_default: 所有最优数值从 candidate 开始，固定模型版本与其他变量做 A/B/C；不把单次成功百分比写成全局默认。
    next_action: 针对歌曲、低显著度 underscore、角色主题、画内音乐分别建立最小测试集。
    status: open

  - id: U-SUNO-STEM-QUALITY-001
    question: 当前 Advanced Stem Separation 在本项目常见中世纪/管弦/混合配器上的真实串音、伪影、错标与重混可用率如何
    impact: stems 是对白让位和 picture conform 的关键控制资产，但官方明确自动识别并非总是正确。
    safe_default: stem 只作为后期候选控制层，每次实际听检；正式成片不因“成功导出 stem”自动通过 QC。
    next_action: 用至少三类配器建立 stem audit：稀疏室内乐、密集管弦、混合电子/打击。
    status: open

  - id: U-SUNO-SOUNDS-001
    question: Suno Sounds beta 对 Foley、环境声、one-shot、loop 的物理真实性、loop seam 与重复生成稳定性是否达到正式影视资产门槛
    impact: 若稳定，可补充声音资产生产；若不稳定，错误声源或空间会直接破坏画面可信度。
    safe_default: 只作为 candidate 生成器，必须按 source/material/force/space/transient/decay/sync 验收。
    next_action: 选择门锁、布料、脚步/石地、远处人群 ambience 等不同类型做控制实验。
    status: open

  - id: U-AUDIO-ASSET-REGISTRY-001
    question: 项目是否需要独立正式音频资产登记库，还是把音乐/声音资产扩展进现有视觉资产事务之外的统一媒体资产系统
    impact: 当前 GitHub canonical 有视觉资产登记库，但声音导演会逐步产生正式 Cue、歌曲、主题、Voice、stem、Foley 与 ambience，需要稳定的 Asset ID、权利状态、使用位置和版本指针。
    safe_default: 本轮先使用 Music Tracker/Cue Matrix 作为生产追踪，不擅自把音频写入视觉资产登记库，也不建立与现有资产权威冲突的正式音频资产主库。
    next_action: 当用户首次明确“把某首歌/配乐/音频设为正式资产”时，提出最小必要资产架构确认，并按 ART 事务建立唯一权威路径。
    status: open

  - id: U-AUDIO-DELIVERY-LOUDNESS-001
    question: 项目最终各发行渠道的 loudness / true-peak / channel layout 交付标准分别是什么
    impact: 影院、流媒体、广播、社媒等目标不同，不能用单一 LUFS 目标覆盖所有成片。
    safe_default: 使用 ITU-R BS.1770-5 作为测量算法基础；正式交付前读取目标平台当前技术规范再设目标。
    next_action: 当发布平台确定后做 delivery-profile research，并建立平台版本化 QC preset。
    status: open
