  - id: U-ASSET-RETRIEVAL-001
    question: GitHub 视觉资产登记库中的正式 Asset / Media Version 能否在当前 ChatGPT Library / Project 检索接口中稳定反解为对应正式媒体本体
    impact: Source Authority 与资产身份可以正确路由，但在部分会话中原生 Library / Project 检索可能只命中资产表或相关候选，无法稳定打开目标正式像素，因此会影响基于正式图像像素的精确视觉分析与生成参考绑定。
    evidence:
      - 2026-08-11 对钟楼正面、左右侧视图和桥南立面使用正式 File ID 检索时，只稳定命中资产总表与相关历史图片，未能直接打开对应正式图片卡；不得把语义相近候选图冒充正式资产。
      - "PR #8 的独立结构审查确认 identity/version/locator/binary/pixels/reference-bound 必须分层，历史登记证据不得 false-green 新会话。"
      - "PR #9 的外部存储 PoC 虽证明 Cloudflare KV → GitHub Actions artifact → ChatGPT 的合成链可工作，但正式3-Version预检仍因原始正式字节在当前原生接口不可得而要求用户重新提供文件；该路线已由用户在2026-08-22明确停止，保留为历史实验而非生产 fallback。"
    safe_default: 服从 asset_retrieval_policy。先由 GitHub canonical 解析 Asset / Media Version，再只通过当前可用的 ChatGPT Library / Project / 当前会话 native locator 尝试取得目标媒体；若身份和版本已找到但正式像素当前不可得，报告 ASSET_FOUND_PIXELS_UNAVAILABLE，并明确“未实际看到正式像素”。不得自动绕到 GitHub binary、Cloudflare KV、R2、external_uri，也不得用语义相近候选图替代。需要像素级生成或编辑时，可让用户仅重新附上目标正式图本体，不要求重新解释资产身份或场景。
    next_action: 在真实生产自然出现时，用 2–3 个已登记正式资产验证 Asset ID → current Media Version → native locator → exact media open 的最短闭环，并记录当前工具面的成功/失败证据。若原生失败只是会话或搜索偶发，保持本 Unknown；只有出现真实、可复现、生产级硬缺口且无更短原生方案时，才按 asset_retrieval_policy 的 external_storage_hard_gap_gate 重新评估外部方案。
    superseded_path: GitHub可访问缩略图/派生预览、Cloudflare KV、R2 或其他外部对象存储不再是本 Unknown 的默认 remediation / fallback / upgrade path。
    status: open_native_capability_observation

  - id: U-SEEDANCE-NEGATION-001
    question: Seedance 2.5 对主提示文本中的自然语言否定、否定作用域、绝对否定强度以及是否存在独立 negative-prompt 控制通道的官方精确定义是什么
    impact: 当前已观察到强否定词可在凯姆攀爬场景诱发“字面合规但导演意图失败”的替代动作；若未来模型版本或官方接口提供专门负向控制，最佳提示策略可能变化。
    evidence:
      project_E4: 2026-08-12 用户真实生成反馈：包含“不飞跃、不悬空”的 Seedance 2.5 执行稿导致模型改成爬楼梯式动作。
      official_seedance_public: Seedance 1.0/2.0 官方公开资料确认复杂动作、物理稳定、自然语言指令与多模态控制能力，但本次检索未找到可核验的 2.5 否定语义规范。
      official_2_5_snapshot_limit: 项目内保存的官方 Seedance 2.5 飞书快照未完整保留“如何让输出更稳定 / 能力边界与注意事项”正文。
      cross_model_evidence: Runway 官方明确优先 positive phrasing；Google Veo 官方即便支持 negative prompt，也不推荐用 no/don't 式指令语言。
    safe_default: Seedance 2.5 影视执行稿默认用正向动作与画面描述定义目标轨迹；否定词只保留少量、局部、会毁掉剧情/身份/空间的不变量级约束。不得用全局绝对否定去定义动作风格。
    next_action: 后续以凯姆攀爬和至少一个不同类型镜头进行 A/B/C 真实生成，比较绝对否定、纯正向规格、正向规格加单条局部排除；如取得 Seedance 2.5 官方否定/negative prompt 文档则重新核验。
    status: open

  - id: U-SEQUENCE-CONTEXT-001
    question: Seedance 2.5 在15至30秒多镜头剧情生成中，是否会稳定利用受限的segment-level剧情语境改善未逐项标注的表情、视线、角色行为、群众活动和跨镜头语义一致性，同时不增加实体串台、提前揭示或逐shot指令漂移
    impact: 如果成立，可在不逐项锁死微动作的前提下给模型更准确的自主补全方向；如果不成立或context过宽，会把本段背景人物和未来信息错误实体化到不属于它们的镜头。
    current_hypothesis:
      status: candidate_unvalidated
      rule_shape: sequence context只提供当前生成段的持续状态、人物即时动机、角色或组织职能、场景运作状态和局部社会背景；事件顺序和具体可见内容继续由逐shot执行稿控制。
      causal_radius: 只有能够改变本段合理像素、声音、动作、表情、注意力或环境行为选择的信息才有资格进入context。
      state_over_event: context优先写“现在是什么状态、为什么这样行动”，不写“接下来镜头依次发生什么”。
      entity_granularity: 对只在局部shot出现的人物，segment context优先使用角色职能或组织层级而不是无必要地提前点名；精确身份在对应shot中再绑定，以降低早期实体注入风险。
      embodiment_gate: context中的实体存在不等于视觉授权，任何角色进入具体画面仍须服从SHOT-SCOPE-001的visible set。
      fact_confidence_gate: 未被剧本、用户或canonical确认的具体动机不能因为“听起来合理”就写成segment事实；可作为实验性动作动机时必须保持GUIDED而不能伪装成已确认剧情。
    safe_default: 当前只把SEQUENCE-CONTEXT-001用于多镜头剧情段的受控实验；默认2至6句自然语言，优先状态、动机、职能和场景运作，不写完整故事、未来答案、镜头流程摘要、后续shot具体前中后景或内部导演解释。
    next_action: 用REG-SEQUENCE-CONTEXT-001进行A/B/C控制变量实测。A无context，B受限context，C过长全局总结；保持参考资产、逐shot描述、模型版本、时长和可用生成设置一致，比较语义连贯、自主行为相关性、人物动机、表情微动作、群众语义、实体串台、提前揭示、VO人物实体化、逐shot遵循和prompt复杂度。
    status: open

  - id: U-GOLDEN-RETRIEVAL-001
    question: Golden Prompt Case 在 Seedance / Seedream / 其他项目生成任务中，最有效的检索维度、相似度组合以及单次调用 1、2、3 个案例的最优数量是什么
    impact: 案例过少可能无法提供足够先例，案例过多可能挤压上下文、造成模板粘连或 negative transfer；不同任务类型的最优检索策略可能不同。
    current_hypothesis:
      status: candidate_unvalidated
      safe_start: 默认仅检索 1 至 3 个最相关且互补的案例，优先 task_class、symptom、model/version、generation_mode、shot function、director goal 与 failure symptom。
    evidence: 外部 Case-Based Reasoning 与 continual-learning replay 支持“按相关性检索历史经验”这一方向，但不能直接给出本项目视频生成的最佳案例数；真实最佳值尚无项目 E4 数据。
    next_action: 在至少三类任务中比较 no-case、top-1、top-2/3 与过量案例注入，控制模型版本、参考资产与核心任务不变，评价生成质量、指令遵循、模板过拟合、prompt complexity 与 negative transfer。
    status: open

  - id: U-GOLDEN-PROMPT-OUTPUT-001
    question: 用户认为“提示词文本写得优秀”与真实生成结果“确实优秀”在本项目中的一致程度有多高，哪些提示词特征只提升可读性却不提升生成质量
    impact: 如果不区分 prompt-level excellence 与 output-level excellence，系统可能把“写得漂亮”误学成“生成上因果有效”，进而错误推动技能成熟度。
    current_hypothesis:
      status: candidate_unvalidated
      safe_default: verdict_basis 严格区分 prompt_only、generated_output、both、comparative；prompt_only 案例可立即进入 Golden Case，但抽取的生成技能默认保持 candidate。
    next_action: 对后续 Golden Cases 记录提示词评价与真实输出评价，累计样本后分析两者一致率、主要分歧类型和真正与生成结果相关的变量。
    status: open

  - id: U-GOLDEN-GRADER-001
    question: 自动文本/图像/视频 grader 在本项目各验收维度上与用户导演判断的相关性、偏差方向和可接受使用边界是什么
    impact: 未校准 grader 若被赋予过高权重，可能把身份、空间或表面指令遵循的高分误当成导演质量，也可能在开放式审美任务中产生系统性宽松或偏差。
    current_hypothesis:
      status: candidate_unvalidated
      safe_default: 自动 grader 只承担客观与半客观诊断，不覆盖用户对 Golden Case 的领域判断，不凭 reference-free 单次自动评分晋升 maturity。
    next_action: 对一组用户已明确分层评价的真实生成结果做盲评对照，分别测身份、空间、动作物理、时间稳定、剧情功能、表演与整体导演质量的 grader-human agreement，再决定哪些维度允许自动门控。
    status: open

  - id: U-GOLDEN-VERSION-TRANSFER-001
    question: Golden Prompt Case 中哪些结构属于稳定导演原则，哪些属于特定 Seedance / Seedream / ChatGPT 或其他模型版本的 prompt syntax / interface dependency，以及跨版本迁移时失效速度如何
    impact: 若把版本绑定的写法当成长期导演规律，模型升级后会产生陈旧技能；若模型升级时全部废弃旧案例，又会丢失稳定导演知识。
    current_hypothesis:
      status: candidate_unvalidated
      safe_default: 案例保留历史 provenance，技能抽取时显式标注 model_or_tool_dependency；版本变化只使相关 version-bound lesson 进入 needs_revalidation，不删除稳定导演原则。
    next_action: 发生大版本更新或同提示在新版本明显漂移时，对代表性 Golden Cases 做 targeted revalidation，并记录哪些变量稳定、哪些变量需改写。
    status: open

  - id: U-SOAC-IR-GRANULARITY-001
    question: SOAC IR 多细最有利于导演准确度，而不会带来上下文或约束过载
    impact: 字段不足会使世界事件调度与可见可听合同重新混写；字段过多可能压缩模型执行空间并增加编译维护成本。
    current_hypothesis:
      status: candidate_unvalidated
      safe_default: 只在完整导演、剧情转镜头、AI执行编译、可见可听诊断、反向验收或编译器回归时按需读取schema；最终模型提示只保留最小充分执行字段。
    next_action: 在REG-SOAC-001及至少一个不同任务中比较最小必要IR、过细IR与直接提示的生成质量、scope leak、constraint overload、prompt complexity和repair_iterations。
    status: open

  - id: U-SOAC-ADAPTER-001
    question: 不同模型和版本真正应该消费 SOAC 的哪些字段
    impact: 若把模型私有接口或提示词习惯误写进SOAC核心，会使模型升级时导演方法陈旧或错误迁移。
    current_hypothesis:
      status: candidate_unvalidated
      safe_default: SOAC核心保持模型无关；Seedance、Veo、Runway、H3及未来模型只通过adapter声明能力、参考、音频、摄影机、编辑、延长与negative prompt语义，版本变化进入needs_revalidation。
    next_action: 为每个实际使用模型记录adapter capability并在模型大版本变化后用同一SOAC合同做targeted revalidation。
    status: open

  - id: U-SOAC-REVERSE-001
    question: 人工或AI辅助反向观察与未来自动视觉音频grader之间，什么组合最可靠
    impact: 未校准自动grader可能把表面指令遵循误当成导演成功，或遗漏身份、空间、表演、声音来源和转场失败。
    current_hypothesis:
      status: candidate_unvalidated
      safe_default: 当前reverse compiler只接受人工或AI辅助观察作为candidate输入；自动grader只做诊断，不自动晋级maturity或覆盖用户导演判断。
    next_action: 用用户已确认的真实生成样本比较人工、AI辅助和自动grader对identity space action_binding contact event_order performance camera audio transition与final_state的agreement。
    status: open