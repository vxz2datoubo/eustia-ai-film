suite: GOLDEN_CASE_INGESTOR_MVP
source_regression: 11_验收/golden_case_director_pull_regression_cases.yaml
automatic_coverage:
  - regression_id: REG-GCDP-STILLNESS-001
    test: test_image_sequence_preserves_duration_evidence
    assertion: hold_start_middle_release frames survive perceptual deduplication
  - regression_id: REG-GCDP-MICROCHANGE-001
    test: test_image_sequence_preserves_duration_evidence
    assertion: visual change candidates retain seconds and confidence without interpreting emotion
  - regression_id: REG-GCDP-DURATION-001
    test: test_image_sequence_preserves_duration_evidence
    assertion: duration evidence guard records a seconds-based hold structure
  - regression_id: REG-GCDP-SOUND-PUNCTUATION-001
    test: test_video_fixture_audio_evidence
    assertion: audio onset, peak, silence or low-density evidence shares the video seconds timeline
  - regression_id: REG-GCDP-PROMPT-ONLY-001
    coverage: deferred_out_of_scope_for_media_ingestor
    reason: This MVP ingests media-backed evidence bundles; prospective prompt-only director analysis remains owned by GPT and is not claimed as an automated test.
  - regression_id: REG-GCDP-MANDATORY-001
    test: test_image_sequence_preserves_duration_evidence
    assertion: bundle contains a GPT-pending director_pull.md stub but no automatic director interpretation
additional_engineering_contracts:
  - test: test_seconds_first_filenames
    assertion: evidence names use __t_seconds__ and no frame-first primary names
  - test: test_prompt_boundary_and_validator
    assertion: unverified source prompt remains M1 and reconstructed prompt remains inferred provenance
  - test: test_verified_prompt_output_pair_is_m2_only_with_gate
    assertion: M2 requires explicit verified prompt/media pairing
  - test: test_validator_rejects_third_party_without_rights_status
    assertion: third-party provenance cannot omit rights and persistence status
  - test: test_exact_non_grid_cut_is_refined_locally
    assertion: a non-0.5s cut is refined with local frame-interval search
  - test: test_video_fixture_audio_evidence
    assertion: continuous high-motion video does not become multiple hard-cut shots
  - test: test_image_sequence_preserves_duration_evidence
    assertion: perceptual dedup guard retains semantically necessary hold evidence
