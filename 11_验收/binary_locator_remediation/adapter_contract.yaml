schema_id: EUSTIA_BINARY_LOCATOR_ADAPTER_CONTRACT_CANDIDATE
version: 0.2.0
status: candidate
scope: machine_dereferenceable_binary_locator_adapter_contract
parent_contract: 10_运行时/asset_retrieval_policy.yaml

execution_authority:
  user_full_authorization_comment: 5330299639
  independent_phase_0_1_review: 4962321299
  staged_execution: [PHASE_2A, PHASE_2B_AFTER_2A_PASS, PHASE_2C_AFTER_2B_PASS, PHASE_2D_AFTER_2C_PASS]
  fail_closed_gates_remain_mandatory: true

core_invariant:
  - locator_identity != binary_retrieved
  - provider_protocol_pass != chatgpt_runtime_binary_transport_pass
  - provider_namespace_must_be_explicit
  - provider_id_namespaces_must_not_be_cross_interpreted
  - exact_bytes_must_match_target_media_version_content_sha256_before_pixel_verified
  - same_pixels_new_locator_keeps_same_media_version_id
  - durable_locator_must_not_contain_ephemeral_bearer_capability

machine_locator_namespaces:
  github_blob:
    classification: provider_protocol_machine_dereferenceable_reference_only_in_current_chatgpt_tool_surface
    required_fields: [repo_full_name, blob_sha, expected_content_sha256]
    adapter_output: [raw_bytes, byte_count, observed_sha256]
    auth_model:
      public_repo: none
      private_repo: repository_contents_read_credential
    current_evidence:
      provider_protocol: PASS
      current_chatgpt_connector_arbitrary_binary_transport: NOT_AVAILABLE_IN_TESTED_ACTIONS
    notes:
      - Git blob SHA is provider locator identity and is not a substitute for the registered Media Version SHA-256.
      - Production formal media must not be published to the current public eustia-ai-film repository.

  openai_api_file_id:
    classification: provider_protocol_machine_dereferenceable_candidate_secondary
    required_fields: [file_id, expected_content_sha256]
    namespace_rule: must_never_interpret_chatgpt_file_id_as_openai_api_file_id
    adapter_requirement: authenticated_openai_api_files_content_retrieval

  r2_object:
    classification: selected_phase_2_candidate
    durable_required_fields:
      - bucket_ref
      - object_key
      - expected_content_sha256
    durable_forbidden_fields:
      - presigned_url
      - bearer_url
      - access_key
      - secret_key
    namespace_rule: durable_locator_must_not_persist_presigned_url_as_identity
    provider_adapter_requirement: authenticated_s3_compatible_get_object
    expected_runtime_output:
      - actual_binary_bytes_or_usable_file_reference
      - byte_count
      - observed_sha256
      - image_decode_result
      - observed_dimensions
    runtime_capability_boundary:
      presigned_url: short_lived_runtime_capability_only
      credential_storage: secret_store_only
      secret_or_bearer_value_in_git: forbidden
    phase_2a_pass_requires:
      - authenticated_private_synthetic_object_retrieval
      - actual_binary_bytes_or_usable_file_reference
      - byte_count_observed
      - sha256_observed_and_expected_match
      - image_decoder_opened
      - dimensions_observed
      - second_retrieval_sha256_identical
      - wrong_namespace_fail_closed
      - unknown_object_fail_closed
      - credential_unavailable_or_invalid_fail_closed
      - wrong_sha256_fail_closed
      - corrupt_non_image_fail_closed
      - all_locators_fail_closed
      - no_presigned_url_persisted
      - no_credential_or_bearer_value_committed
      - actual_chatgpt_runtime_binary_transport_verified
    critical_gate: provider_runtime_or_ci_success_without_actual_chatgpt_runtime_binary_transport_does_not_unlock_phase_2b

non_machine_primary_locators_in_current_harness:
  chatgpt_file_id:
    classification: opaque_chatgpt_platform_locator
    current_observation: no_direct_binary_dereference_action_in_validated_fresh_chat_tool_surface
    forbidden_interpretation: openai_api_file_id
  file_library_title:
    classification: search_key
    current_observation: exact_title_search_did_not_guarantee_target_image_binary_retrieval

adapter_result_contract:
  success_required:
    - locator_namespace_validated
    - bytes_obtained
    - byte_count_observed
    - sha256_observed
    - sha256_matches_registered_media_version
    - image_decoder_opened
    - dimensions_observed
  failure_codes:
    - LOCATOR_NAMESPACE_MISMATCH
    - LOCATOR_NOT_FOUND
    - AUTH_UNAVAILABLE
    - BINARY_TRANSPORT_UNAVAILABLE
    - BINARY_NOT_RETRIEVED
    - SHA256_MISMATCH
    - IMAGE_DECODE_FAILED
    - DIMENSION_MISMATCH

phase_2b_formal_pilot_gate:
  allowed_versions: [EUS-VER-000002, EUS-VER-000011, EUS-VER-000008]
  entry_condition: phase_2a_actual_chatgpt_runtime_binary_transport_and_pixel_open_PASS
  same_hash_action: ADD_LOCATOR_TO_EXISTING_VERSION
  different_hash_action: FAIL_CLOSED_STOP_AND_ROUTE_TO_VERSION_GOVERNANCE
  new_version_creation_for_same_hash: forbidden

security_and_scope_gates:
  no_credentials_committed_to_git: true
  no_presigned_bearer_urls_committed_to_git: true
  no_formal_mother_image_published_to_public_repo: true
  external_storage_creation_authorized_by_user_comment: 5330299639
  formal_binary_republish_authorized_only_after_phase_2a_pass: true
  credential_creation_or_secret_registration_authorized_by_user_comment: 5330299639
  generation_reference_binding_deferred_until_phase_2c_binary_pixel_pass: true
