registry:
  id: EUSTIA_GOLDEN_PROMPT_CASES
  title: 优秀提示词案例库
  status: active
  last_updated: 2026-08-13
  authority: user_explicit_golden_case_verdict
  protocol: 08_系统学习/优秀提示词案例学习协议.md
  learning_engine: 08_系统学习/反馈反推与系统反哺引擎.md
  maturity_model: 10_运行时/maturity_model.yaml

principles:
  user_facing_steps:
    - learn
    - register
  preserve_source_prompt_verbatim: true
  case_registration_is_not_skill_promotion: true
  prompt_approval_is_not_output_verification: true
  generated_output_verification_may_support_scene_verified: true
  exact_case_used_as_demonstration_cannot_be_sole_holdout_eval: true
  retrieve_minimal_relevant_cases_not_full_library: true
  conflicting_cases_must_be_retained_with_boundaries: true
  model_version_change_can_trigger_needs_revalidation: true
  secrets_and_credentials_must_never_be_registered: true
  proactive_recall_enabled: true
  user_does_not_need_to_name_or_remember_case_id: true
  functional_similarity_has_priority_over_surface_style_similarity: true
  high_relevance_case_should_be_surfaced_as_an_active_suggestion: true

proactive_retrieval_policy:
  purpose: 在新任务中主动召回与当前目标真正相关的优秀案例，提高其在战术与提示词设计层的参考权重，并在高相关时主动向用户提出可尝试的机制。
  authority_boundary:
    may_influence:
      - prompt_structure
      - camera_strategy
      - performance_execution
      - typography_or_graphic_behavior
      - lighting_strategy
      - temporal_structure
      - multimodal_reference_binding
      - constraint_strategy
      - sound_or_visual_integration
    must_not_override:
      - user_current_explicit_instruction
      - PROJECT_INDEX
      - current_screenplay
      - character_canonical
      - scene_and_map_canonical
      - formal_asset_binding
      - continuity
  activation:
    do_not_require_user_to_name_case: true
    run_on:
      - creating_or_revising_prompt
      - directing_scene_or_shot
      - designing_ai_image_or_video_execution
      - designing_commercial_or_graphic_motion
      - user_asks_for_options_or_improvement
  ranking:
    strong_signals:
      - same_task_function
      - same_director_goal
      - same_shot_function
      - same_transferable_mechanism
      - same_failure_symptom
    medium_signals:
      - same_generation_mode
      - same_model_family_or_version
      - same_subject_camera_relationship
      - same_lighting_structure
      - same_typography_or_graphic_behavior
      - same_temporal_structure
    weak_signals:
      - same_color
      - same_genre_label_without_functional_match
      - superficial_style_similarity_only
    evidence_priority_when_other_similarity_is_equal:
      - golden_cross_scene
      - golden_reproduced
      - golden_output_verified
      - golden_user_approved
  recommendation_tiers:
    high:
      condition: 核心任务功能与至少一个可迁移机制高度一致且边界不冲突
      behavior:
        - raise_case_priority
        - retrieve_case
        - actively_tell_user_a_relevant_golden_case_exists
        - explain_which_mechanisms_are_worth_trying
        - optionally_compile_those_mechanisms_into_current_prompt
    medium:
      condition: 只有部分机制一致而整体任务目的不同
      behavior:
        - use_as_secondary_precedent
        - borrow_only_matching_mechanisms
        - mention_only_if_material_to_user_choice
    low:
      condition: 只有表面风格相似而核心功能不同
      behavior:
        - do_not_surface_case
        - do_not_copy_prompt
  suggestion_contract:
    must_say_why_relevant: true
    must_name_transferable_parts: true
    must_not_copy_entire_prompt_by_default: true
    may_propose_experiment: true
    examples:
      - 这里很像以前的优秀案例，我建议试它的“人物占比恒定 + 摄影机同步后退”。
      - 这里可以借优秀广告案例里的“三维文字作为场景实体 + 同场光照/反射绑定”，但不照搬黑底黄字。
      - 这个场景只适合借它的前动后静收束结构，不适合照搬视觉风格。
  feedback_loop:
    accepted_and_better:
      - record_transfer_evidence
      - link_sibling_transfer_case_when_appropriate
      - run_final_delta
      - update_maturity_only_under_existing_maturity_rules
    rejected_or_worse:
      - record_negative_transfer
      - refine_matching_boundary
      - keep_original_golden_case
      - lower_future_recall_for_that_context

case_id_policy:
  format: GPC-YYYYMMDD-NNN
  immutable_after_creation: true
  variants_use_parent_case_id: true
  exact_duplicates_update_existing_case: true

case_schema:
  required:
    - case_id
    - created_at
    - source_type
    - source_prompt_verbatim
    - user_verdict
    - verdict_scope
    - verdict_basis
    - task_class
    - case_status
    - provenance
  optional:
    - parent_case_id
    - variant_of
    - work_item_id
    - scene_or_shot
    - model
    - model_version
    - generation_mode
    - reference_assets
    - generation_settings
    - output_evidence
    - user_named_strengths
    - system_observed_strengths
    - normalized_summary
    - edcm
    - extracted_lesson_refs
    - related_skill_refs
    - applicable_context
    - non_applicable_context
    - failure_boundaries
    - counterfactuals
    - model_or_tool_dependency
    - revalidation_triggers
    - targeted_eval
    - fingerprint
    - sensitivity

verdict_basis_values:
  - prompt_only
  - generated_output
  - both
  - comparative

verdict_scope_values:
  - prompt_approved
  - output_verified
  - comparative_win
  - reproduced
  - cross_scene_transfer

case_status_values:
  - golden_user_approved
  - golden_output_verified
  - golden_reproduced
  - golden_cross_scene
  - conflicted
  - needs_revalidation
  - deprecated

retrieval_dimensions:
  - task_class
  - symptom_tags
  - model
  - model_version
  - generation_mode
  - scene_type
  - shot_function
  - characters
  - assets
  - spatial_dependencies
  - failure_symptoms
  - director_goal
  - verdict_scope
  - linked_skill_maturity

holdout_policy:
  create_when_case_is_high_value:
    - sibling_transfer_case
    - contrast_case
    - holdout_case
  purpose:
    - test_transfer_not_memorization
    - reduce_template_overfitting
    - detect_negative_transfer
    - detect_model_version_drift

sensitivity_policy:
  repository_visibility: public
  never_store:
    - "p\u0061sswords"
    - "api_\u006beys"
    - "t\u006fkens"
    - "c\u006fokies"
    - "session_cred\u0065ntials"
    - "priv\u0061te_keys"
    - "mfa_c\u006fdes"
    - "recovery_c\u006fdes"
    - "brokerage_cred\u0065ntials"
    - "payment_cred\u0065ntials"
  if_sensitive_or_private_source_is_detected: mark_pending_and_do_not_write_verbatim

cases:
  - case_id: GPC-20260813-001
    created_at: 2026-08-13
    source_type: user_supplied_prompt
    user_verdict: excellent
    verdict_scope: prompt_approved
    verdict_basis: prompt_only
    task_class: high_end_fashion_commercial_kinetic_typography
    case_status: golden_user_approved
    provenance: user_current_explicit_instruction
    source_prompt_verbatim: |
      以参考图1作为模特及参照。

      全程保留人物的面部、发型，造型与颜色。

      高端时尚商业片，写实真人实拍风格。

      无限延展的黑色虚空背景，光亮的黑色地面。仅对人物打光：一侧打出硬主光，另一侧打出第二道硬光，两者之间形成浓重阴影。

      模特下巴保持水平，双眼看向镜头，缓缓向镜头走来。摄影机与她的行进速度同步向后移动，人物在画面中的占比保持不变。

      所有文字均为醒目黄色、粗体压缩型无衬线大写字体，渲染为带有真实厚度的三维立体实体物件，接收与人物相同的光照，并在地面投下淡淡的阴影。

      [0‑3秒] 文字“我”从模特前方的地面深处浮现，具备强透视效果，随模特走近不断放大，从画面两侧掠过并移出画面。

      文字“真”从右侧高速冲入，带着强烈运动模糊效果在模特身后飞驰而过，从画面左侧飞出。

      文字“棒”以大尺寸出现，初始完全失焦，在半秒内变得极致锐利，短暂定格后碎裂散开。

      四根细黄线勾勒出环绕模特的矩形边框，文字“哈哈”沿着矩形下边缘逐步拼接成型。

      文字掠过模特身旁时，会在光亮的镜片上产生对应反射效果，贯穿本段全程。

      [3‑5秒] 模特停下脚步。全部文字向内坍缩，消散于黑暗之中。摄影机继续推进，给到人物面部与黄色太阳镜的近距离特写。模特完全静止，双眼直视镜头。在人物下方的黑色背景上，以同款黄色字体逐步拼合出标题：“还真是”，其下方字号更小的文字：“超棒的”。画面定格。

      所有文字干净清晰、易于辨认，为拼写无误的英文大写字母，每个单词仅出现一次。禁止出现乱码、重复字母、拼写错误、字幕、水印以及其他额外文字或标识。

      音频：低沉持续的低音。

      画面构图：模特居于画面中心，全部文字都位于画面居中三分之一区域内。
    normalized_summary: 高端黑色虚空走秀商业片；人物恒定居中，摄影机与模特同速后退；黄色三维动态文字作为场景实体参与透视、运动、光照、投影与镜片反射；前段高动势动态图形，后段近景标题锁定。
    system_observed_strengths:
      - reference_identity_lock
      - coherent_black_void_and_reflective_floor_world
      - matched_speed_camera_subject_contract
      - centered_hero_framing
      - hard_light_split_with_deep_shadow
      - diegetic_3d_kinetic_typography
      - typography_motion_has_distinct_behaviors
      - reflection_links_graphics_to_subject
      - two_phase_dynamic_then_lockup_structure
      - explicit_text_legibility_and_error_constraints
    edcm:
      k0:
        - 用户明确判定该提示词为优秀广告走秀风格案例
        - 人物身份与造型保持、灯光、走秀动作、摄影机同步后退、文字运动、构图和音频均有显式定义
      k1:
        - 偏好高控制度但仍以视觉结果为中心的商业片提示结构
        - 偏好让图形文字真正进入三维场景而不是作为后期字幕漂浮
        - 偏好动态段落最终收束成稳定广告标题画面
      k2:
        - kinetic_typography
        - diegetic_3d_typography
        - matched_speed_dolly_back
        - hero_framing_stability
        - reflection_driven_visual_integration
        - title_lockup
      k3:
        - 中文指定文案与“英文大写字母”约束存在内部冲突，跨模型最稳处理方式尚待实测
        - 不同视频模型对复杂文字拼写、三维字形、动态文字与反射绑定的可靠度尚待版本化验证
    applicable_context:
      - high_end_fashion_commercial
      - runway_style_ad
      - model_centered_brand_film
      - kinetic_typography_short_video
      - black_void_minimal_commercial
      - graphic_motion_integrated_with_subject
    non_applicable_context:
      - dialogue_driven_scene
      - multi_character_dramatic_blocking
      - documentary_observation
      - topology_heavy_story_scene
    failure_boundaries:
      - 不应把黑色虚空、黄色字体或具体中文文案机械迁移到所有广告任务
      - 中文文案与英文大写字母要求存在冲突，复用时必须按当前任务文字语言消歧
      - 文字准确率、反射绑定和多段复杂动效属于模型能力相关项，不能仅凭提示词文本优秀视为输出已验证
    model_or_tool_dependency:
      status: unknown
      note: 本次用户未提供具体生成模型、版本或真实输出验证信息
    revalidation_triggers:
      - model_or_version_change
      - text_rendering_interface_change
      - generation_mode_change
      - user_reports_real_output_success_or_failure

  - case_id: GPC-20260813-002
    created_at: 2026-08-13
    source_type: user_supplied_prompt
    user_verdict: good_reference
    verdict_scope: prompt_approved
    verdict_basis: prompt_only
    task_class: single_source_top_light_pathological_cool_palette_combat
    case_status: golden_user_approved
    provenance: user_current_explicit_instruction
    scene_or_shot: 用户说明该片段来自一段打斗场景提示词
    source_prompt_verbatim: |
      光线与色调 
      仅有一根顶部荧光灯管，投射出强烈的定向顶光。背景充斥浓重阴影。画面渲染阴冷病态的青蓝与绿色调，和鲜艳猩红的血迹形成强烈对比。
    user_named_strengths:
      - 用户明确认为这段光效“还挺不错”，并要求录入参考库
    normalized_summary: 单一顶部荧光灯作为明确动机光源，以强定向顶光压缩可见区域并让背景大面积落入浓重阴影；整体青蓝与绿色冷域塑造阴冷病态感，再用高饱和猩红血迹形成强烈色相与注意力对比。
    system_observed_strengths:
      - single_motivated_practical_source
      - strong_directional_top_light
      - deep_shadow_negative_space
      - pathological_cyan_green_palette
      - saturated_crimson_attention_anchor
      - lighting_and_color_serves_violence_tone
      - concise_high_signal_prompt_fragment
    edcm:
      k0:
        - 用户明确认可该光线与色调片段，要求作为未来参考
        - 原文明确限定单一顶部荧光灯、定向顶光、浓重阴影、青蓝绿色调与猩红血迹对比
      k1:
        - 用户认可的重点更接近“光源结构 + 明暗组织 + 色彩冲突”的组合机制，而不是单纯偏爱某个颜色
        - 该组合适合把暴力中的血迹从复杂暗背景中迅速提升为视觉焦点
      k2:
        - motivated_practical_lighting
        - top_light
        - low_key_lighting
        - negative_space_by_shadow
        - complementary_attention_contrast_by_palette_separation
        - color_script_as_narrative_emphasis
      k3:
        - 不同视频与图像模型对“仅有一根灯管”的全局光源排他约束是否稳定遵循尚未实测
        - 青蓝绿色调若跨镜头过强，可能造成肤色污染、血色失真或连续性断裂，最优强度仍需真实生成验证
    extracted_lesson_refs:
      - GPC-20260813-002#single_motivated_top_light
      - GPC-20260813-002#cool_field_crimson_anchor
      - GPC-20260813-002#deep_shadow_negative_space
    related_skill_refs:
      - AI电影系统#4.7摄影与灯光
      - maturity:candidate
    applicable_context:
      - confined_fight_scene
      - brutal_close_quarters_action
      - interrogation_or_detention_space
      - pathological_medical_or_horror_tone
      - underground_industrial_or_service_corridor
      - scene_needing_blood_as_visual_attention_anchor
    non_applicable_context:
      - warm_intimate_dialogue
      - broad_daylight_exterior
      - scenes_requiring_open_readable_background_topology
      - scenes_where_healthy_natural_skin_tone_is_primary
      - continuity_segments_with_incompatible_established_light_source
    failure_boundaries:
      - 不把荧光灯、青蓝绿和猩红血迹机械绑定为所有打斗场景的默认风格
      - 若剧情需要清楚展示多人空间拓扑，大面积吞黑可能损伤动作可读性
      - 若角色面部表演是剧情核心，强顶光可能制造眼窝死黑与表情信息损失，需要补足可读度
      - 青绿染色必须服从人物肤色、资产颜色与前后镜头连续性，不能变成全局廉价滤镜
      - 血红焦点只有在剧情中确有血迹或红色关键物时成立，不应为了配色凭空增加血迹
    counterfactuals:
      - 如果保留青蓝绿色调但改成均匀柔光，病态压迫与血迹视觉冲击预计会明显下降
      - 如果保留强顶光但移除冷色场与猩红焦点，仍可产生压迫感，但不会复制该案例的色彩叙事机制
    model_or_tool_dependency:
      status: unknown
      note: 用户未提供具体模型、版本、生成模式或真实输出验证，因此仅登记为提示词优秀参考，不视为生成能力已验证
    revalidation_triggers:
      - user_reports_real_output_success_or_failure
      - model_or_version_change
      - generation_mode_change
      - cross_scene_transfer_attempt
    targeted_eval:
      status: not_required_yet
      reason: 当前仅为提示词认可，待首次真实生成或跨场景迁移后再建立兄弟案例/对照案例与回归验证
