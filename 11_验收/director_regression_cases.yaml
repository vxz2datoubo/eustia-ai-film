cases:
  - id: REG-CALC-001
    title: 菲奥奈在广场不是等凯姆出现
    must_preserve:
      - 菲奥奈原本带队巡查和维护秩序
      - 高处异常只产生轻微职业警觉
      - 队友处理插队男子形成职责打断
      - 菲奥奈回到现场协调
      - 不启动追捕凯姆的一级悬念
    checks:
      - camera_off_test
      - resumption_test
      - background_independence_test
      - narrative_weight_budget

  - id: REG-EXPOSITION-001
    title: 爱丽丝VO与凯姆攀爬并行
    must_preserve:
      - 爱丽丝信息说明通过VO延续
      - 凯姆同时攀爬并扩大搜索视野
      - 声音和画面承担不同信息
      - 不提前展示男孩翅膀
    checks:
      - temporal_parallel
      - attention_budget
      - reveal_budget

  - id: REG-SCREEN-EVIDENCE-001
    title: AI视频执行稿用最小充分屏幕证据替代关键概念与抽象含义
    maturity: candidate
    must_preserve:
      - 高度尺度速度危险距离等关键状态不能只靠抽象形容词承担
      - 情绪氛围人物气质能力感主题含义等只要承担关键生成职责也必须落到可见或可听证据
      - 隐喻诗性表达和小说化结论默认不能独自承担关键渲染控制除非确实希望模型按字面把该意象生成出来
      - 抽象词可以在具体证据之后作为弱辅助但不能替代光线材质构图动作表情视线环境反应或声音证据
      - 用楼层窗户地面人物尺度接触点位置变化等可见证据建立画面
      - 用光线反射材质状态遮挡占幅负空间人物视线身体动作群众行为和环境声音等证据建立情绪氛围或人物状态
      - 动作只保留关键接触重心方向和结果不写无意义微动作清单
      - 图生视频时不高密度复述参考图已经明确的静态像素而优先描述动作摄影机时间推进和关键变化
      - 具体化必须服从canonical地图角色资产与空间连续性
      - 屏幕证据化遵守最小充分原则不得演变成同义词重复负面词堆叠或逐秒过控
      - 默认通过事件顺序表达节拍不强制每镜时间码
      - 镜头结束时保留明确final_state供下一镜继承
    checks:
      - observable_screen_evidence
      - visible_frame_outline
      - abstract_meaning_to_renderable_evidence
      - literal_renderability
      - metaphor_literalization_risk
      - relative_scale_and_elevation
      - physical_contact_action_chain
      - light_material_environment_evidence
      - facial_gaze_body_evidence
      - audible_evidence
      - modality_role_split
      - prompt_constraint_budget
      - final_state
      - no_forced_timecode_without_need
    targeted_eval:
      method: A_B_compare
      A: 关键画面以抽象概括隐喻或含义词为主
      B: 将同一导演意图翻译成最小充分的可见可听屏幕证据
      compare:
        - instruction_following
        - scale_and_height_readability
        - physical_contact_and_body_mechanics
        - motion_continuity
        - emotional_and_atmospheric_alignment
        - character_state_readability
        - metaphor_literalization_error
        - generic_style_cliche_rate
        - spatial_stability
        - unwanted_model_invention
        - prompt_complexity
        - overconstraint_rigidity

  - id: REG-POSITIVE-SPEC-001
    title: 凯姆跑酷攀墙用正向动作规格替代绝对否定
    maturity: candidate
    scene_evidence:
      work_item: KAIM-HIGH-SEARCH-30S
      observed_result: 含“不飞跃、不悬空”等强否定的Seedance 2.5提示词导致动作退化成爬楼梯式替代行为
      evidence_level: E4
      incident_status: scene_verified_observation
    must_preserve:
      - 正向描述角色实际沿建筑外立面持续上行
      - 允许相邻支点之间自然短距离腾跃和短暂离墙悬空
      - 真实重量通过可见支点发力抓点踩点重心转移和明确落点建立
      - 动作风格通过轻盈连续高效的正向运动包络定义而不是通过“不飞跃不悬空”定义
      - 摄影机正向描述为沿上行路径跟随并同时保留人物与建筑支点可读性
      - 默认先不用全局绝对否定句控制动作
      - 必须保留的排除项应局部化对象化并只用于会毁掉剧情身份空间或关键连续性的严重错误
      - 若平台存在独立negative-prompt接口必须按该平台官方语义使用不得把专用负向控制与主提示自然语言否定混为一谈
      - 不能因为减少否定词而撤销真实物理空间拓扑角色身份揭示预算等硬不变量
    checks:
      - positive_target_specification
      - physical_motion_envelope
      - hard_vs_soft_constraint
      - negation_scope
      - feasible_action_space
      - substitute_behavior_risk
      - prompt_constraint_budget
      - platform_negative_prompt_support
      - screen_evidence_link
    targeted_eval:
      method: A_B_C_compare
      A: 绝对否定为主，例如不飞跃不悬空不做超级英雄动作
      B: 纯正向动作规格，明确外立面支点短距离腾跃抓踩与连续上行
      C: 正向动作规格加最多一条局部严重错误排除
      compare:
        - desired_motion_adherence
        - unintended_staircase_or_route_substitution
        - physical_contact_and_body_mechanics
        - motion_energy_and_lightness
        - spatial_continuity
        - camera_behavior
        - visual_quality
        - prompt_complexity
        - rigidity_or_overconstraint
        - catastrophic_error_rate

  - id: REG-SHOT-SCOPE-001
    title: AI视频每个shot只编译当前镜头可观察状态
    maturity: candidate
    scene_evidence:
      work_item: KAIM-HIGH-SEARCH-30S
      observed_result: 农妇窗外反应镜头被写入下一主观镜头才应出现的广场钟楼与猎羽信息；真实生成同时出现爱丽丝被实体化进人群、农妇视点高度和画面域混乱等跨镜头污染
      evidence_level: E4
      incident_status: scene_verified_observation
    must_preserve:
      - 全局剧情计划和导演解释保留在内部规划层不重复灌入每个shot执行描述
      - 每个shot只写当前摄影机在该时刻实际可见的前景中景后景主体物体动作与环境变化
      - 当前可听但不可见的信息进入audible_offscreen_scope例如画外音远处声音和镜外音效
      - 反应镜头只描述角色在看以及当前画面可见线索目标内容等切到POV或被摄影机实际揭示后再写
      - 同一连续镜头若摄影机移动后会揭示新区域可按先后写成camera reveal但不得在揭示前把目标当成当前可见背景
      - 下一镜需要继承的信息进入final_state或transition_contract不进入当前visible_set
      - 图生视频和白模参考已经锁定当前构图时文字优先描述当前shot的动作摄影机时间推进和合法进入画面的新变化
      - 多镜头执行稿按shot分块实体和背景的作用域不得跨shot自动扩散
      - 画外音人物的存在默认属于声音通道不能仅因名字出现在VO里就成为当前画面实体
    checks:
      - shot_observable_set
      - camera_view_consistency
      - visible_entity_scope
      - audible_offscreen_scope
      - global_summary_vs_shot_caption
      - reveal_scope
      - transition_contract
      - cross_shot_information_leakage
      - storyboard_scope_alignment
      - prompt_constraint_budget
    targeted_eval:
      method: A_B_compare
      A: 将全局剧情总结和后续揭示内容混入当前shot描述
      B: 全局计划内部保留并将执行稿编译为逐shot可观察状态加transition contract
      compare:
        - unwanted_entity_injection
        - viewpoint_and_camera_consistency
        - premature_reveal_rate
        - shot_boundary_fidelity
        - subject_action_binding
        - offscreen_voice_visual_leakage
        - spatial_layout_stability
        - instruction_following
        - prompt_complexity

  - id: REG-SEQUENCE-CONTEXT-001
    title: 多镜头AI视频使用受限本段剧情语境帮助模型自然补全且不得越过shot scope
    maturity: candidate
    experiment_status: unvalidated
    scene_target:
      work_item: KAIM-HIGH-SEARCH-30S
      rationale: 当前30秒包含主角高位侦查、VO、农妇生活反应、猎羽现场巡查、群众领取粥和面包等多种自主行为，适合测试segment-level语义条件是否改善未逐项指定的动作表情和环境行为。
    must_preserve:
      - sequence context是可选的segment-level语义条件不是每个视频任务强制字段
      - 默认只在约15至30秒多镜头剧情段或自主行为信息密度较高时考虑使用
      - 内容只限当前生成段真实成立且会影响本段动作表情注意力群众行为环境反应或角色职能理解的局部事实
      - 可概括当前主目标即时动机角色职能关系场景运作状态和局部社会活动
      - 使用因果相关性门槛若某信息无法改变本段任何合理像素动作声音或行为选择则从sequence context删除
      - 不写完整故事未来剧情答案后续场景实体或本段不会表现也不会影响本段行为的剧情信息
      - 不把镜头一镜头二镜头三的流程顺序摘要放入sequence context
      - 不把观众应该如何理解导演为何这样设计等内部分析放入模型上下文
      - sequence context中提到某角色地点组织只提供语义先验不授权其进入任意shot的visible set
      - 每个shot仍由SHOT-SCOPE-001决定camera state visible set audible set in-shot reveal和next-shot contract
      - 具体shot执行描述与canonical事实优先于sequence context
      - VO说话者仍需经过shot visible gate不能仅因出现在segment context而视觉实体化
      - 语言保持自然简短默认约2至6句不输出编译器元数据和内部标签脚手架
    checks:
      - segment_context_need
      - segment_causal_relevance
      - motive_alignment
      - role_alignment
      - scene_operating_state
      - spontaneous_behavior_relevance
      - entity_embodiment_gate
      - future_information_leakage
      - shot_scope_compatibility
      - offscreen_voice_visual_leakage
      - prompt_constraint_budget
    targeted_eval:
      method: A_B_C_compare
      A: 完全不提供sequence context只给相同逐shot执行稿
      B: 提供2至6句受限sequence context再给完全相同逐shot执行稿
      C: 提供包含未来剧情镜头流程摘要和过多实体的长全局总结再给相同逐shot执行稿
      controlled_variables:
        - same_reference_assets
        - same_shot_descriptions
        - same_duration
        - same_model_version
        - same_generation_settings_when_available
      compare:
        - overall_narrative_coherence
        - spontaneous_behavior_relevance
        - character_motivation_alignment
        - facial_and_micro_action_plausibility
        - crowd_and_environment_semantic_fit
        - cross_shot_entity_leakage
        - premature_reveal_rate
        - offscreen_voice_visual_leakage
        - shot_instruction_following
        - subject_action_binding
        - prompt_complexity
      success_condition: B相较A在语义连贯和自主补全上有可见改善且不显著增加串台提前揭示VO人物实体化或逐shot指令漂移；C若恶化则同时支持限制context范围而不是简单支持更多背景文字。

  - id: REG-ASSET-001
    title: 登记资产必须正式提交
    must_preserve:
      - status_active_unless_user_says_candidate
      - update_formal_asset_registry
      - update_related_scene_or_character_if_needed
      - fetch_after_commit_verify
      - memory_not_substitute_for_registry

  - id: REG-SCENE-ASSET-IDENTITY-001
    title: 正式场景资产必须通过Scene-CameraAnchor-View-Asset-Version-Relation身份链解析且重命名不破坏引用
    must_preserve:
      - 用户层正式显示名使用中文
      - machine ID使用ASCII opaque identity且不编码方向或左右语义
      - 同一场景同一朝向允许存在多个不同Camera Anchor
      - Camera Anchor位置与View摄影机朝向不得混为一个字段
      - 普通View只用N/S/E/W绝对方向作为主方向并可用yaw_offset记录精确偏角
      - 顶视View使用screen_top_cardinal表示北朝上南朝上东朝上西朝上
      - 正打反打同机位180跨机位互看和剪辑正反打使用显式Relation绑定不得仅靠方向反转猜测
      - 导演调用顺序为map→scene→camera_anchor→view→relation_if_needed→media_asset→current_media_version→verified_locator→实际像素
      - Media Asset是稳定逻辑职责槽而不是具体File ID或PNG
      - Media Version是不可变像素修订且最终方向绑定前必须pixel_verified
      - 无法打开正式像素时不得使用语义相似候选图冒充
      - 旧语义scene registry key逐张像素核验后一次性迁移为opaque ID
      - 迁移关闭后活动canonical中旧key引用计数必须为0且不建立长期old_to_new resolver映射
      - 中文display name改动不得导致machine identity变化
      - binary storage filename默认使用ASCII Media Version ID以降低跨工具链路径风险
      - 世界东南西北不得直接假设等同Unreal或其他DCC的XYZ轴
    checks:
      - project_index_schema_registered
      - project_index_resolver_manifest_registered
      - map_authority
      - scene_asset_identity_schema_loaded
      - scene_media_resolver_manifest_loaded
      - opaque_id_validation
      - camera_anchor_resolution
      - view_direction_validation
      - top_view_screen_orientation_validation
      - relation_endpoint_validation
      - pair_relation_is_explicit
      - asset_to_current_version_resolution
      - pixel_verification_gate
      - media_locator_resolution
      - default_pointer_resolution
      - duplicate_default_guard
      - repo_wide_reference_search_before_migration
      - old_reference_zero_after_transaction_close
      - fetch_after_each_serial_write
      - final_fetch_verify

  - id: REG-SCENE-MEDIA-VERSION-001
    title: 正式场景母图更新必须通过稳定Asset与Media Version解析层而不是删除同名覆盖
    must_preserve:
      - 同一正式Asset的像素修订不得改变asset_id
      - 同像素重新上传且content_hash相同只增加或刷新locator不得制造假版本
      - 像素改变但Scene CameraAnchor View media_role与variant职责不变时创建新Media Version
      - 新版本在pixel_verified前不得成为current
      - 切换current后旧current必须变为superseded而不是静默消失
      - 时间天气光照或媒体职责需要并列长期保留时建立独立Asset variant不得伪装成版本修订
      - Camera Anchor或View实质变化时必须建立新身份不得覆盖旧Asset
      - 普通导演与长期连续性默认绑定asset_id以自动跟随current版本
      - 已生成镜头回归案例复现任务可额外锁定media_version_id且不得自动跟随current更新
      - File ID文件名路径和Library locator都不是资产身份
      - 普通替换不得自动物理删除旧版本
      - 物理删除必须用户明确确认并通过无活动引用无回归证据用途和可恢复性检查
      - resolver manifest必须是Asset→current Version→locator的唯一版本解析主档不得建立old→new→newer链式映射
    checks:
      - classification_same_pixels_vs_new_revision_vs_variant_vs_new_view
      - content_hash_dedup
      - asset_identity_stability
      - media_version_immutability
      - exactly_one_current_version
      - current_pointer_switch_after_pixel_verify
      - superseded_history_preserved
      - multiple_locator_resolution
      - pinned_version_reproducibility
      - no_same_name_overwrite_dependency
      - no_automatic_physical_delete
      - resolver_manifest_fetch_verify

  - id: REG-SOURCE-001
    title: 旧版总纲不得夺权
    must_preserve:
      - reject_legacy_as_active
      - use_PROJECT_INDEX_authority
      - use_fixed_current_AI电影系统

  - id: REG-DIRECTOR-FULL-OUTPUT-001
    title: 用户仅提供剧情并要求完整处理时，必须返回完整导演合同
    must_preserve:
      - 母本与连续性核对
      - 场景诊断
      - 导演意图
      - 人物目标与潜台词
      - 节拍
      - 表演
      - 场面调度
      - 镜头脚本
      - 摄影与灯光
      - 剪辑与声音
      - AI资产清单
      - 模型自主权合同
      - 视频模型执行稿
      - 验收清单
      - 结尾接口
    checks:
      - complete_director_output_contract
      - not_execution_prompt_only
      - continuity_before_execution
      - ending_handoff

  - id: REG-MAP-001
    title: 钟楼与关所的空间职责不得再混同
    must_preserve:
      - 主街南北向
      - 高架石桥东西向且桥在上主街在下
      - 钟楼后方为关所底层入口
      - 关所内部回旋楼梯向上到中层
      - 场景库不得建立第二套拓扑
    checks:
      - map_authority
      - scene_library_boundary
      - asset_direction_tags

  - id: REG-RESTORE-001
    title: 新会话可通过最小读取恢复凯姆当前段
    must_preserve:
      - 凯姆已经攀爬
      - 爱丽丝VO与行动并行
      - 妇女开窗后再察觉高处异常
      - 菲奥奈原本带队巡查且队友处理插队
      - 凯姆登顶搜索而目标未确认
      - 不提前展示男孩翅膀
    checks:
      - project_index_first
      - read_sets_minimal_retrieval
      - screenplay_continuity_map_asset_recall
      - CALC
      - reveal_budget

  - id: REG-REVISION-001
    title: 多轮修改时省略不等于撤销
    must_preserve:
      - 后续版本未重复旧约束时不得自动取消已接受约束
      - 只有明确撤销或不可兼容冲突才能移除旧约束
      - 新版本继承仍有效的剧情角色空间资产连续性与导演约束
      - 冲突不清时保留旧约束并提示风险
    checks:
      - revision_series_identity
      - constraint_ledger
      - omitted_not_revoked
      - continuity_inheritance

  - id: REG-REVISION-002
    title: 多轮修订只逐轮留痕并在收敛点学习
    must_preserve:
      - 每次实质修改记录最小Delta
      - 中间revision不自动晋级长期技能
      - 约3到5次实质修改或关键确认可形成checkpoint
      - 切换下一镜或下一场前自动执行Trajectory Final-Delta
      - 最终提示词不得整体机械复制成通用规则
      - candidate或scene_verified与更高成熟度晋级分离
    checks:
      - micro_capture
      - checkpoint
      - semantic_finalization
      - trajectory_final_delta
      - maturity_gate
      - regression_gate

  - id: REG-SOAC-001
    title: Screen Observable & Audible Compiler 受控导演编译回归
    maturity: candidate
    scene_evidence:
      work_item: KAIM-HIGH-SEARCH-30S
      status: real_7s_AB_observed_confounded
      experiment_id: CD25-KAIM-WINDOW-AB-20260815
      evidence_ref: 08_系统学习/C-DANCE2.5真实生成反馈库.md#实验-CD25-KAIM-WINDOW-AB-20260815
      model: C-DANCE_2.5_project_alias_for_user_reported_Seedance_2.5
      observed_result:
        A: 外部机位与外墙上行基本成立且构图被用户判定较好，但严格事件先后、窗扇接触绑定与“妇女未看到凯姆”的屏幕证据失败
        B: 外部机位、外墙上行、VO不实体化与scope基本成立，但严格事件先后与窗扇接触仍失败，并出现更明显横向伸腿与较弱coverage式构图
        shared_failure: 更显式的事件与contact描述没有在本次7秒样本中单独解决复杂微接触链
        control_drift: B额外使用斜侧摄影机描述，camera plan不等同A
        conclusion: confounded_inconclusive_no_SOAC_maturity_inference
    must_preserve:
      - canonical事实先进入WorldStateIR但不自动成为当前shot画面授权
      - EventGraphIR绑定agent action target instrument support_contact与状态变化
      - BlockingIR先服从人物目标关系和空间因果再决定摄影机
      - 每个ShotPlanIR有entry_state exit_state和next_shot_contract
      - VisibleIR严格服从SHOT-SCOPE-001的camera_state_visible_set_audible_set和in_shot_reveal
      - AudibleIR与VisibleIR平级且VO说话者不自动视觉实体化
      - SoundDirectorIR继续是唯一声音方法authority
      - TransitionContract解析Shot_A_exit_state到Shot_B_entry_state
      - 最终提示只输出最小充分执行信息而非完整IR或内部分析
      - ReverseObservation可由人工或AI辅助输入但不得声称全自动grader已实现
      - 可观察清楚不能以牺牲导演摄影构图为代价把camera退化成coverage机位
      - 受控A/B除同剧本资产模型设置时长目标外还必须锁camera position orientation shot size height lens intent motion与material composition goal
      - 关键非目标变量漂移时必须标记confounded且不得用于成熟度晋级
      - SOAC保持candidate直至取得干净受控真实生成验证
    checks:
