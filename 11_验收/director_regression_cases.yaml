cases:
  - id: REG-CALC-001
    title: 菲奥奈在广场不是等凯姆出现
    must_preserve:
      - 菲奥奈原本带队巡查和维护秩序
      - 高处异常只产生轻微职业警觉
      - 队友处理插队男子形成职责打断
      - 菲奥奈回到现场协调
      - 不启动追捕凯姆的一级悬念
    checks:
      - camera_off_test
      - resumption_test
      - background_independence_test
      - narrative_weight_budget

  - id: REG-EXPOSITION-001
    title: 爱丽丝VO与凯姆攀爬并行
    must_preserve:
      - 爱丽丝信息说明通过VO延续
      - 凯姆同时攀爬并扩大搜索视野
      - 声音和画面承担不同信息
      - 不提前展示男孩翅膀
    checks:
      - temporal_parallel
      - attention_budget
      - reveal_budget

  - id: REG-SCREEN-EVIDENCE-001
    title: AI视频执行稿用最小充分屏幕证据替代关键概念概括
    maturity: candidate
    must_preserve:
      - 高度尺度速度危险距离等关键状态不能只靠抽象形容词承担
      - 用楼层窗户地面人物尺度接触点位置变化等可见证据建立画面
      - 动作只保留关键接触重心方向和结果不写无意义微动作清单
      - 图生视频时不高密度复述参考图已经明确的静态像素而优先描述动作摄影机时间推进和关键变化
      - 具体化必须服从canonical地图角色资产与空间连续性
      - 屏幕证据化遵守最小充分原则不得演变成同义词重复负面词堆叠或逐秒过控
      - 默认通过事件顺序表达节拍不强制每镜时间码
      - 镜头结束时保留明确final_state供下一镜继承
    checks:
      - observable_screen_evidence
      - visible_frame_outline
      - relative_scale_and_elevation
      - physical_contact_action_chain
      - modality_role_split
      - prompt_constraint_budget
      - final_state
      - no_forced_timecode_without_need
    targeted_eval:
      method: A_B_compare
      A: 概念概括为主
      B: 最小充分屏幕证据化
      compare:
        - instruction_following
        - scale_and_height_readability
        - physical_contact_and_body_mechanics
        - motion_continuity
        - spatial_stability
        - unwanted_model_invention
        - prompt_complexity
        - overconstraint_rigidity

  - id: REG-POSITIVE-SPEC-001
    title: 凯姆跑酷攀墙用正向动作规格替代绝对否定
    maturity: candidate
    scene_evidence:
      work_item: KAIM-HIGH-SEARCH-30S
      observed_result: 含“不飞跃、不悬空”等强否定的Seedance 2.5提示词导致动作退化成爬楼梯式替代行为
      evidence_level: E4
      incident_status: scene_verified_observation
    must_preserve:
      - 正向描述角色实际沿建筑外立面持续上行
      - 允许相邻支点之间自然短距离腾跃和短暂离墙悬空
      - 真实重量通过可见支点发力抓点踩点重心转移和明确落点建立
      - 动作风格通过轻盈连续高效的正向运动包络定义而不是通过“不飞跃不悬空”定义
      - 摄影机正向描述为沿上行路径跟随并同时保留人物与建筑支点可读性
      - 默认先不用全局绝对否定句控制动作
      - 必须保留的排除项应局部化对象化并只用于会毁掉剧情身份空间或关键连续性的严重错误
      - 若平台存在独立negative-prompt接口必须按该平台官方语义使用不得把专用负向控制与主提示自然语言否定混为一谈
      - 不能因为减少否定词而撤销真实物理空间拓扑角色身份揭示预算等硬不变量
    checks:
      - positive_target_specification
      - physical_motion_envelope
      - hard_vs_soft_constraint
      - negation_scope
      - feasible_action_space
      - substitute_behavior_risk
      - prompt_constraint_budget
      - platform_negative_prompt_support
      - screen_evidence_link
    targeted_eval:
      method: A_B_C_compare
      A: 绝对否定为主，例如不飞跃不悬空不做超级英雄动作
      B: 纯正向动作规格，明确外立面支点短距离腾跃抓踩与连续上行
      C: 正向动作规格加最多一条局部严重错误排除
      compare:
        - desired_motion_adherence
        - unintended_staircase_or_route_substitution
        - physical_contact_and_body_mechanics
        - motion_energy_and_lightness
        - spatial_continuity
        - camera_behavior
        - visual_quality
        - prompt_complexity
        - rigidity_or_overconstraint
        - catastrophic_error_rate

  - id: REG-ASSET-001
    title: 登记资产必须正式提交
    must_preserve:
      - status_active_unless_user_says_candidate
      - update_formal_asset_registry
      - update_related_scene_or_character_if_needed
      - fetch_after_commit_verify
      - memory_not_substitute_for_registry

  - id: REG-SOURCE-001
    title: 旧版总纲不得夺权
    must_preserve:
      - reject_legacy_as_active
      - use_PROJECT_INDEX_authority
      - use_fixed_current_AI电影系统

  - id: REG-DIRECTOR-FULL-OUTPUT-001
    title: 用户仅提供剧情并要求完整处理时，必须返回完整导演合同
    must_preserve:
      - 母本与连续性核对
      - 场景诊断
      - 导演意图
      - 人物目标与潜台词
      - 节拍
      - 表演
      - 场面调度
      - 镜头脚本
      - 摄影与灯光
      - 剪辑与声音
      - AI资产清单
      - 模型自主权合同
      - 视频模型执行稿
      - 验收清单
      - 结尾接口
    checks:
      - complete_director_output_contract
      - not_execution_prompt_only
      - continuity_before_execution
      - ending_handoff

  - id: REG-MAP-001
    title: 钟楼与关所的空间职责不得再混同
    must_preserve:
      - 主街南北向
      - 高架石桥东西向且桥在上主街在下
      - 钟楼后方为关所底层入口
      - 关所内部回旋楼梯向上到中层
      - 场景库不得建立第二套拓扑
    checks:
      - map_authority
      - scene_library_boundary
      - asset_direction_tags

  - id: REG-RESTORE-001
    title: 新会话可通过最小读取恢复凯姆当前段
    must_preserve:
      - 凯姆已经攀爬
      - 爱丽丝VO与行动并行
      - 妇女开窗后再察觉高处异常
      - 菲奥奈原本带队巡查且队友处理插队
      - 凯姆登顶搜索而目标未确认
      - 不提前展示男孩翅膀
    checks:
      - project_index_first
      - read_sets_minimal_retrieval
      - screenplay_continuity_map_asset_recall
      - CALC
      - reveal_budget

  - id: REG-REVISION-001
    title: 多轮修改时省略不等于撤销
    must_preserve:
      - 后续版本未重复旧约束时不得自动取消已接受约束
      - 只有明确撤销或不可兼容冲突才能移除旧约束
      - 新版本继承仍有效的剧情角色空间资产连续性与导演约束
      - 冲突不清时保留旧约束并提示风险
    checks:
      - revision_series_identity
      - constraint_ledger
      - omitted_not_revoked
      - continuity_inheritance

  - id: REG-REVISION-002
    title: 多轮修订只逐轮留痕并在收敛点学习
    must_preserve:
      - 每次实质修改记录最小Delta
      - 中间revision不自动晋级长期技能
      - 约3到5次实质修改或关键确认可形成checkpoint
      - 切换下一镜或下一场前自动执行Trajectory Final-Delta
      - 最终提示词不得整体机械复制成通用规则
      - candidate或scene_verified与更高成熟度晋级分离
    checks:
      - micro_capture
      - checkpoint
      - semantic_finalization
      - trajectory_final_delta
      - maturity_gate
      - regression_gate
