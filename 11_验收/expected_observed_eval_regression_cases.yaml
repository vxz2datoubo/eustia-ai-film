suite_id: EXPECTED_OBSERVED_EVAL_REGRESSION_V1
status: candidate
schema_authority: 10_运行时/screen_observable_audible_ir_schema.yaml#reverse_compiler
learning_authority: 08_系统学习/反馈反推与系统反哺引擎.md
runtime: tools/learning_retriever/learning_retriever/expected_observed.py

policy:
  runtime_compares_supplied_observation_only: true
  automatic_media_grading_claim_forbidden: true
  missing_observation_is_unknown_not_fail: true
  sparse_sampling_cannot_claim_frame_by_frame: true
  aesthetic_score_forbidden: true
  prompt_auto_rewrite_forbidden: true
  eval_cannot_promote_maturity: true
  failure_category_must_use_canonical_reverse_compiler_vocabulary: true

cases:
  - id: EOE-EXACT-PASS-001
    payload:
      eval_id: EOE-EXACT-PASS-001
      expectations:
        - field: composition
          declared_value:
            primary_mechanism: lateral_pressure
            camera_reason: preserve_right_to_left_pursuit
          provenance:
            source: cinematic_intent_contract
      reverse_observation:
        fields:
          observed_camera_state:
            position: exterior_side
        expectation_observations:
          composition:
            comparison_mode: exact_value
            observed_value:
              primary_mechanism: lateral_pressure
              camera_reason: preserve_right_to_left_pursuit
            evidence_refs: [frame_review_001]
        provenance:
          evidence_source: verified_review_notes
          inspection_mode: manual_structured_review
          temporal_coverage:
            type: relevant_shot_full_duration
          confidence: HIGH
          media_refs: [video_generation_001]
          claimed_frame_by_frame_review: false
      context:
        model: C-DANCE
        model_version: "2.5"
        work_item_id: TEST-SHOT-001
    expected_status: PASS
    expected_field_outcomes:
      composition: PASS
    expected_control_status: UNCONTROLLED

  - id: EOE-EXPLICIT-FAIL-001
    payload:
      eval_id: EOE-EXPLICIT-FAIL-001
      expectations:
        - field: capture_intent
          declared_value:
            camera_physical_position: exterior_side
          provenance:
            source: locked_director_camera
      reverse_observation:
        fields:
          observed_camera_state:
            position: frontal
        expectation_observations:
          capture_intent:
            comparison_mode: exact_value
            observed_value:
              camera_physical_position: frontal
            failure_category: camera
            evidence_refs: [frame_004]
            note: generated camera moved to frontal coverage
        provenance:
          evidence_source: reviewed_generated_video
          inspection_mode: manual_structured_review
          temporal_coverage:
            type: relevant_shot_full_duration
          confidence: HIGH
          media_refs: [video_generation_002]
          claimed_frame_by_frame_review: false
      context:
        model: C-DANCE
        model_version: "2.5"
    expected_status: FAIL
    expected_field_outcomes:
      capture_intent: FAIL
    expected_failure_categories: [camera]
    expected_repair_fields: [capture_intent]

  - id: EOE-MISSING-OBSERVATION-UNKNOWN-001
    payload:
      eval_id: EOE-MISSING-OBSERVATION-UNKNOWN-001
      expectations:
        - field: color_intent
          declared_value:
            color_thesis: cold_stone_with_natural_skin
          provenance:
            source: cinematic_intent_contract
      reverse_observation:
        fields: {}
        expectation_observations: {}
        provenance:
          evidence_source: user_text_report
          inspection_mode: manual_structured_review
          temporal_coverage:
            type: partial
          confidence: MEDIUM
          media_refs: []
          claimed_frame_by_frame_review: false
    expected_status: INCOMPLETE
    expected_field_outcomes:
      color_intent: UNKNOWN
    expected_repair_fields: [color_intent]

  - id: EOE-SAMPLED-EVIDENCE-001
    payload:
      eval_id: EOE-SAMPLED-EVIDENCE-001
      expectations:
        - field: attention_handoff
          declared_value:
            reveal_on_return: subject_already_absent
          provenance:
            source: cinematic_intent_contract
      reverse_observation:
        fields:
          observed_attention_handoff:
            return_master_first_sample: subject_absent
        expectation_observations:
          attention_handoff:
            comparison_mode: explicit_observation_judgment
            match_state: MATCH
            observed_value:
              return_master_first_sample: subject_absent
            evidence_refs: [sample_24, sample_25]
        provenance:
          evidence_source: fixed_interval_screenshot_archive
          inspection_mode: fixed_interval_sampling
          temporal_coverage:
            type: full_duration_sampled
            sample_interval_seconds: 0.25
          confidence: MEDIUM
          media_refs: [screenshot_archive_001]
          claimed_frame_by_frame_review: false
    expected_status: PASS
    expected_field_outcomes:
      attention_handoff: PASS
    expected_sampled_temporal_evidence: true
    expected_frame_by_frame_claim: false

  - id: EOE-CONFOUNDED-CONTROL-001
    payload:
      eval_id: EOE-CONFOUNDED-CONTROL-001
      expectations:
        - field: visual_density
          declared_value:
            detail_budget: selective
          provenance:
            source: cinematic_intent_contract
      reverse_observation:
        fields:
          observed_visual_hierarchy:
            detail_budget: selective
        expectation_observations:
          visual_density:
            comparison_mode: exact_value
            observed_value:
              detail_budget: selective
        provenance:
          evidence_source: controlled_generation_review
          inspection_mode: manual_structured_review
          temporal_coverage:
            type: relevant_shot_full_duration
          confidence: HIGH
          media_refs: [generation_B]
          claimed_frame_by_frame_review: false
      controlled_eval:
        target_variable: reference_signal_decoupling
        confounds: [camera_position_changed]
    expected_status: PASS
    expected_control_status: CONFOUNDED

  - id: EOE-PROD-KAIM-DISAPPEARANCE-001
    provenance_note: "real production regression distilled from Issue #19 comment 5454103847; this is sampled temporal evidence, not decoded frame-by-frame review"
    payload:
      eval_id: EOE-PROD-KAIM-DISAPPEARANCE-001
      expectations:
        - field: attention_handoff
          declared_value:
            from_roi: woman_face_covered_by_garment
            cut_or_transition_event: cutaway_to_woman_closeup
            to_roi: same_master_kaim_previous_position
            withheld_information: kaim_exits_offscreen_during_cutaway
            reveal_on_return: kaim_already_absent_on_first_returned_master_image
          provenance:
            source: issue_19_micro_capture_5454103847
            role: locked_editorial_reveal_requirement
      reverse_observation:
        fields:
          observed_attention_handoff:
            sequence:
              - master_with_kaim_and_woman
              - woman_closeup_garment_covering_face
              - return_same_master_kaim_still_visible
              - kaim_visibly_departs
              - position_finally_empty
            reveal_effect: intended_absence_surprise_destroyed
        expectation_observations:
          attention_handoff:
            comparison_mode: explicit_observation_judgment
            match_state: CONTRADICTS
            observed_value:
              first_returned_master_state: kaim_still_visible
              exit_visibility: kaim_visibly_departs_after_return
            failure_category: attention_handoff
            evidence_refs:
              - issue_19_comment_5454103847
              - 连续截图(1).rar
            note: returned master exposes Kaim before his exit, so the offscreen-disappearance reveal fails
        provenance:
          evidence_source: fixed_interval_screenshot_archive_plus_review_record
          inspection_mode: fixed_interval_sampling
          temporal_coverage:
            type: full_duration_sampled
            sample_interval_seconds: 0.25
            sample_count: 60
            readable_samples: 59
            dense_review_window: woman_corset_edit
          confidence: HIGH
          media_refs:
            - 连续截图(1).rar
            - issue_19_comment_5454103847
          claimed_frame_by_frame_review: false
      context:
        work_item_id: issue-19-kaim-scarf-clothesline
    expected_status: FAIL
    expected_field_outcomes:
      attention_handoff: FAIL
    expected_failure_categories: [attention_handoff]
    expected_repair_fields: [attention_handoff]
    expected_sampled_temporal_evidence: true
    expected_frame_by_frame_claim: false

