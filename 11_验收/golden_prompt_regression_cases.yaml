suite:
  id: GOLDEN_PROMPT_INGESTION_REGRESSION
  status: active
  last_updated: 2026-08-15
  protocol: 08_系统学习/优秀提示词案例学习协议.md
  media_evidence_schema: 10_运行时/golden_media_evidence_schema.yaml

cases:
  - id: REG-GPCL-TRIGGER-001
    title: 用户明确判定优秀时自动执行学习与入库两步
    input_condition: 用户明确说这是优秀提示词或优秀案例并要求以后参考或录入
    must_preserve:
      - execute_learn_step
      - execute_register_step
      - no_extra_user_database_work
      - report_verified_write_status_only

  - id: REG-GPCL-VERBATIM-001
    title: Golden Case 必须保存真实原提示词原文
    input_condition: 用户提供完整真实源提示词并判定为优秀案例
    must_preserve:
      - source_prompt_verbatim_exact
      - no_silent_rewrite
      - no_grammar_cleanup_in_source_field
      - normalized_summary_kept_separate

  - id: REG-GPCL-PROMOTION-001
    title: 案例优秀不能自动把抽取技能晋升为通用稳定规则
    input_condition: 单个案例被用户明确判定优秀但没有跨场景复验
    must_preserve:
      - case_registration_allowed
      - extracted_skill_default_candidate_when_prompt_only
      - output_verified_may_support_scene_verified_only_with_real_result
      - no_auto_project_verified
      - no_auto_general_stable

  - id: REG-GPCL-EDCM-001
    title: 优秀案例必须覆盖用户四层认知映射
    input_condition: 对优秀案例执行学习
    must_preserve:
      - k0_explicit_known
      - k1_implicit_known_with_evidence
      - k2_adjacent_unknown_as_candidate
      - k3_unknown_unknown_not_forced_into_rule

  - id: REG-GPCL-DUPLICATE-001
    title: 重复优秀案例不制造重复条目
    input_condition: 相同提示词再次被用户判定优秀或产生新一轮验证
    must_preserve:
      - exact_duplicate_updates_existing_case
      - new_validation_appended
      - variant_uses_parent_case_id
      - no_duplicate_semantic_skill_without_new_boundary

  - id: REG-GPCL-HOLDOUT-001
    title: 被直接检索进生成上下文的 Golden Case 不能独立证明泛化
    input_condition: 同一 Golden Case 被作为 few-shot 或 precedent 直接提供给生成系统
    must_preserve:
      - exact_case_not_sole_holdout
      - sibling_transfer_case_preferred
      - contrast_case_when_needed
      - detect_template_memorization
      - detect_negative_transfer

  - id: REG-GPCL-VERSION-001
    title: 模型版本变化触发案例重验证而不是静默沿用
    input_condition: Seedance Seedream ChatGPT 或其他相关模型发生大版本或行为变化
    must_preserve:
      - preserve_historical_case
      - mark_model_bound_case_needs_revalidation_when_relevant
      - stable_directing_principle_not_erased
      - rerun_targeted_eval_before_new_promotion

  - id: REG-GPCL-CONFLICT-001
    title: 两个优秀案例冲突时保留条件边界
    input_condition: 新 Golden Case 与旧 Golden Case 支持相反做法且二者都有有效证据
    must_preserve:
      - do_not_silently_overwrite_old_case
      - mark_conflict_or_boundary
      - route_by_context
      - require_more_evidence_for_global_rule

  - id: REG-GPCL-JUDGE-001
    title: 自动 grader 不能覆盖用户领域判断
    input_condition: 自动 grader 与用户对优秀案例的判断不一致
    must_preserve:
      - user_case_verdict_authority
      - grader_used_for_diagnostics_not_override
      - uncalibrated_reference_free_judge_low_confidence
      - maturity_requires_real_evidence

  - id: REG-GPCL-SENSITIVITY-001
    title: 公开仓库不得写入秘密凭证
    input_condition: 被判定优秀的提示词包含密码 API key token cookie private key MFA 或支付券商凭证
    must_preserve:
      - do_not_write_secret_verbatim
      - mark_registration_pending_or_redacted_source_required
      - do_not_persist_secret_in_case_registry

  - id: REG-GPCL-REPLAY-001
    title: 案例库扩大后按相关性回放而非全量注入
    input_condition: Golden Case 数量持续增长
    must_preserve:
      - retrieve_minimal_relevant_set
      - preserve_case_diversity
      - no_full_library_prompt_injection
      - conflicting_and_boundary_cases_not_discarded
      - monitor_negative_transfer

  - id: REG-GPCL-MEDIA-PERSISTENCE-001
    title: Golden 视频默认蒸馏为 GitHub 时间证据包而不是永久保存原视频
    input_condition: 用户为优秀案例提供视频或音视频
    must_preserve:
      - full_source_video_available_during_ingestion_when_possible
      - adaptive_temporal_distillation_before_discard
      - github_case_bundle_persisted
      - compressed_contact_sheets_and_selected_keyframes
      - source_video_default_not_retained
      - irreducible_motion_or_sound_evidence_may_trigger_exception
      - no_formal_asset_registration_without_explicit_asset_intent

  - id: REG-GPCL-MEDIA-RECONSTRUCTION-001
    title: 只有视频时允许反推 Prompt 但绝不能冒充真实原 Prompt
    input_condition: 用户只上传优秀视频且希望系统深度分析并反推可复现提示词
    must_preserve:
      - media_observation_allowed
      - reconstructed_prompt_allowed
      - reconstructed_prompt_provenance_inferred_from_media
      - source_prompt_verbatim_not_fabricated
      - uncertainty_and_confidence_recorded
      - no_prompt_clause_causality_claim_without_true_pair_or_intervention

  - id: REG-GPCL-MEDIA-TEMPORAL-001
    title: 视频证据采用 shot 分段加自适应时序蒸馏而不是固定帧机械堆积
    input_condition: 需要长期保存视频的视觉时间证据
    must_preserve:
      - shot_segmentation
      - baseline_sampling_as_safety_net
      - adaptive_density_at_event_boundaries
      - perceptual_deduplication
      - before_after_pairs_for_state_change
      - contact_sheets_for_compaction
      - standalone_frames_for_golden_or_causal_moments
      - frame_exact_analysis_available_when_needed
      - full_frame_dump_not_default

  - id: REG-GPCL-MEDIA-SECONDS-001
    title: 人类可见时间坐标必须以秒为主而不是帧号
    input_condition: 生成时间索引帧、timeline 或用户查询某个瞬间
    must_preserve:
      - timestamp_seconds_primary
      - start_end_seconds_for_intervals
      - three_decimal_seconds_when_precision_is_needed
      - frame_index_secondary_technical_only
      - filename_contains_seconds_not_only_frame_number
      - support_time_to_description
      - support_description_to_time

  - id: REG-GPCL-MEDIA-AUDIO-001
    title: 声音必须与同一秒级视觉时间轴对齐而不是只生成无时间转写
    input_condition: 优秀案例视频包含对白、音乐、音效或环境声
    must_preserve:
      - dialogue_asr_with_timestamps
      - speaker_when_inferable
      - speech_style_and_prosody_description
      - bgm_and_intensity
      - sfx_and_ambience
      - audio_onsets_or_beats_when_relevant
      - audio_visual_sync_relation
      - acknowledge_text_does_not_losslessly_preserve_timbre_or_mix

  - id: REG-GPCL-MEDIA-CAUSAL-001
    title: 世界物理因果电影视听因果与 Prompt 控制因果必须分离
    input_condition: 系统从视频分析“为什么发生”或“哪句提示词产生这个效果”
    must_preserve:
      - graph_A_world_physical_separate
      - graph_B_cinematic_perceptual_separate
      - graph_C_prompt_control_separate
      - temporal_order_not_equal_causality
      - alternatives_and_counterfactuals
      - evidence_time_ranges_on_edges
      - true_prompt_pair_or_intervention_needed_for_strong_prompt_causality

  - id: REG-GPCL-MEDIA-AB-001
    title: Prompt 控制因果晋级必须经过受控 A/B/C 或复现
    input_condition: 系统准备把某个提示词变量从相关性提升为可迁移因果规则
    must_preserve:
      - freeze_model_version_mode_references_and_unrelated_clauses_when_possible
      - vary_primary_variable
      - compare_observed_delta
      - preserve_user_verdict
      - detect_control_drift
      - confounded_result_cannot_promote
      - cross_case_reproduction_before_higher_maturity

  - id: REG-GPCL-MEDIA-AESTHETIC-001
    title: 媒体案例形成可检索审美先例但不声称修改模型权重
    input_condition: 用户希望大量优秀案例逐步形成项目审美与主动参考能力
    must_preserve:
      - aesthetic_and_director_fingerprint_extraction
      - temporal_grammar_and_sound_relation_extraction
      - proactive_retrieval_when_relevant
      - mechanism_level_transfer
      - no_model_weight_training_claim
      - human_verdict_authority

  - id: REG-GPCL-MEDIA-FUZZY-RECALL-001
    title: 模糊自然语言必须能通过检索卡召回功能相似案例
    input_condition: 用户只说“时尚片走秀那种”“像之前高级广告那种”等模糊意图
    must_preserve:
      - zh_en_alias_expansion
      - retrieve_by_task_function_and_director_goal_first
      - surface_style_is_secondary_signal
      - rerank_by_motion_camera_lighting_sound_mechanisms
      - open_only_top_relevant_cases
      - report_transferable_mechanisms_not_wholesale_style_copy

  - id: REG-GPCL-MEDIA-SCALE-001
    title: 数千案例规模下必须压缩文件数与近重复证据
    input_condition: Golden Case 数量增长至数百至数千
    must_preserve:
      - contact_sheets_preferred_for_dense_visual_overview
      - perceptual_deduplication
      - adaptive_per_case_visual_budget
      - text_retrieval_card_as_stable_recall_entry
      - no_full_visual_library_context_injection
      - media_storage_layer_may_migrate_without_changing_case_id

  - id: REG-GPCL-MEDIA-RIGHTS-001
    title: 第三方优秀视频不得因学习而自动完整写入公开仓库
    input_condition: 优秀案例来源是第三方电影广告短视频或其他受版权保护内容
    must_preserve:
      - source_provenance
      - rights_status_check
      - public_repo_guard
      - only_permitted_or_necessary_derived_evidence
      - private_storage_preferred_when_rights_unclear

  - id: REG-GPCL-MEDIA-ASSET-BOUNDARY-001
    title: Golden 媒体证据不会自动升级成正式视觉资产
    input_condition: 用户把视频作为优秀案例或学习证据上传但没有说设为正式资产
    must_preserve:
      - golden_evidence_allowed
      - formal_asset_registration_not_triggered
      - no_scene_asset_identity_pollution
      - explicit_asset_intent_required
