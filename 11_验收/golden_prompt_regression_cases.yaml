suite:
  id: GOLDEN_PROMPT_INGESTION_REGRESSION
  status: active
  last_updated: 2026-08-15
  protocol: 08_系统学习/优秀提示词案例学习协议.md
  media_evidence_schema: 10_运行时/golden_media_evidence_schema.yaml

cases:
  - id: REG-GPCL-TRIGGER-001
    title: 用户明确判定优秀时自动执行学习与入库两步
    input_condition: 用户明确说这是优秀提示词或优秀案例并要求以后参考或录入
    must_preserve:
      - execute_learn_step
      - execute_register_step
      - no_extra_user_database_work
      - report_verified_write_status_only

  - id: REG-GPCL-VERBATIM-001
    title: Golden Case 必须保存原提示词原文
    input_condition: 用户提供完整提示词并判定为优秀案例
    must_preserve:
      - source_prompt_verbatim_exact
      - no_silent_rewrite
      - no_grammar_cleanup_in_source_field
      - normalized_summary_kept_separate

  - id: REG-GPCL-PROMOTION-001
    title: 案例优秀不能自动把抽取技能晋升为通用稳定规则
    input_condition: 单个案例被用户明确判定优秀但没有跨场景复验
    must_preserve:
      - case_registration_allowed
      - extracted_skill_default_candidate_when_prompt_only
      - output_verified_may_support_scene_verified_only_with_real_result
      - no_auto_project_verified
      - no_auto_general_stable

  - id: REG-GPCL-EDCM-001
    title: 优秀案例必须覆盖用户四层认知映射
    input_condition: 对优秀案例执行学习
    must_preserve:
      - k0_explicit_known
      - k1_implicit_known_with_evidence
      - k2_adjacent_unknown_as_candidate
      - k3_unknown_unknown_not_forced_into_rule

  - id: REG-GPCL-DUPLICATE-001
    title: 重复优秀案例不制造重复条目
    input_condition: 相同提示词再次被用户判定优秀或产生新一轮验证
    must_preserve:
      - exact_duplicate_updates_existing_case
      - new_validation_appended
      - variant_uses_parent_case_id
      - no_duplicate_semantic_skill_without_new_boundary

  - id: REG-GPCL-HOLDOUT-001
    title: 被直接检索进生成上下文的 Golden Case 不能独立证明泛化
    input_condition: 同一 Golden Case 被作为 few-shot 或 precedent 直接提供给生成系统
    must_preserve:
      - exact_case_not_sole_holdout
      - sibling_transfer_case_preferred
      - contrast_case_when_needed
      - detect_template_memorization
      - detect_negative_transfer

  - id: REG-GPCL-VERSION-001
    title: 模型版本变化触发案例重验证而不是静默沿用
    input_condition: Seedance Seedream ChatGPT 或其他相关模型发生大版本或行为变化
    must_preserve:
      - preserve_historical_case
      - mark_model_bound_case_needs_revalidation_when_relevant
      - stable_directing_principle_not_erased
      - rerun_targeted_eval_before_new_promotion

  - id: REG-GPCL-CONFLICT-001
    title: 两个优秀案例冲突时保留条件边界
    input_condition: 新 Golden Case 与旧 Golden Case 支持相反做法且二者都有有效证据
    must_preserve:
      - do_not_silently_overwrite_old_case
      - mark_conflict_or_boundary
      - route_by_context
      - require_more_evidence_for_global_rule

  - id: REG-GPCL-JUDGE-001
    title: 自动 grader 不能覆盖用户领域判断
    input_condition: 自动 grader 与用户对优秀案例的判断不一致
    must_preserve:
      - user_case_verdict_authority
      - grader_used_for_diagnostics_not_override
      - uncalibrated_reference_free_judge_low_confidence
      - maturity_requires_real_evidence

  - id: REG-GPCL-SENSITIVITY-001
    title: 公开仓库不得写入秘密凭证
    input_condition: 被判定优秀的提示词包含密码 API key token cookie private key MFA 或支付券商凭证
    must_preserve:
      - do_not_write_secret_verbatim
      - mark_registration_pending_or_redacted_source_required
      - do_not_persist_secret_in_case_registry

  - id: REG-GPCL-REPLAY-001
    title: 案例库扩大后按相关性回放而非全量注入
    input_condition: Golden Case 数量持续增长
    must_preserve:
      - retrieve_minimal_relevant_set
      - preserve_case_diversity
      - no_full_library_prompt_injection
      - conflicting_and_boundary_cases_not_discarded
      - monitor_negative_transfer

  - id: REG-GPCL-MEDIA-RAW-001
    title: 视频原文件是母证据序列帧只能作为派生索引
    input_condition: 用户为优秀案例同时提供生成视频
    must_preserve:
      - raw_video_primary_binary_evidence
      - original_audio_preserved_when_present
      - content_hash_recorded_when_computable
      - keyframes_and_contact_sheets_marked_derived
      - derived_frames_do_not_replace_raw_video

  - id: REG-GPCL-MEDIA-CAUSALITY-001
    title: 只有视频没有原提示词时不得伪造提示词到效果因果链
    input_condition: 用户只上传一段优秀或测试视频但未提供其源提示词
    must_preserve:
      - media_only_aesthetic_observation_allowed
      - no_reconstructed_source_prompt
      - no_prompt_clause_causality_claim
      - request_or_wait_for_source_prompt_before_pairing

  - id: REG-GPCL-MEDIA-TEMPORAL-001
    title: 视频审查采用多分辨率时序证据而非默认永久逐帧存储
    input_condition: 需要分析视频中零点几秒级动作转场身份漂移或节奏
    must_preserve:
      - whole_video_preserved
      - shot_segmentation
      - representative_keyframes
      - uniform_index_default_around_half_second
      - dense_subsecond_windows_only_where_needed
      - frame_exact_mode_for_forensic_cases
      - full_frame_dump_not_default

  - id: REG-GPCL-MEDIA-AESTHETIC-001
    title: 媒体案例形成可检索审美先例但不声称修改模型权重
    input_condition: 用户询问保存优秀视频是否会让系统形成审美或以后主动参考
    must_preserve:
      - aesthetic_fingerprint_extraction
      - temporal_grammar_and_sound_relation_extraction
      - proactive_retrieval_when_relevant
      - reference_video_reuse_when_target_model_supports_it
      - no_model_weight_training_claim
      - human_verdict_authority

  - id: REG-GPCL-MEDIA-ASSET-BOUNDARY-001
    title: 优秀视频证据不会自动升级成正式视觉资产
    input_condition: 用户把视频作为优秀案例或学习证据上传但没有说设为正式资产
    must_preserve:
      - golden_evidence_allowed
      - formal_asset_registration_not_triggered
      - no_scene_asset_identity_pollution
      - explicit_asset_intent_required
