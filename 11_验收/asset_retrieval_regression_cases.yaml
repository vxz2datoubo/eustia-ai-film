    aggregate_result:
      asset_resolution: PASS
      media_version_resolution: PASS
      pixel_access: ASSET_FOUND_PIXELS_UNAVAILABLE
      binary_retrieved: false
      pixels_opened: false
      pixels_verified_current_invocation: false
      generation_reference_bound: false
      external_fallback_attempted: false
      semantic_substitution_used: false
    interpretation:
      - 当前 invocation 再次证明 identity/version/locator metadata 与 actual binary/pixel access 必须分层。
      - exact File ID 或历史 title 出现在文字登记/验证材料中不能 false-green 为正式媒体已取得。
      - 当前结果支持继续保持 U-ASSET-RETRIEVAL-001 为 open_native_capability_observation，而非 resolved。
      - 当前证据尚不足以触发 external_storage_hard_gap_gate；未进行 GitHub binary、Cloudflare、R2 或 external_uri fallback。
    regression_mapping:
      - REG-ASSET-NATIVE-FIRST-002
      - REG-ASSET-NATIVE-FIRST-006

runtime_evidence_policy:
  current_chat_success_must_record_actual_tool_or_media_evidence: true
  historical_success_cannot_initialize_new_attempt: true
  exact_asset_identity_required_for_positive_pixel_claim: true
  semantically_similar_candidate_never_counts_as_target_asset: true
