  - id: PVM-DIALOGUE-NEG-003
    family: VN_TO_FILM_DIALOGUE
    kind: negative
    production_context: boundary
    description: "凯姆沿外墙攀爬并踩住窗台继续上升。"
    expected:
      hard_routes_absent: [VN_TO_FILM_DIALOGUE]
      selected_cases_absent: [VN-TO-FILM-DIALOGUE-001]
      receipt_complete: true

  - id: PVM-TARGET-EP1-001
    family: TARGET_ORIENTED_SPATIAL_BINDING
    kind: positive
    production_context: first_episode
    description: "圣女伊莲降临钟楼平台，群众看到圣女后跪拜。"
    expected:
      feature_present:
        relation_type: [gaze_to_target, kneeling_to_target]
        spatial_action_features: [gaze_direction, kneeling_to_target, body_orientation, locatable_target]
      hard_routes_present: [TARGET_ORIENTED_SPATIAL_BINDING, MOTIVATION_BEFORE_TONE]
      mandatory_cases_present: [CROWD-GAZE-BODY-CAMERA-BINDING-001, MOTIVE-FIRST-CROWD-001]
      selected_cases_present: [CROWD-GAZE-BODY-CAMERA-BINDING-001, MOTIVE-FIRST-CROWD-001]
      mandatory_recall_satisfied: true
      receipt_complete: true

  - id: PVM-TARGET-PURSUIT-002
    family: TARGET_ORIENTED_SPATIAL_BINDING
    kind: positive
    production_context: cross_scene
    description: "卫兵追击门口逃犯，身体持续朝向逃犯。"
