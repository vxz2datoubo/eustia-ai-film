    kind: negative
    production_context: model_boundary
    description: "凯姆沿建筑外立面攀爬，踩住窗台再抓住房檐，动作顺序必须清楚。"
    base_task:
      model:
        family: minimax_h3
        version: "1"
      scene_context: [building_exterior, window_micro_sequence, high_dynamic_motion]
      surface_similarity: [凯姆, 窗, 攀爬, 踩窗]
    expected:
      selected_cases_absent: [CD25-KAIM-WINDOW-AB-20260815]
      excluded_reasons:
        CD25-KAIM-WINDOW-AB-20260815: model_version_mismatch
      receipt_complete: true

  - id: PVM-WORLDSTATE-EP1-001
    family: CONTINUITY_WORLD_STATE
    kind: positive
    production_context: first_episode
    description: "诺瓦斯历史闪回结束回到钟楼广场时，背景状态前后不一致，必须保持世界状态连续性。"
    base_task:
      model:
        family: seedance
        version: "2.5"
        aliases: ["C-DANCE 2.5"]
      scene_context: [novus, historical_saints, worldbuilding_sequence]
      character_context: [nun_continuity]
    expected:
      feature_present:
        relation_type: [continuity_inheritance]
        spatial_action_features: [continuity_inheritance]
        failure_mechanism: [canonical_world_state_violation]
      selected_cases_present: [NOVUS-30S-REAL-OUTPUT-001]
      receipt_complete: true

  - id: PVM-WORLDSTATE-XSCENE-002
    family: CONTINUITY_WORLD_STATE
    kind: positive
    production_context: cross_scene
    description: "追逐镜头切回主街后，背景状态前后不一致，连续性必须继承。"
    base_task:
      model:
        family: seedance
        version: "2.5"
      scene_context: [multi_shot_sequence]
    expected:
      feature_present:
        relation_type: [continuity_inheritance]
        spatial_action_features: [continuity_inheritance]
        failure_mechanism: [canonical_world_state_violation]
      selected_cases_present: [NOVUS-30S-REAL-OUTPUT-001]
      receipt_complete: true

  - id: PVM-WORLDSTATE-NEG-003
    family: CONTINUITY_WORLD_STATE
    kind: fail_closed
    production_context: boundary
    description: "人物面部特写，只看表情，不展示背景。"
    expected_error:
      stage: feature_compiler
      code: NO_RECOGNIZED_DIRECTOR_FEATURES

aggregate_acceptance:
  all_required_families_present: true
  false_positive_routes: 0
  false_negative_mandatory_recalls: 0
  authority_boundary_violations: 0
  all_receipts_complete_when_runtime_reaches_retrieval: true
  no_eval_case_may_promote_maturity: true
