        relation_type: [escape_from_target]
      hard_routes_present: [TARGET_ORIENTED_SPATIAL_BINDING]
      mandatory_cases_present: [CROWD-GAZE-BODY-CAMERA-BINDING-001]
      selected_cases_present: [CROWD-GAZE-BODY-CAMERA-BINDING-001]
      mandatory_recall_satisfied: true
      receipt_complete: true

  - id: PVM-TARGET-NEG-004
    family: TARGET_ORIENTED_SPATIAL_BINDING
    kind: negative
    production_context: boundary
    description: "凯姆看向远处，神情紧张。"
    expected:
      feature_present:
        spatial_action_features: [gaze_direction]
      hard_routes_absent: [TARGET_ORIENTED_SPATIAL_BINDING]
      selected_cases_absent: [CROWD-GAZE-BODY-CAMERA-BINDING-001]
      receipt_complete: true

  - id: PVM-TARGET-FAILCLOSED-005
    family: TARGET_ORIENTED_SPATIAL_BINDING
    kind: fail_closed
    production_context: boundary
    description: "摄影机面向北方建立镜头。"
    expected_error:
      stage: feature_compiler
      code: NO_RECOGNIZED_DIRECTOR_FEATURES

  - id: PVM-TARGET-MULTICLAUSE-006
    family: TARGET_ORIENTED_SPATIAL_BINDING
    kind: negative
    production_context: boundary
    description: "群众看到圣女后，贵族欢呼，随后拜下。"
    expected:
      feature_present:
        relation_type: [gaze_to_target]
      feature_absent:
        relation_type: [kneeling_to_target]
      hard_routes_present: [TARGET_ORIENTED_SPATIAL_BINDING, MOTIVATION_BEFORE_TONE]
      selected_cases_present: [CROWD-GAZE-BODY-CAMERA-BINDING-001, MOTIVE-FIRST-CROWD-001]
      receipt_complete: true

  - id: PVM-CONTACT-EP1-001
    family: EVENT_ORDER_CONTACT_CAUSALITY
    kind: positive
    production_context: first_episode
    description: "凯姆沿建筑外立面攀爬，踩住窗台再抓住房檐，动作顺序必须清楚。"
    base_task:
      model:
        family: seedance
        version: "2.5"
        aliases: ["C-DANCE 2.5"]
      scene_context: [building_exterior, window_micro_sequence, high_dynamic_motion]
      character_context: [kaim_climbing]
      surface_similarity: [凯姆, 窗, 攀爬, 踩窗]
    expected:
      feature_present:
        dramatic_function: [contact_causality, event_order]
        spatial_action_features: [support_point, sequential_contact]
        failure_mechanism: [contact_binding_fail, event_order_fail]
      selected_cases_present: [CD25-KAIM-WINDOW-AB-20260815]
      receipt_complete: true

  - id: PVM-CONTACT-XSCENE-002
    family: EVENT_ORDER_CONTACT_CAUSALITY
    kind: positive
    production_context: cross_scene
    description: "逃犯在城堡外墙抓住石沿、踩住横梁连续上爬，先后顺序不能错。"
    base_task:
      model:
        family: seedance
        version: "2.5"
        aliases: ["Seedance 2.5"]
      scene_context: [building_exterior, high_dynamic_motion]
    expected:
      feature_present:
        dramatic_function: [contact_causality, event_order]
        spatial_action_features: [support_point, sequential_contact]
        failure_mechanism: [contact_binding_fail, event_order_fail]
      selected_cases_present: [CD25-KAIM-WINDOW-AB-20260815]
      receipt_complete: true

  - id: PVM-CONTACT-MODEL-NEG-003
