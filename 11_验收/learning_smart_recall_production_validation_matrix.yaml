schema_version: "1.0"
component: LEARNING_SMART_RECALL_V1_1_PRODUCTION_VALIDATION_MATRIX
role: eval_fixture_only
authority_boundary:
  this_file_is_not_learning_authority: true
  route_authority: 10_运行时/director_route_index.yaml
  recall_metadata: 10_运行时/learning_recall_index.yaml
  learning_payload_authority_remains_in_existing_canonical: true
  may_not_change_weights_maturity_scope_conflict_or_case_authority: true
purpose: >-
  Prove that the canonical natural-language director runtime transfers learned
  mechanisms across characters, scenes, wording and action surfaces, while
  preserving fail-closed, model-version and mandatory-recall boundaries.

required_families:
  - MOTIVATION_BEFORE_TONE
  - EXPOSITION_STALL
  - VN_TO_FILM_DIALOGUE
  - TARGET_ORIENTED_SPATIAL_BINDING
  - EVENT_ORDER_CONTACT_CAUSALITY
  - CONTINUITY_WORLD_STATE

cases:
  - id: PVM-MOTIVE-EP1-001
    family: MOTIVATION_BEFORE_TONE
    kind: positive
    production_context: first_episode
    description: "施粥队列里的灾民面对救济教会的反应显得不合理，先从他们当前依赖与希望判断态度。"
    expected:
      feature_present:
        dramatic_function: [crowd_reaction]
        relation_type: [crowd_to_institution]
        failure_mechanism: [motive_tone_mismatch]
      hard_routes_present: [MOTIVATION_BEFORE_TONE]
      mandatory_cases_present: [MOTIVE-FIRST-CROWD-001]
      selected_cases_present: [MOTIVE-FIRST-CROWD-001]
      mandatory_recall_satisfied: true
      receipt_complete: true

  - id: PVM-MOTIVE-XSCENE-002
    family: MOTIVATION_BEFORE_TONE
    kind: positive
    production_context: cross_scene
    description: "城堡避难所中的居民面对王室救济时态度与现实依赖不匹配，不能直接套用统一情绪。"
    expected:
      feature_present:
        dramatic_function: [crowd_reaction]
        relation_type: [crowd_to_institution]
        failure_mechanism: [motive_tone_mismatch]
      hard_routes_present: [MOTIVATION_BEFORE_TONE]
      mandatory_cases_present: [MOTIVE-FIRST-CROWD-001]
      selected_cases_present: [MOTIVE-FIRST-CROWD-001]
      mandatory_recall_satisfied: true
      receipt_complete: true

  - id: PVM-MOTIVE-NEG-003
    family: MOTIVATION_BEFORE_TONE
    kind: negative
    production_context: boundary
    description: "凯姆一个人看向远处，神情冷静。"
    expected:
      hard_routes_absent: [MOTIVATION_BEFORE_TONE]
      selected_cases_absent: [MOTIVE-FIRST-CROWD-001]
      receipt_complete: true

  - id: PVM-EXPOSITION-EP1-001
    family: EXPOSITION_STALL
    kind: positive
    production_context: first_episode
    description: "爱丽丝用画外音解释羽化病和猎羽规则，凯姆同时攀爬，不能让信息段拖慢推进。"
    expected:
      feature_present:
        dramatic_function: [worldbuilding_exposition]
        failure_mechanism: [exposition_stall]
      hard_routes_present: [EXPOSITION_STALL]
      mandatory_cases_present: [EXPOSITION-MEDIA-DISTANCE-001]
      selected_cases_present: [EXPOSITION-MEDIA-DISTANCE-001]
      mandatory_recall_satisfied: true
      receipt_complete: true

  - id: PVM-EXPOSITION-XSCENE-002
    family: EXPOSITION_STALL
    kind: positive
    production_context: cross_scene
    description: "老兵在酒馆讲述旧时代历史，世界观说明不能让节奏停滞。"
    expected:
      feature_present:
        dramatic_function: [worldbuilding_exposition]
        failure_mechanism: [exposition_stall]
      hard_routes_present: [EXPOSITION_STALL]
      mandatory_cases_present: [EXPOSITION-MEDIA-DISTANCE-001]
      selected_cases_present: [EXPOSITION-MEDIA-DISTANCE-001]
      mandatory_recall_satisfied: true
      receipt_complete: true

  - id: PVM-EXPOSITION-NEG-003
    family: EXPOSITION_STALL
    kind: negative
    production_context: boundary
    description: "凯姆抓住屋檐翻上屋顶。"
    expected:
      hard_routes_absent: [EXPOSITION_STALL]
      selected_cases_absent: [EXPOSITION-MEDIA-DISTANCE-001]
      receipt_complete: true

  - id: PVM-DIALOGUE-EP1-001
    family: VN_TO_FILM_DIALOGUE
    kind: positive
    production_context: first_episode
    description: "把蒂娅原作里的galgame长句改成真人能一口听懂的口语化台词，同时保留原意。"
    expected:
      feature_present:
        dramatic_function: [dialogue_adaptation]
