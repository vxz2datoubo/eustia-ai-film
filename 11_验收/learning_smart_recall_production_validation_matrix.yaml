    family: VN_TO_FILM_DIALOGUE
    kind: positive
    production_context: cross_scene
    description: "老兵这段文字游戏式对白太书面，需要改成能呼吸和表演的说法。"
    expected:
      feature_present:
        dramatic_function: [dialogue_adaptation]
        failure_mechanism: [written_sentence_shape_leak]
