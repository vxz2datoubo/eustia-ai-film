    expected_status: PASS
    expected_diagnostics_absent: [CAPTURE_SUBSTRATE_UNMOTIVATED]

  - id: CIC-CAPTURE-UNMOTIVATED-001
    contract:
      contract_id: CIC-CAPTURE-UNMOTIVATED-001
      intent:
        capture_intent:
