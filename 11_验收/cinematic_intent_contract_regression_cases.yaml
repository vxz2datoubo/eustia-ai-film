suite_id: CINEMATIC_INTENT_CONTRACT_REGRESSION_V1
status: candidate
schema_authority: 10_运行时/screen_observable_audible_ir_schema.yaml#CinematicIntentIR
method_authority: 01_AI电影系统/AI电影系统.md#CINEMATIC-VISUAL-GRAMMAR-001
runtime: tools/learning_retriever/learning_retriever/cinematic_intent.py

policy:
  runtime_is_mechanical_contract_layer_only: true
  may_invent_director_choices: false
  may_rewrite_canonical_or_blocking: false
  aesthetic_incompleteness_default_severity: WARNING
  unknown_fields_fail_closed: true
  material_overlay_requires_provenance: true
  non_material_fields_must_not_enter_overlay: true
  learning_maturity_unchanged: true
  proposal_cannot_supply_locked_contracts: true
  serialized_upstream_lock_authority_forbidden: true
  python_reachable_minter_forbidden: true
  camera_authority_requires_canonical_readback: true
  camera_sensitive_compile_fails_closed_without_canonical_binding: true

compile_cases:
  - id: CIC-VALID-MINIMAL-001
    contract:
      contract_id: CIC-VALID-MINIMAL-001
      intent:
        unresolved_state: "凯姆必须在被追上前穿过街区。"
        composition:
          primary_mechanism: lateral_pressure
          camera_reason: "保持右到左的逃亡方向在画面中清楚可读。"
          screen_pressure: "凯姆从画面右侧向左侧推进。"
        color_intent:
          color_thesis: "阴冷石城中保留人物肤色与布料真实差异。"
          physical_color_sources: [灰石墙, 晴阴天自然光, 衣物本色]
        visual_density:
          primary_story_clue: 凯姆的横向移动
          mundane_or_soft_regions: [远处屋顶, 非关键摊位]
          detail_budget: selective
      provenance:
        composition:
          source: director_visual_plan
          source_field: composition
        color_intent:
          source: scene_look_plan
          source_field: physical_sources
      context:
        material_fields: [composition, color_intent]
    expected_status: PASS
    expected_overlay_fields: [composition, color_intent]
    expected_absent_overlay_fields: [unresolved_state, visual_density]
    expected_diagnostics: []

  - id: CIC-COMPOSITION-WARN-001
    contract:
      contract_id: CIC-COMPOSITION-WARN-001
      intent:
        composition:
          primary_mechanism: centered_symmetry
      provenance:
