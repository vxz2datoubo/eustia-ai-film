camera_authority_gate_cases:
  - id: CIC-CAMERA-POSITION-REQUIRES-CANONICAL-READBACK-001
    contract:
      contract_id: CIC-CAMERA-POSITION-REQUIRES-CANONICAL-READBACK-001
      intent:
        capture_intent:
          camera_physical_position: exterior_side
      provenance:
        capture_intent:
          source: downstream_camera_proposal
      context:
        material_fields: [capture_intent]
    expected_error_code: MISSING_CANONICAL_UPSTREAM_BINDING

  - id: CIC-LENS-INTENT-REQUIRES-CANONICAL-READBACK-001
    contract:
      contract_id: CIC-LENS-INTENT-REQUIRES-CANONICAL-READBACK-001
      intent:
