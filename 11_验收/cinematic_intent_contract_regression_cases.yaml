gates:
  schema_static_check_vocabulary_is_reused: true
  structural_runtime_codes_are_not_director_method_rules: true
  fail_closed_authority_boundary: true
  overlay_omits_non_material_fields: true
  reverse_expectations_preserve_declared_value_and_provenance_only: true
  no_model_specific_behavior_universalized: true
  downstream_proposal_cannot_mint_lock_authority: true
  python_downstream_caller_has_no_reachable_lock_minter: true
  camera_sensitive_compile_requires_future_canonical_readback: true
