failure_boundaries:
  - 不把“不写逐shot时长”升级为跨模型通用规则；这是当前Seedance 2.5真实案例支持的版本绑定策略。
  - 当音乐卡点、对白同步、精确动作窗口或模型节奏失控时，应重新引入时间码或时长预算。
  - 状态映射必须先把角色/陪体/环境职责分开；参考图职责混乱时，双状态切换仍可能身份漂移。
  - 回忆段若包含多个子环境，应显式分区，避免把单一环境参考误当所有回忆空间。
  - 质量/风格词必须绑定剧情功能，禁止脱离功能单独堆叠。
  - 单次优秀组合只能证明组合方案在当前案例成立，不能把其中某个词单独宣称为因果主因。
  - 未打开参考图像素时，reference responsibility是Prompt结构证据，不是reference match验收证据。

