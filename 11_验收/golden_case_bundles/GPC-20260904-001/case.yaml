normalized_summary: >-
  约28秒、13个编号shot的悲剧羁绊连续剧情。提示词先建立GLOBAL故事合同，再按现实/回忆两个状态域声明人物、动物和环境参考图职责，逐shot给景别、机位、可观察表演动作和关系变化，不逐shot写死秒数。实际输出采样呈现明显非均匀自动节奏：简单建立镜头较短，识别、伸手、温暖回忆与终局余震获得更长停留；现实冷绿去饱和与回忆暖阳形成清楚对照，最后静态远景回到死亡现实。参考图本体未提供给当前审片，因此只验证输出状态变化与Prompt意图的一致性，不声称参考像素身份匹配已验证。

