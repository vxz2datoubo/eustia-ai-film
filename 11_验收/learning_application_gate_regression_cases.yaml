schema_version: "1.0"
suite_id: LEARNING_APPLICATION_GATE_REGRESSION
status: active
cases:
  - id: LAG-REG-001-MEANS-VS-END
    title: "一次性手段不得冒充永久学习"
    setup:
      work_item: "KAIM-HIGH-SEARCH-30S / window micro-sequence"
      user_surface_constraint: "妇女不能提前看到凯姆"
      inferred_intent_candidate: "制造侦查中的近失误悬念，让观众担心主角被发现"
    must_preserve:
      - "当前 work item 内 surface constraint 可作为 LOCK"
      - "work item 结束后 surface constraint 自动失去跨镜头注入资格"
      - "可保留带置信度和边界的导演意图/机制 candidate"
      - "后续相似悬念场景允许使用不同手段实现同一目的"
    must_not:
      - "把妇女不能看到凯姆写成全项目永久规则"
      - "把配角不能发现主角写成通用原则"

  - id: LAG-REG-002-CONTEXTUAL-CONFLICT
    title: "表面矛盾经验可按条件共存"
    setup:
      lesson_a: "主提示尽量用正向动作规格，避免全局绝对否定"
      lesson_b: "身份、揭示预算、空间拓扑等灾难性错误允许局部硬排除"
    expected:
      conflict_type: CONTEXTUAL_COEXISTENCE
      action: "按风险与作用域选择，不删除任一经验"

  - id: LAG-REG-003-TRUE-SUPERSESSION
    title: "更强证据可替代旧错误结论但保留历史"
    setup:
      old_lesson: "candidate / single-sample"
      new_evidence: "多次真实生成 + 控制变量更完整 + 反例能解释旧结论"
    expected:
      relation: SUPERSEDES
      old_state: deprecated_or_bounded
      history_preserved: true
      silent_overwrite: false

  - id: LAG-REG-004-UNRESOLVED-DEFER
    title: "高影响意图冲突无法裁决时必须问用户"
    setup:
      plausible_intents:
        - "优先悬念"
        - "优先现实隐蔽性"
      consequence: "两种选择会产生明显不同调度"
    expected:
      action: ASK_MINIMUM_DISCRIMINATIVE_QUESTION
      arbitrary_choice_forbidden: true

  - id: LAG-REG-005-PREOUTPUT-SELF-REVISION
    title: "已知适用经验被草稿违反时不得直接交卷"
    setup:
      retrieved_rule: "当前 shot 画外音角色不得因名字出现而视觉实体化"
      draft_violation: "草稿把 VO 角色放进可见人群"
    expected:
      pre_output_status: FAIL_THEN_SELF_REVISE
      user_receives_known_bad_draft: false

  - id: LAG-REG-006-EXPIRED-EPISODE
    title: "旧镜头局部限制不得污染新镜头"
    setup:
      expired_constraint: "妇女不能提前看到凯姆"
      next_work_item: "无该妇女、无窗口、无近失误功能的新场景"
    expected:
      injected_as_lock: false
      deeper_mechanism_may_retrieve_only_if_functionally_relevant: true

  - id: LAG-REG-007-OPPORTUNISTIC-AB
    title: "低成本自然机会可主动提出 A/B 验证"
    setup:
      candidate_lesson: "互斥屏幕状态可能比继续堆先后词更利于 C-DANCE 2.5 执行时序"
      natural_test_opportunity: true
      incremental_cost: low
    expected:
      action: OFFER_CONTROLLED_AB
      expensive_target_generation_auto_triggered: false
      versions_should_both_be_usable: true

  - id: LAG-REG-008-CONFOUNDED-AB
    title: "A/B 同时改关键摄影变量必须判混杂"
    setup:
      target_variable: "prompt structure"
      uncontrolled_change: "camera orientation / composition"
    expected:
      result: CONFOUNDED_INCONCLUSIVE
      maturity_promotion_allowed: false

  - id: LAG-REG-009-CONFIDENCE-VECTOR
    title: "用户偏好事实高置信不等于因果与迁移高置信"
    setup:
      fact: "用户明确说 A 的电影感比 B 好"
    expected:
      observation_confidence: HIGH
      causal_attribution_confidence: "not_automatically_HIGH"
      transfer_confidence: "not_automatically_HIGH"
      universal_promotion_allowed: false

  - id: LAG-REG-010-MODEL-VERSION
    title: "模型版本变化后版本绑定经验必须重验"
    setup:
      old_lesson_scope: "C-DANCE 2.5 / Seedance 2.5"
      current_model_or_version: changed
    expected:
      state: needs_revalidation
      silent_reuse_as_stable_fact: false

  - id: LAG-REG-011-MOTIVE-BEFORE-TONE
    title: "群众反应必须先由动机与依赖关系推出"
    setup:
      scene: "极端贫困地区的教会施粥广场"
      crowd_conditions:
        - "生活恶劣且长期处于不安全感"
        - "对直接执法和治安机构存在现实不满"
        - "教会持续提供粥、面包、仪式和精神希望"
        - "圣女被群众视为超越现实处境的希望来源"
      trigger: "钟楼平台出现教会人物"
    must_retrieve:
      route: MOTIVATION_BEFORE_TONE
      learning_case: MOTIVE-FIRST-CROWD-001
    mandatory_reasoning:
      - immediate_need
      - material_dependency
      - hope_dependency
      - spiritual_dependency
      - institutional_function
      - grievance_target
      - emotional_ambivalence
      - group_heterogeneity
    expected:
      generic_anti_authority_comedy_allowed_without_motive_support: false
      attitude_toward_police_may_be_copied_to_church_without_relation_scan: false
      macro_silence_or_reverence_may_be_selected_when_motive_supports_it: true
      individual_reactions_may_remain_heterogeneous: true

  - id: LAG-REG-012-EXPOSITION-VALUE-BEFORE-COMPRESSION
    title: "重要世界观说明先判断价值再决定是否压缩"
    setup:
      exposition:
        topic: "浮空城市起源、圣女力量与教会制度合法性"
        duration_risk: high
        future_causal_value: high
        earlier_worldbuilding_coverage: low
        current_scene_relation: "教会仪式现场，由高阶神官公开讲述"
    must_retrieve:
      route: EXPOSITION_STALL
      learning_case: EXPOSITION-MEDIA-DISTANCE-001
    mandatory_reasoning:
      - exposition_information_value
      - placement_need
      - representation_medium
      - epistemic_status_of_history
      - temporal_distance
      - dialogue_speakability
      - return_to_present
      - asset_lock_cost
    expected:
      auto_compress_only_because_long: false
      preserve_high_value_information_when_justified: true
      visual_medium_must_match_history_epistemic_status: true
      exposition_must_return_to_present_action_or_ritual: true

  - id: LAG-REG-013-HISTORY-MEDIUM-AB-NO-PREMATURE-PROMOTION
    title: "羊皮纸与写实历史闪回必须保持开放 A/B，不能提前判胜"
    setup:
      option_a: "羊皮纸彩色简笔画，宗教共同记忆/教义距离"
      option_b: "写实真人历史闪回，强沉浸与现实感"
      current_evidence: "尚无受控真实成片A/B"
    must_retrieve:
      learning_case: EXPOSITION-MEDIA-DISTANCE-001
    expected:
      parchment_declared_universal_best: false
      realistic_flashback_declared_universal_best: false
      state: candidate_or_open_experiment
      compare:
        - worldbuilding_comprehension
        - religious_history_feeling
        - temporal_distance
        - perceived_objectivity_of_history
        - emotional_engagement
        - exposition_fatigue
        - production_cost
        - premature_worldbuilding_lock_risk
      realistic_version_dependency:
        - "初代圣女伊莲高质量神圣感角色设定/视觉资产"

  - id: LAG-REG-014-VN-TO-FILM-DIALOGUE
    title: "GAL/文字游戏原句结构不得机械复制为电影对白"
    setup:
      source_medium: "日本 GAL / 文字游戏脚本"
      dialogue_function: "高阶神官讲述世界观和宗教制度"
      source_problem: "书面说明句长、旁白化、阅读时成立但口头一次听懂较困难"
    must_retrieve:
      learning_case: VN-TO-FILM-DIALOGUE-001
    expected:
      preserve_dramatic_information: true
      preserve_character_register: true
      preserve_source_sentence_shape_by_default: false
      dialogue_should_be:
        - "可呼吸"
        - "可重音"
        - "可表演"
        - "观众一次听懂"
      locked_or_iconic_source_line_may_be_changed_without_authority: false
