suite_id: TARGETED_REPAIR_PLANNER_REGRESSION_V2
status: candidate
runtime: tools/learning_retriever/learning_retriever/targeted_repair.py
policy_authority: 10_运行时/targeted_repair_policy.yaml
source_eval_suite: 11_验收/expected_observed_eval_regression_cases.yaml

policy:
  source_binding_mode: canonical_expected_observed_reexecution
  serialized_eval_result_is_authority: false
  repair_failed_dimensions_only: true
  pass_dimensions_preserved: true
  unknown_routes_to_evidence_only: true
  prompt_auto_rewrite_forbidden: true
  generation_trigger_forbidden: true
  camera_authority_mutation_forbidden: true
  canonical_mutation_forbidden: true
  learning_writeback_forbidden: true
  maturity_promotion_forbidden: true
  causal_claim_forbidden: true

cases:
  - id: TRP-PROD-KAIM-ATTENTION-HANDOFF-001
    source_eval_case: EOE-PROD-KAIM-DISAPPEARANCE-001
    expected_source_eval_status: FAIL
    expected_repair_fields: [attention_handoff]
    expected_surface_by_field:
      attention_handoff: TRANSITION_EDIT_REVIEW
    expected_observation_sampled: true
    expected_prompt_mutation_authorized: false
    expected_generation_authorized: false

  - id: TRP-UNKNOWN-EVIDENCE-001
    source_eval_case: EOE-MISSING-OBSERVATION-UNKNOWN-001
    expected_source_eval_status: INCOMPLETE
    expected_repair_fields: [color_intent]
    expected_surface_by_field:
      color_intent: EVIDENCE_ACQUISITION
    expected_causal_evidence_status: OBSERVATIONAL_ONLY

  - id: TRP-CONFOUNDED-STATUS-001
    source_eval_case: EOE-CONFOUNDED-CONTROL-001
    expected_source_eval_status: PASS
    expected_repair_fields: []
    expected_control_status: CONFOUNDED
    expected_causal_evidence_status: HYPOTHESIS_ONLY_CONFOUNDED

structural_gate_cases:
  - id: TRP-SERIALIZED-RESULT-REJECTED-001
    source_eval_case: EOE-EXPLICIT-FAIL-001
    attack: pass_genuine_serialized_evaluator_output_to_planner
    expected_error_code: REPAIR_UPSTREAM_EVAL_REJECTED

  - id: TRP-JOINT-CATEGORY-SUBSTITUTION-001
    source_eval_case: EOE-EXPLICIT-FAIL-001
    attack:
      original_failure_category: camera
      forged_failure_category: dialogue
      jointly_edit:
        - results[0].failure_category
        - targeted_repair_handoff.items[0].failure_category
      internally_consistent_after_edit: true
    expected_error_code: REPAIR_UPSTREAM_EVAL_REJECTED
    must_not_route_to: SOUND_OR_AV_REVIEW

  - id: TRP-JOINT-FAIL-PASS-SUPPRESSION-001
    source_eval_case: EOE-EXPLICIT-FAIL-001
    attack:
      jointly_edit:
        - results[0].outcome=PASS
        - results[0].failure_category=null
        - status=PASS
        - targeted_repair_handoff.items=[]
        - targeted_repair_handoff.requires_director_or_targeted_repair_step=false
      internally_consistent_after_edit: true
    expected_error_code: REPAIR_UPSTREAM_EVAL_REJECTED
    repair_must_not_be_silently_suppressed: true

gates:
  source_payload_reexecuted_by_canonical_expected_observed: true
  serialized_evaluator_output_rejected_as_planner_input: true
  joint_result_handoff_tampering_cannot_define_repair_truth: true
  canonical_failure_category_coverage_exact: true
  each_failure_category_routes_to_exactly_one_surface: true
  pass_never_enters_repair_items: true
  unknown_never_becomes_creative_mutation: true
  control_status_survives_planning: true
  production_sampled_evidence_provenance_survives: true
  upstream_camera_authority_is_review_only_not_mutable: true
  no_second_director_authority: true
